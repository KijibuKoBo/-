name: Deploy to GitHub Pages

# main ブランチに変更が入るたびに、サイトを自動で公開します。
# （管理ページの「公開」ボタンが main にコミット → ここが走って反映）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新の1つだけに
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 家具ゲームは1枚のHTMLなので、ブラウザが古いものを握ったままになりやすい。
      # 公開のたびに版の番号を焼きこみ、小さな version.json を置いておく。
      # ページはこれだけを毎回ネットから見にいき、ちがえば一度だけ読み直す。
      - name: Stamp build id (game)
        run: |
          B="$(git rev-parse --short HEAD)"
          printf '{"v":"%s"}\n' "$B" > game/version.json
          sed -i "s/__BUILD__/$B/" game/index.html
          echo "版: $B"
          grep -c "$B" game/index.html

      # リポジトリ全体をそのまま公開（kinoko も既存アプリも両方残す）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
