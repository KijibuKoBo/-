<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きのこクイズ ｜ 石原巖のキノコ採集記録</title>
  <meta name="description" content="石原巖が長岡で採集した本物のキノコ写真で挑戦する、名前あて・食毒あてクイズ。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --forest:#1f3a2e; --forest-deep:#16271f; --gold:#a8854a; --gold-soft:#c9a86a;
      --cream:#f4efe4; --paper:#fbf8f1; --ink:#2b2a25; --sub:#6f6a5c; --line:#ddd5c4;
      --food:#2f6b3a; --pois:#b03a2e; --unfit:#9a8f73; --unknown:#7a7368;
      --serif:"Shippori Mincho", serif; --sans:"Noto Sans JP", sans-serif; --latin:"Cormorant Garamond", serif;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{ font-family:var(--serif); color:var(--ink); background:var(--cream); line-height:1.7; -webkit-font-smoothing:antialiased; }

    .topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; background:var(--forest-deep); color:#f1ede2; }
    .topbar__brand{ text-decoration:none; color:#f1ede2; line-height:1.2; }
    .topbar__brand small{ display:block; font-size:.68rem; letter-spacing:.14em; color:var(--gold-soft); }
    .topbar__brand b{ font-size:1.05rem; font-weight:700; letter-spacing:.06em; }
    .topbar__back{ color:var(--gold-soft); text-decoration:none; font-family:var(--sans); font-size:.86rem; }

    .wrap{ max-width:560px; margin:0 auto; padding:26px 16px 70px; }

    /* start screen */
    .start{ text-align:center; }
    .start__en{ font-family:var(--latin); letter-spacing:.4em; color:var(--gold); font-size:1rem; }
    .start__ja{ font-size:2.1rem; margin:6px 0 4px; font-weight:800; letter-spacing:.05em; }
    .start__desc{ color:var(--sub); font-size:.92rem; margin:10px 0 26px; }
    .modes{ display:flex; flex-direction:column; gap:14px; }
    .mode{ display:block; width:100%; text-align:left; cursor:pointer; border:1px solid var(--line);
      background:var(--paper); border-radius:14px; padding:18px 20px; transition:.15s; }
    .mode:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.08); }
    .mode__t{ font-size:1.2rem; font-weight:700; color:var(--forest); }
    .mode__t .emoji{ margin-right:8px; }
    .mode__d{ font-family:var(--sans); font-size:.82rem; color:var(--sub); margin-top:4px; }
    .mode__best{ font-family:var(--sans); font-size:.74rem; color:var(--gold); margin-top:6px; }

    /* quiz screen */
    .hud{ display:flex; align-items:center; justify-content:space-between; font-family:var(--sans); font-size:.85rem; color:var(--sub); margin-bottom:10px; }
    .hud__score b{ color:var(--forest); font-size:1.05rem; }
    .bar{ height:6px; background:#e6dfce; border-radius:99px; overflow:hidden; margin-bottom:16px; }
    .bar__fill{ height:100%; background:var(--gold); width:0; transition:width .3s; }
    .qphoto{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:14px; background:#e8e2d4; display:block; box-shadow:0 8px 22px rgba(0,0,0,.12); }
    .qtext{ text-align:center; font-size:1.15rem; font-weight:700; margin:16px 0 14px; }
    .opts{ display:flex; flex-direction:column; gap:10px; }
    .opt{ font-family:var(--serif); font-size:1.05rem; font-weight:600; cursor:pointer; border:1px solid var(--line);
      background:var(--paper); color:var(--ink); border-radius:12px; padding:15px 18px; text-align:center; transition:.12s; }
    .opt:hover:not(:disabled){ border-color:var(--gold); }
    .opt:disabled{ cursor:default; }
    .opt.correct{ background:var(--food); border-color:var(--food); color:#fff; }
    .opt.wrong{ background:var(--pois); border-color:var(--pois); color:#fff; }
    .opt.dim{ opacity:.5; }
    .opts--edib .opt{ font-size:1.15rem; }

    .reveal{ margin-top:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .reveal__judge{ font-family:var(--sans); font-weight:700; font-size:1rem; margin-bottom:8px; }
    .reveal__judge.ok{ color:var(--food); }
    .reveal__judge.ng{ color:var(--pois); }
    .reveal__name{ font-size:1.25rem; font-weight:800; }
    .reveal__name .badge{ font-family:var(--sans); font-size:.72rem; font-weight:700; color:#fff; padding:2px 10px; border-radius:999px; margin-left:8px; vertical-align:middle; }
    .reveal__meta{ font-family:var(--sans); font-size:.82rem; color:var(--sub); margin-top:6px; line-height:1.7; }
    .next{ display:block; width:100%; margin-top:14px; font-family:var(--sans); font-weight:700; font-size:1rem;
      background:var(--forest); color:#fff; border:none; border-radius:12px; padding:15px; cursor:pointer; }
    .next:hover{ background:#274b3a; }

    /* result */
    .result{ text-align:center; padding-top:10px; }
    .result__score{ font-family:var(--latin); font-size:4rem; color:var(--forest); font-weight:600; line-height:1; }
    .result__score span{ font-size:1.6rem; color:var(--sub); }
    .result__msg{ font-size:1.2rem; font-weight:700; margin:12px 0; }
    .result__best{ font-family:var(--sans); font-size:.85rem; color:var(--gold); margin-bottom:22px; }
    .result__btns{ display:flex; flex-direction:column; gap:10px; }
    .btn-primary,.btn-ghost{ font-family:var(--sans); font-weight:700; font-size:1rem; border-radius:12px; padding:14px; cursor:pointer; border:1px solid var(--forest); }
    .btn-primary{ background:var(--forest); color:#fff; }
    .btn-ghost{ background:transparent; color:var(--forest); }
    .loading{ text-align:center; color:var(--sub); padding:60px; font-family:var(--sans); }
    [hidden]{ display:none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="index.html"><small>石原巖の</small><b>キノコ採集記録</b></a>
    <a class="topbar__back" href="index.html">← ホームへ</a>
  </header>

  <main class="wrap">
    <div id="loading" class="loading">読み込み中…</div>

    <!-- スタート -->
    <section id="start" class="start" hidden>
      <span class="start__en">MUSHROOM QUIZ</span>
      <h1 class="start__ja">きのこクイズ</h1>
      <p class="start__desc">石原さんが長岡で撮った<b>本物のキノコ写真</b>で挑戦！<br>全10問。モードを選んでください。</p>
      <div class="modes">
        <button class="mode" data-mode="name">
          <div class="mode__t"><span class="emoji">🍄</span>名前あてクイズ</div>
          <div class="mode__d">写真を見て、正しい名前を4つから選ぼう。</div>
          <div class="mode__best" id="bestName"></div>
        </button>
        <button class="mode" data-mode="edib">
          <div class="mode__t"><span class="emoji">⚠️</span>食毒あてクイズ</div>
          <div class="mode__d">このキノコは食べられる？毒？を当てよう。</div>
          <div class="mode__best" id="bestEdib"></div>
        </button>
      </div>
      <p class="start__desc" style="margin-top:22px;font-size:.78rem">
        ※クイズは学習用です。実際の採集では、必ず専門家や図鑑で確認し、少しでも不安なキノコは食べないでください。
      </p>
    </section>

    <!-- クイズ -->
    <section id="quiz" hidden>
      <div class="hud">
        <span id="qnum"></span>
        <span class="hud__score">スコア <b id="score">0</b></span>
      </div>
      <div class="bar"><div class="bar__fill" id="bar"></div></div>
      <img id="qphoto" class="qphoto" alt="キノコの写真" />
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="reveal" class="reveal" hidden></div>
      <button id="next" class="next" hidden>次へ →</button>
    </section>

    <!-- 結果 -->
    <section id="result" class="result" hidden>
      <div class="result__score"><span id="rscore">0</span><span>/10</span></div>
      <div class="result__msg" id="rmsg"></div>
      <div class="result__best" id="rbest"></div>
      <div class="result__btns">
        <button class="btn-primary" id="again">もう一度</button>
        <button class="btn-ghost" id="tomodes">モードを選ぶ</button>
      </div>
    </section>
  </main>

  <script>
    const $=(s)=>document.querySelector(s);
    const EDCOLOR={ "食用":"var(--food)","毒":"var(--pois)","食不適":"var(--unfit)","不詳":"var(--unknown)" };
    const N=10;
    const state={ pool:[], mode:null, order:[], i:0, score:0, answered:false };

    init();
    async function init(){
      let data;
      try{ data=await fetch("data/records.json",{cache:"no-store"}).then(r=>r.json()); }
      catch{ $("#loading").textContent="データを読み込めませんでした。"; return; }
      state.pool=(data.records||[]).filter(r=>r.photo);
      $("#loading").hidden=true; $("#start").hidden=false;
      showBest();
      document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));
      $("#next").addEventListener("click",nextQ);
      $("#again").addEventListener("click",()=>startGame(state.mode));
      $("#tomodes").addEventListener("click",toStart);
    }

    function bestKey(m){ return "kinoko_quiz_best_"+m; }
    function getBest(m){ try{ return Number(localStorage.getItem(bestKey(m))||0); }catch{ return 0; } }
    function showBest(){
      const bn=getBest("name"), be=getBest("edib");
      $("#bestName").textContent = bn?`最高スコア ${bn}/10`:"";
      $("#bestEdib").textContent = be?`最高スコア ${be}/10`:"";
    }

    function pickPool(){
      if(state.mode==="edib") return state.pool.filter(r=>["食用","毒","食不適"].includes(r.edibility));
      return state.pool;
    }
    function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    function startGame(mode){
      state.mode=mode; state.i=0; state.score=0; state.answered=false;
      const pool=pickPool();
      state.order=shuffle(pool).slice(0,N);
      $("#start").hidden=true; $("#result").hidden=true; $("#quiz").hidden=false;
      renderQ();
    }
    function toStart(){ $("#quiz").hidden=true; $("#result").hidden=true; $("#start").hidden=false; showBest(); }

    function renderQ(){
      state.answered=false;
      const r=state.order[state.i];
      $("#qnum").textContent=`第 ${state.i+1} / ${N} 問`;
      $("#score").textContent=state.score;
      $("#bar").style.width=`${(state.i)/N*100}%`;
      $("#qphoto").src=r.photo;
      $("#reveal").hidden=true; $("#reveal").innerHTML=""; $("#next").hidden=true;
      const opts=$("#opts"); opts.innerHTML="";
      if(state.mode==="name"){
        $("#qtext").textContent="このキノコの名前は？";
        opts.className="opts";
        const others=shuffle(state.pool.filter(x=>x.wamei!==r.wamei).map(x=>x.wamei)
          .filter((v,i,a)=>a.indexOf(v)===i)).slice(0,3);
        const choices=shuffle([r.wamei,...others]);
        choices.forEach(c=>opts.appendChild(makeOpt(c, c===r.wamei, r)));
      }else{
        $("#qtext").innerHTML=`「${esc(r.wamei)}」は…？`;
        opts.className="opts opts--edib";
        [["食用","🍽 食べられる"],["食不適","😖 食べない方がいい"],["毒","☠️ 毒"]].forEach(([val,label])=>
          opts.appendChild(makeOpt(label, val===r.edibility, r, val)));
      }
    }

    function makeOpt(label, isCorrect, r, edibVal){
      const b=document.createElement("button");
      b.className="opt"; b.textContent=label;
      b.addEventListener("click",()=>answer(b,isCorrect,r,edibVal));
      return b;
    }

    function answer(btn, isCorrect, r, edibVal){
      if(state.answered) return;
      state.answered=true;
      if(isCorrect) state.score++;
      const opts=[...document.querySelectorAll(".opt")];
      opts.forEach(o=>{ o.disabled=true;
        // mark correct one
        if(state.mode==="name"){ if(o.textContent===r.wamei) o.classList.add("correct"); }
      });
      if(state.mode==="edib"){
        const correctLabel={"食用":"🍽 食べられる","食不適":"😖 食べない方がいい","毒":"☠️ 毒"}[r.edibility];
        opts.forEach(o=>{ if(o.textContent===correctLabel) o.classList.add("correct"); });
      }
      if(!isCorrect){ btn.classList.add("wrong"); }
      opts.forEach(o=>{ if(!o.classList.contains("correct")&&!o.classList.contains("wrong")) o.classList.add("dim"); });
      $("#score").textContent=state.score;
      showReveal(r,isCorrect);
      $("#next").hidden=false;
      $("#next").textContent = state.i===N-1 ? "結果を見る →" : "次へ →";
    }

    function showReveal(r,isCorrect){
      const col=EDCOLOR[r.edibility]||"var(--unknown)";
      const meta=[r.family, r.area, r.date && fmtDate(r.date)].filter(Boolean).join(" ／ ");
      const cau = r.caution ? `<div style="color:var(--pois);margin-top:4px">⚠ ${esc(r.caution)}</div>` : "";
      $("#reveal").innerHTML=`
        <div class="reveal__judge ${isCorrect?'ok':'ng'}">${isCorrect?'⭕ 正解！':'❌ 残念…'}</div>
        <div class="reveal__name">${esc(r.wamei)}<span class="badge" style="background:${col}">${esc(r.edibility)}</span></div>
        <div class="reveal__meta">${esc(meta)}${cau}</div>`;
      $("#reveal").hidden=false;
    }

    function nextQ(){
      state.i++;
      if(state.i>=N){ finish(); return; }
      renderQ();
    }

    function finish(){
      $("#quiz").hidden=true; $("#result").hidden=false;
      $("#bar").style.width="100%";
      $("#rscore").textContent=state.score;
      const pct=state.score/N;
      let msg;
      if(pct===1) msg="🏆 全問正解！キノコ博士！";
      else if(pct>=0.8) msg="🌟 お見事！かなりの通です";
      else if(pct>=0.5) msg="🍄 なかなか！その調子";
      else msg="🌱 これから覚えていきましょう";
      $("#rmsg").textContent=msg;
      const prev=getBest(state.mode); const best=Math.max(prev,state.score);
      try{ localStorage.setItem(bestKey(state.mode),best); }catch{}
      $("#rbest").textContent = state.score>prev ? "自己ベスト更新！ 🎉" : `自己ベスト ${best}/10`;
    }

    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    function fmtDate(iso){ const d=new Date(iso); return isNaN(d)?iso:`${d.getFullYear()}年${d.getMonth()+1}月`; }
  </script>
</body>
</html>
