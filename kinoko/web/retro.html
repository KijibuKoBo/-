  <meta name="description" content="8ビット風アクション。山道を奥へ進み、たおれ木・ヘビ・スズメバチ・クマをよけながらキノコを採る。スピード3段階。" />

  <style>
    :root{ --bg:#101010; --nes:#d02020; --grey:#c8c8c8; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html,body{ margin:0; padding:0; background:var(--bg); color:#fff; font-family:"DotGothic16","Press Start 2P",monospace; overscroll-behavior:none; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#000; border-bottom:2px solid #333; }
    .topbar a{ color:#f8d878; text-decoration:none; font-size:14px; }
    .wrap{ max-width:560px; margin:0 auto; padding:10px 8px 40px; }
    .tv{ background:#000; border:6px solid #2a2a2a; border-radius:14px; padding:6px; box-shadow:0 0 0 2px #444, 0 12px 30px rgba(0,0,0,.6); position:relative; }
    canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }
    .scan{ position:absolute; inset:6px; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); border-radius:8px; }
    /* コントローラー */
    .pad{ margin-top:12px; background:#d8d0c8; border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; box-shadow:inset 0 -4px 0 #a89f96; }
    .dpad{ position:relative; width:104px; height:104px; touch-action:none; }
    .dpad i{ position:absolute; background:#202020; border-radius:5px; pointer-events:none; }
    .dpad i.h{ left:0; top:36px; width:104px; height:32px; } .dpad i.v{ left:36px; top:0; width:32px; height:104px; }
    .dpad b{ position:absolute; left:44px; top:44px; width:16px; height:16px; border-radius:50%; background:#3a3a3a; pointer-events:none; }
    .dpad .dk{ position:absolute; border:none; background:transparent; padding:0; cursor:pointer; }
    .dpad .dk::after{ content:""; position:absolute; left:50%; top:50%; width:0; height:0; transform:translate(-50%,-50%); border:9px solid transparent; }
    .dpad .dk--l{ left:0; top:30px; width:44px; height:44px; } .dpad .dk--l::after{ border-right-color:#6a6a6a; margin-left:-4px; }
    .dpad .dk--r{ left:60px; top:30px; width:44px; height:44px; } .dpad .dk--r::after{ border-left-color:#6a6a6a; margin-left:4px; }
    .dpad .dk--d{ left:30px; top:60px; width:44px; height:44px; } .dpad .dk--d::after{ border-top-color:#6a6a6a; margin-top:4px; }
    .dpad .dk--l.is-on::after{ border-right-color:#f8d878; }
    .dpad .dk--r.is-on::after{ border-left-color:#f8d878; }
    .dpad .dk--d.is-on::after{ border-top-color:#f8d878; }
    .dpad .dk.is-on{ background:rgba(255,255,255,.14); border-radius:6px; }
    .mid{ display:flex; flex-direction:column; align-items:center; gap:6px; }
    .mid .lbl{ font-family:"Press Start 2P"; font-size:9px; color:#444; letter-spacing:1px; }
    .mid button{ width:54px; height:18px; border:none; border-radius:9px; background:#3a3a3a; cursor:pointer; }
    .ab{ display:flex; gap:12px; justify-content:flex-end; align-items:flex-end; }
    .ab div{ text-align:center; }
    .ab button{ width:68px; height:68px; border-radius:50%; border:none; background:var(--nes); color:#fff; font-family:"Press Start 2P"; font-size:20px; cursor:pointer; box-shadow:inset 0 -6px 0 #8e1010, 0 3px 0 #6e0c0c; }
    .ab button:active{ transform:translateY(3px); box-shadow:inset 0 -3px 0 #8e1010; }
    .ab span{ display:block; font-size:12px; color:#333; margin-top:4px; font-weight:700; }
    .hint{ text-align:center; color:#888; font-size:12px; margin-top:10px; line-height:1.6; }
    .tools{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
    .tools button{ font-family:"DotGothic16"; font-size:13px; background:#222; color:#ddd; border:1px solid #444; border-radius:8px; padding:6px 12px; cursor:pointer; }
    @media (max-width:380px){ .ab button{ width:58px; height:58px; } .dpad{ width:88px; height:88px; } .dpad i.h{ top:30px; width:88px; height:28px; } .dpad i.v{ left:30px; width:28px; height:88px; } .dpad b{ left:36px; top:36px; } .dpad .dk--l{ top:24px; width:38px; height:40px; } .dpad .dk--r{ left:50px; top:24px; width:38px; height:40px; } .dpad .dk--d{ left:24px; top:50px; width:40px; height:38px; } }

<body>
  <header class="topbar"><a href="index.html">◀ イワオトキノコ</a><a href="walk.html">山歩きへ ▶</a></header>
  <main class="wrap">
    <div class="tv"><canvas id="cv" width="512" height="480"></canvas><div class="scan"></div></div>
    <div class="pad">
      <div class="dpad">
        <i class="h"></i><i class="v"></i><b></b>

    <p class="hint">キーボード：<b>←→</b>＝左右にうごく　<b>↓</b>＝しゃがむ　<b>Z</b>＝A（とる）　<b>X</b>／<b>スペース</b>＝B（ジャンプ）　<b>Enter</b>＝START<br>※あそび用です。本物の採集は図鑑・専門家で確認を。</p>

  <script>
  (async function(){
    const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
    ctx.imageSmoothingEnabled=false;
    const W=512,H=480,PX=2; // 1ドット=2px
    const JP='16px "DotGothic16"', EN='16px "Press Start 2P"', EN8='8px "Press Start 2P"';
    try{ await Promise.all([document.fonts.load(JP), document.fonts.load(EN)]); }catch{}

    /* ---------- データ ---------- */
    let pool=[], CROPS={};
    try{ const d=await fetch("data/records.json",{cache:"no-store"}).then(r=>r.json());
      pool=(d.records||[]).filter(r=>r.photo && ["食用","毒","食不適"].includes(r.edibility)); }catch{}
    try{ CROPS=(await fetch("data/crops.json",{cache:"no-store"}).then(r=>r.json())).crops||{}; }catch{}
    function drawCrop(m,dx,dy,dw,dh){
      const c=CROPS[m.rec.photo], iw=m.img.naturalWidth||m.img.width, ih=m.img.naturalHeight||m.img.height;
      if(c && iw && ih) ctx.drawImage(m.img, c[0]*iw, c[1]*ih, c[2]*iw, c[3]*ih, dx,dy,dw,dh);
      else ctx.drawImage(m.img,dx,dy,dw,dh);
    }
    const STAGES=[
      {no:"1-1", name:"とざんぐち", sky:"#5c94fc", hill:"#38b040", hill2:"#00a800", ground:"#2c8c34", path:"#c09050", path2:"#a87c40", tree:"#007800", tree2:"#00a800", speed:.0068, gap:78, pois:.30, haz:.18, mix:[.36,.46,.18,.00,.00], fog:0, night:0},
      {no:"1-2", name:"ぶなばやし", sky:"#f8a860", hill:"#8c5c1c", hill2:"#c07c30", ground:"#7c6c24", path:"#a87c3c", path2:"#8c6430", tree:"#a83c00", tree2:"#e06c1c", speed:.0086, gap:66, pois:.36, haz:.24, mix:[.28,.28,.24,.14,.06], fog:0, night:0},
      {no:"1-3", name:"きりのおね", sky:"#b8b8b8", hill:"#7c7c7c", hill2:"#989898", ground:"#6c7c6c", path:"#8c8c84", path2:"#74746c", tree:"#485848", tree2:"#5c6c5c", speed:.0104, gap:58, pois:.42, haz:.30, mix:[.24,.20,.24,.22,.10], fog:1, night:0},
      {no:"1-4", name:"さんちょう", sky:"#000058", hill:"#003820", hill2:"#005830", ground:"#1c4420", path:"#5c4c34", path2:"#463a28", tree:"#003820", tree2:"#005830", speed:.0124, gap:50, pois:.48, haz:.34, mix:[.20,.18,.24,.24,.14], fog:0, night:1},
    ];
    const PER_STAGE=10, LIVES=3;
    const SPD=[{n:"おそい",m:.72},{n:"ふつう",m:1.00},{n:"はやい",m:1.36}];
    let spd=1;
    try{ const raw=localStorage.getItem("kinoko_retro_spd");
      if(raw!==null && raw!==""){ const v=Number(raw); if(v>=0&&v<=2) spd=v|0; } }catch{}
    function saveSpd(){ try{ localStorage.setItem("kinoko_retro_spd",String(spd)); }catch{} }
    function spdM(){ return SPD[spd].m; }
    const STAGE_BGM=["hunter","buna","kiri","yoru"];
    function stageBGM(){ if(window.BGM) BGM.switchTo(STAGE_BGM[Math.min(G.stage,STAGE_BGM.length-1)]); }
    const NESCAP=["#d82800","#f83800","#f8b800","#e45c10","#b8b8b8","#f8f8f8","#a8e4b8","#8c5c1c","#fc9838","#f8d878","#7c2c00","#c86c4c","#503000","#e0e0a0","#6c3c9c"];

    /* ---------- ドット絵 ---------- */
    const PAL={ ".":null, k:"#000000", h:"#f0e0c0", s:"#f8c890", g:"#202020", w:"#ffffff", j:"#3050a8", J:"#4870d0", b:"#6c7c40", p:"#303848", o:"#181818", l:"#48a0f8", e:"#f8e8c8", E:"#d8c8a0", r:"#f83800", c:"#d82800", W:"#f0f8ff", Y:"#f8b800", a:"#181818" };
    /* 後ろ姿（背負いカゴ）14×20 */
    const BACK=[
     [ // 歩き1
      "....hhhhhh....",
      "...hhhhhhhh...",
      "..hhhhhhhhhhhh",
      "....kkkkkk....",
      "....kkkkkk....",
      "....ssssss....",
      "...JJJJJJJJ...",
      "..JJJJJJJJJJ..",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      "..jjjjjjjjjj..",
      "..jjjjjjjjjj..",
      "...pppppp.....",
      "...pppppp.....",
      "...pp..pp.....",
      "...pp..pp.....",
      "...oo..oo.....",
      "..ooo..ooo...."],
     [ // 歩き2
      "....hhhhhh....",
      "...hhhhhhhh...",
      "..hhhhhhhhhhhh",
      "....kkkkkk....",
      "....kkkkkk....",
      "....ssssss....",
      "...JJJJJJJJ...",
      "..JJJJJJJJJJ..",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      "..jjjjjjjjjj..",
      "..jjjjjjjjjj..",
      "....pppppp....",
      "...pppppppp...",
      "...pp....pp...",
      "..pp......pp..",
      "..oo......oo..",
      ".ooo......ooo."],
     [ // ジャンプ
      "....hhhhhh....",
      "...hhhhhhhh...",
      "..hhhhhhhhhhhh",
      "....kkkkkk....",
      "....kkkkkk....",
      "....ssssss....",
      "l..JJJJJJJJ..l",
      "l.JJJJJJJJJJ.l",
      "lbbEEEEEEEEbbl",
      ".bbEeeeeeeEbb.",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      "..jjjjjjjjjj..",
      "..pppppppppp..",
      "..pp......pp..",
      ".pp........pp.",
      ".oo........oo.",
      "..............",
      "..............",
      ".............."],
     [ // しゃがむ（ハチをやりすごす）
      "..............",
      "..............",
      "..............",
      "..............",
      "..............",
      "....hhhhhh....",
      "...hhhhhhhh...",
      "..hhhhhhhhhhhh",
      "....kkkkkk....",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      ".bbEEEEEEEEbb.",
      "..jjjjjjjjjj..",
      "..jjjjjjjjjj..",
      "..pppppppppp..",
      "..pppppppppp..",
      "..pp......pp..",
      "..pp......pp..",
      "..oo......oo..",
      ".ooo......ooo."],
     [ // とる（かがむ）
      "..............",
      "..............",
      "....hhhhhh....",
      "...hhhhhhhh...",
      "..hhhhhhhhhhhh",
      "....kkkkkk....",
      "....ssssss....",
      "...JJJJJJJJ...",
      ".bbEEEEEEEEbb.",
      ".bbEeeeeeeEbb.",
      ".bbEEEEEEEEbb.",
      "..jjjjjjjjjj..",
      "..jjjjjjjjjj..",
      "..jjs....sjj..",
      "..pppppppp....",
      "..pppppppp....",
      "..pp....pp....",
      "..pp....pp....",
      "..oo....oo....",
      ".ooo....ooo..."],
    ];
    const MUSH=[
      "...cccccc...",
      "..cwccccwc..",
      ".ccccccwccc.",
      ".cwcccccccw.",
      ".cccccccccc.",
      "kcccccccccck",
      "....eeee....",
      "....EeeE....",
      "....eeee....",
      "....EeeE....",
      "...eeeeee...",
    ];
    const BEE=[
     [ // 羽 上
      "....WW...WW..",
      "...WWWW.WWWW.",
      "kkkYYkkYYkkY.",
      "kkkYYkkYYkkYr",
      ".kkYYkkYYkkY.",
      "..a.......a.."],
     [ // 羽 ひらき
      ".............",
      "..WWWW.WWWW..",
      "kkkYYkkYYkkY.",
      "kkkYYkkYYkkYr",
      ".kkYYkkYYkkY.",
      ".WW.......WW."],
    ];
    /* 回復のくだもの */
    const FPAL={ ".":null, k:"#000000", G:"#1c6c24", L:"#58a83c", O:"#f87800", Y:"#f8d878", P:"#6c3c9c", V:"#9c5cb8", R:"#a01038", w:"#f8f8f8" };
    const FRUIT={
      kaki:{ name:"カキ", map:[
        "....GG....",
        "...GkG....",
        "..OOOOOO..",
        ".OOOOOOOO.",
        "OOOOOOOOOO",
        "OOOOYOOOOO",
        "OOOOOOOOOO",
        ".OOOOOOOO.",
        "..OOOOOO..",
        "...OOOO..."]},
      ichijiku:{ name:"イチジク", map:[
        "....L.....",
        "...LGL....",
        "...PPPP...",
        "..PPPPPP..",
        ".PPPVPPPP.",
        ".PPPPPPPP.",
        "PPPPPPPPPP",
        ".PPPPPPPP.",
        "..PPPPPP..",
        "...PPPP..."]},
      kuwa:{ name:"クワの実", map:[
        "....G.....",
        "....L.....",
        "...RRR....",
        "..RRRRR...",
        ".RRkRRkRR.",
        ".RRRRRRRR.",
        "..RkRRkR..",
        "..RRRRRR..",
        "...RRRR...",
        "....RR...."]},
    };
    const FKEYS=Object.keys(FRUIT);
    const HEART=["..rr.rr..",".rrrrrrr.",".rrrrrrr.","..rrrrr..","...rrr...","....r...."];
    const BASKET=["..EEEEEE..",".E......E.","EEEEEEEEEE",".EEEEEEEE.",".EEEEEEEE.","..EEEEEE.."];
    function sprite(map,x,y,pal,s=PX){ for(let r=0;r<map.length;r++){ const row=map[r]; for(let c=0;c<row.length;c++){ const col=pal[row[c]]; if(!col) continue; ctx.fillStyle=col; ctx.fillRect(Math.round(x+c*s),Math.round(y+r*s),Math.ceil(s),Math.ceil(s)); } } }

    /* ---------- サウンド（矩形波チップチューン） ---------- */
    let AC=null, sound=true;
    try{ sound=localStorage.getItem("kinoko_retro_snd")!=="0"; }catch{}
    const sndBtn=document.getElementById("sndBtn"); const updSnd=()=>sndBtn.textContent=sound?"♪ おと ON":"♪ おと OFF"; updSnd();
    sndBtn.onclick=()=>{ sound=!sound; try{localStorage.setItem("kinoko_retro_snd",sound?"1":"0");}catch{} updSnd(); if(sound) beep([[880,.06],[1320,.08]]); };
    function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch{return null;} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
    function beep(notes,type="square",vol=.08){ if(!sound) return; const a=ac(); if(!a) return; let t=a.currentTime;
      notes.forEach(([f,d])=>{ const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol*2.6,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02); t+=d; }); }
    const SFX={
      coin:()=>beep([[988,.06],[1319,.14]]),
      jump:()=>{ if(!sound) return; const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type="square"; o.frequency.setValueAtTime(220,a.currentTime); o.frequency.exponentialRampToValueAtTime(660,a.currentTime+.12); g.gain.setValueAtTime(.18,a.currentTime); g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+.16); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+.18); },
      hurt:()=>beep([[180,.1],[120,.14],[80,.22]],"sawtooth",.09),
      bad:()=>beep([[300,.08],[240,.12]],"square",.07),
      good:()=>beep([[659,.06],[784,.06],[1047,.12]]),
      swish:()=>beep([[520,.05],[380,.05]],"triangle",.05),
      buzz:()=>beep([[150,.07],[130,.07],[150,.07],[130,.09]],"sawtooth",.05),
      hiss:()=>beep([[900,.05],[760,.05],[640,.07]],"sawtooth",.04),
      roar:()=>beep([[110,.14],[92,.16],[78,.22]],"sawtooth",.10),
      heal:()=>beep([[784,.07],[988,.07],[1319,.09],[1568,.22]]),
      clear:()=>beep([[523,.12],[659,.12],[784,.12],[1047,.28]]),
      over:()=>beep([[440,.16],[349,.16],[262,.16],[196,.4]],"triangle",.1),
      start:()=>beep([[659,.08],[659,.08],[0,.06],[659,.08],[0,.06],[523,.08],[659,.08],[784,.2]]),
      ending:()=>beep([[523,.15],[659,.15],[784,.15],[1047,.15],[784,.15],[1047,.4]]),
    };

    /* ---------- 擬似3D（手前 ⇄ 奥） ----------
       z=0 が手前（IWAO の足元）、z=1 が地平線。 */
    const HZ=200, GY=410, FAR=1.18;
    const pz=(z)=>1/(1+Math.max(z,-0.22)*3.4);
    const pY=(z)=>HZ+(GY-HZ)*pz(z);
    const pHW=(z)=>26+196*pz(z);            // 走路の半分の幅（px）
    const pX=(lane,z)=>W/2+lane*pHW(z);
    const pS=(z)=>pz(z)*3.1;                // ドットの大きさ

    /* ---------- ゲーム状態 ---------- */
    let mode="title", frame=0, hi=0; try{ hi=Number(localStorage.getItem("kinoko_retro_hi")||0);}catch{}
    const G={};
    function reset(){
      Object.assign(G,{stage:0,score:0,lives:LIVES,basket:0,streak:0,handled:0,scrollZ:0,
        objs:[],trees:[],gapTimer:40,msg:null,shake:0,flash:0,heal:0,fly:[],stars:null,
        iwao:{lane:0,vlane:0,y:0,vy:0,jump:false,duck:false,frame:0,anim:0,pick:0,hurt:0,inv:0}});
      for(let k=0;k<14;k++) G.trees.push({lane:(k%2?1:-1)*(1.25+Math.random()*.7), z:k/14*FAR, kind:k%3});
    }
    reset();
    function stage(){ return STAGES[G.stage]; }

    /* ---------- 生成 ---------- */
    const rnd=(a)=>a[Math.floor(Math.random()*a.length)];
    function nearestCap(r,g,b){ let best=NESCAP[0],bd=1e9; NESCAP.forEach(h=>{ const R=parseInt(h.slice(1,3),16),Gg=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16); const d=(R-r)**2+(Gg-g)**2+(B-b)**2; if(d<bd){bd=d;best=h;} }); return best; }
    function laneAwayFrom(lane,minGap){ // 既存と重ならない位置
      for(let k=0;k<12;k++){ const L=-0.82+Math.random()*1.64; if(Math.abs(L-lane)>minGap) return L; }
      return lane>0?-0.7:0.7;
    }
    function spawn(){
      const s=stage();
      const near=G.objs.length?G.objs[G.objs.length-1]:null;
      const avoid=near&&near.z>FAR-0.34?near.lane:99;
      /* 回復のくだもの（体力が減っていると出やすい） */
      if(Math.random() < (G.lives<LIVES ? .14 : .04)){
        G.objs.push({kind:"fruit", fruit:rnd(FKEYS), z:FAR, lane:laneAwayFrom(avoid,.5), judged:false});
        return;
      }
      if(Math.random()<s.haz){
        const mix=s.mix; let r=Math.random(), kind="rock";
        if((r-=mix[0])<0) kind="log";
        else if((r-=mix[1])<0) kind="rock";
        else if((r-=mix[2])<0) kind="snake";
        else if((r-=mix[3])<0) kind="bee";
        else kind="bear";
        const o={kind, z:FAR, judged:false, phase:Math.random()*6.28,
                 lane: (kind==="log"||kind==="bear") ? (Math.random()*.44-.22) : laneAwayFrom(avoid,.5)};
        o.base=o.lane;
        if(kind==="bee") SFX.buzz();
        if(kind==="snake") SFX.hiss();
        if(kind==="bear") SFX.roar();
        G.objs.push(o);
        return;
      }
      const roll=Math.random(); let p;
      if(roll<s.pois) p=pool.filter(r=>r.edibility==="毒"); else if(roll<s.pois+.12) p=pool.filter(r=>r.edibility==="食不適"); else p=pool.filter(r=>r.edibility==="食用");
      if(!p.length) p=pool; if(!p.length) return;
      const rec=rnd(p);
      const m={kind:"mush", z:FAR, lane:laneAwayFrom(avoid,.5), rec, cap:"#d82800", img:new Image(), ready:false, judged:false, result:null};
      m.img.onload=()=>{ m.ready=true; try{ const oc=document.createElement("canvas"); oc.width=oc.height=8; const c2=oc.getContext("2d");
        const cr=CROPS[rec.photo], iw=m.img.naturalWidth||m.img.width, ih=m.img.naturalHeight||m.img.height;
        if(cr&&iw&&ih) c2.drawImage(m.img, cr[0]*iw, cr[1]*ih, cr[2]*iw, cr[3]*ih, 0,0,8,8); else c2.drawImage(m.img,0,0,8,8);
        const d=c2.getImageData(2,2,4,4).data; let r=0,g=0,b=0; for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];} const n=d.length/4; m.cap=nearestCap(r/n,g/n,b/n); }catch{} };
      m.img.src=rec.photo;
      G.objs.push(m);
    }

    /* ---------- 障害物・いきもの ----------
       jumpable=false は「ジャンプではよけられない」＝横にどくしかない。 */
    const HAZ={
      log:  {name:"たおれ木", w:0.62, jump:true,  duck:false, pts:30, hit:"たおれ木に ぶつかった!", mark:"Ｂ！",   col:"#f8d878"},
      rock: {name:"いし",     w:0.30, jump:true,  duck:false, pts:20, hit:"いしに つまずいた!",     mark:"！",     col:"#f8f8f8"},
      snake:{name:"ヘビ",     w:0.30, jump:true,  duck:false, pts:40, hit:"ヘビに かまれた!",       mark:"！",     col:"#a8e4b8"},
      bee:  {name:"スズメバチ",w:0.34, jump:false, duck:true,  pts:50, hit:"ハチに さされた!",       mark:"↓！",   col:"#f83800"},
      bear: {name:"クマ",     w:0.34, jump:false, duck:false, pts:80, hit:"クマに つかまった!",     mark:"にげろ!", col:"#f83800", open:0.70},
    };

    /* ---------- 判定 ---------- */
    function hurt(txt){
      const i=G.iwao;
      if(i.inv>0) return;
      G.streak=0; G.lives--; i.hurt=70; i.inv=80; G.shake=16; G.flash=8; SFX.hurt();
      G.msg={txt:txt,sub:`のこり ${Math.max(0,G.lives)}`,kind:"bad",t:80};
      if(G.lives<=0){ setTimeout(()=>{ if(mode==="play"){ mode="gameover"; SFX.over(); saveHi(); } },600); }
    }
    function judge(m,action){ // action: 'pick' | 'dodge' | 'walk'
      if(m.judged) return; m.judged=true;
      const e=m.rec.edibility; let pts=0, txt="", kind="ok";
      if(action==="pick"){
        if(e==="食用"){ G.streak++; pts=100+Math.min(G.streak-1,4)*50; txt=`たべられる! +${pts}`; G.basket++; SFX.coin(); G.fly.push({x:pX(m.lane,m.z),y:pY(m.z)-20,t:0}); }
        else if(e==="毒"){ m.result={txt:"どく!!",kind:"bad"}; G.handled++; hurt("どくキノコを とった!!");
          G.msg={txt:`${m.rec.wamei}（毒）`,sub:"とっては だめ！ -1",kind:"bad",t:90}; checkClear(); return; }
        else { G.streak=0; pts=-50; txt="まずい… -50"; kind="meh"; SFX.bad(); }
      }else if(action==="dodge"){
        if(e==="毒"){ pts=50; txt="どくを みぬいた! +50"; SFX.good(); }
        else if(e==="食用"){ G.streak=0; txt="もったいない…"; kind="meh"; }
        else { pts=20; txt="たべない キノコ +20"; SFX.good(); }
      }else{ // ふんだ
        if(e==="毒"){ m.result={txt:"どく!!",kind:"bad"}; G.handled++; hurt("どくキノコを ふんだ!!");
          G.msg={txt:`${m.rec.wamei}（毒）`,sub:"ふんでしまった -1",kind:"bad",t:90}; checkClear(); return; }
        else if(e==="食用"){ G.streak=0; txt="みのがした…"; kind="meh"; }
        else { txt="…"; kind="meh"; }
      }
      G.score=Math.max(0,G.score+pts); m.result={txt,kind};
      G.msg={txt:`${m.rec.wamei}（${e}）`,sub:txt,kind,t:90};
      G.handled++;
      checkClear();
    }
    function checkClear(){
      if(G.lives<=0 || G.handled<PER_STAGE || mode!=="play") return;
      if(G.stage>=STAGES.length-1){ mode="ending"; SFX.ending(); saveHi(); return; }
      mode="clear"; SFX.clear();
      setTimeout(()=>{ if(mode!=="clear") return; G.stage++; G.handled=0; G.objs=[]; G.gapTimer=50; mode="play"; stageBGM();
        G.msg={txt:`STAGE ${stage().no}`,sub:stage().name,kind:"info",t:110}; },2200);
    }
    function eatFruit(m){
      m.judged=true; const f=FRUIT[m.fruit];
      if(G.lives<LIVES){ G.lives++; SFX.heal(); m.result={kind:"ok"};
        G.msg={txt:`${f.name}を たべた`,sub:`たいりょく かいふく! のこり ${G.lives}`,kind:"ok",t:100}; G.heal=26; }
      else { G.score+=200; SFX.coin(); m.result={kind:"ok"};
        G.msg={txt:`${f.name}を たべた`,sub:"たいりょくは まんたん +200",kind:"ok",t:80}; }
    }
    function saveHi(){ if(G.score>hi){ hi=G.score; try{localStorage.setItem("kinoko_retro_hi",hi);}catch{} } }

    /* ---------- 入力 ---------- */
    const held={l:false,r:false,d:false};
    function pressA(){
      if(mode==="title"){ start(); return; }
      if(mode!=="play") return;
      const i=G.iwao; if(i.jump||i.pick>0) return;
      i.pick=16;
      let got=null;
      for(const m of G.objs){ if(m.judged) continue;
        if(m.kind!=="mush" && m.kind!=="fruit") continue;
        if(m.z<0.30 && Math.abs(m.lane-i.lane)<0.34){ got=m; break; } }
      if(!got) { SFX.swish(); return; }
      if(got.kind==="fruit") eatFruit(got); else judge(got,"pick");
    }
    function pressB(){
      if(mode==="title"){ start(); return; }
      if(mode!=="play") return;
      const i=G.iwao; if(i.jump||i.duck) return;
      i.jump=true; i.vy=-7.6; SFX.jump();
    }
    function pressStart(){ ac(); if(mode==="title"||mode==="gameover"||mode==="ending") start(); }
    function start(){ reset(); mode="play"; SFX.start(); stageBGM(); G.msg={txt:`STAGE ${stage().no}`,sub:stage().name,kind:"info",t:110}; }

    const dkEl={};
    function setHold(dir,v){ held[dir]=v; if(dkEl[dir]) dkEl[dir].classList.toggle("is-on",v); }
    function clearHold(){ setHold("l",false); setHold("r",false); setHold("d",false); }
    /* タイトルでは ← → でゲームスピードを選ぶ */
    function nudge(dir){
      if(mode!=="title") return false;
      spd=Math.max(0,Math.min(SPD.length-1, spd+(dir==="r"?1:-1)));
      saveSpd(); SFX.swish(); return true;
    }
    function hold(el,dir){
      dkEl[dir]=el;
      el.addEventListener("pointerdown",e=>{ e.preventDefault(); ac();
        if((dir==="l"||dir==="r") && nudge(dir)) return;
        if(dir!=="d"){ setHold(dir==="l"?"r":"l",false); }
        setHold(dir,true); });
      el.addEventListener("contextmenu",e=>e.preventDefault());
    }
    hold(document.getElementById("btnL"),"l");
    hold(document.getElementById("btnR"),"r");
    hold(document.getElementById("btnD"),"d");
    ["pointerup","pointercancel"].forEach(ev=>window.addEventListener(ev,clearHold));
    document.getElementById("btnA").addEventListener("pointerdown",e=>{e.preventDefault(); ac(); pressA();});
    document.getElementById("btnB").addEventListener("pointerdown",e=>{e.preventDefault(); ac(); pressB();});
    document.getElementById("btnStart").addEventListener("pointerdown",e=>{e.preventDefault(); pressStart();});
    cv.addEventListener("pointerdown",()=>{ ac(); if(mode!=="play") pressStart(); });
    window.addEventListener("keydown",e=>{
      const k=e.key.toLowerCase();
      if(k==="arrowleft"||k==="arrowright"){ e.preventDefault();
        const d=k==="arrowleft"?"l":"r";
        if(!e.repeat && nudge(d)) return;
        setHold(d,true); return; }
      if(k==="arrowdown"){ e.preventDefault(); setHold("d",true); return; }
      if(e.repeat) return;
      if(k==="z"||k==="arrowup"){ e.preventDefault(); ac(); pressA(); }
      else if(k==="x"||k===" "){ e.preventDefault(); ac(); pressB(); }
      else if(k==="enter"){ pressStart(); }
    });
    window.addEventListener("keyup",e=>{ const k=e.key.toLowerCase();
      if(k==="arrowleft") setHold("l",false);
      if(k==="arrowright") setHold("r",false);
      if(k==="arrowdown") setHold("d",false); });
    window.addEventListener("blur",clearHold);

    /* ---------- 更新 ---------- */
    function update(){
      frame++;
      if(mode!=="play") return;
      const s=stage(), i=G.iwao;

      /* しゃがみ（下ボタン）：空中ではしゃがめない */
      i.duck = held.d && !i.jump;

      /* 左右移動（十字キー）。しゃがむと動きがにぶる */
      const acc=(held.r?1:0)-(held.l?1:0);
      i.vlane += acc*(i.duck?0.0022:0.0042);
      i.vlane *= 0.84;
      i.lane  += i.vlane;
      if(i.lane<-0.92){ i.lane=-0.92; i.vlane=0; }
      if(i.lane> 0.92){ i.lane= 0.92; i.vlane=0; }

      /* ジャンプ・しゃがみ */
      if(i.jump){ i.y+=i.vy; i.vy+=.40; if(i.y>=0){ i.y=0; i.jump=false; i.vy=0; } }
      if(i.pick>0) i.pick--;
      if(i.hurt>0) i.hurt--;
      if(i.inv>0) i.inv--;
      if(!i.jump && !i.duck && i.pick<=0){ i.anim++; if(i.anim%8===0) i.frame=1-i.frame; }
      if(G.shake>0) G.shake--; if(G.flash>0) G.flash--; if(G.heal>0) G.heal--;
      if(G.msg){ G.msg.t--; if(G.msg.t<=0) G.msg=null; }
      G.fly.forEach(f=>f.t++); G.fly=G.fly.filter(f=>f.t<24);

      /* 道と木の流れ */
      const dz=s.speed*spdM();
      G.scrollZ+=dz;
      G.trees.forEach(t=>{ t.z-=dz; if(t.z<-0.12){ t.z+=FAR+0.12; t.lane=(Math.random()<.5?-1:1)*(1.25+Math.random()*.7); t.kind=Math.floor(Math.random()*3); } });

      /* 出現物 */
      for(const m of G.objs){
        m.z-=dz;
        if(m.judged) continue;
        if(m.kind==="mush"){
          if(m.z<=0){ // 足元を通過
            const safe = i.jump || Math.abs(m.lane-i.lane)>0.42;
            judge(m, safe?"dodge":"walk");
          }
        }else if(m.kind==="fruit"){
          if(m.z<=0) m.judged=true;   // とらなくても害はない
        }else{ // 障害物・いきもの
          // ヘビ・ハチ・クマは近づきながら左右に揺れる
          if(m.kind==="snake") m.lane = m.base + Math.sin((FAR-m.z)*3.4 + m.phase)*0.52;
          if(m.kind==="bee")   m.lane = m.base + Math.sin((FAR-m.z)*2.6 + m.phase)*0.40;
          if(m.kind==="bear"){ m.lane = m.base + Math.sin((FAR-m.z)*1.3 + m.phase)*0.20;
            if(!m.open && m.z<0.42){ m.open=true; m.openT=0; SFX.roar(); G.shake=Math.max(G.shake,6); }
            if(m.open) m.openT=Math.min(12,(m.openT||0)+1); }
          if(m.z<=0.05){
            m.judged=true;
            const dx=Math.abs(m.lane-i.lane);
            const H=HAZ[m.kind];
            const w=(m.kind==="bear")?H.open:H.w;          // クマは両手を広げる
            const dodged = dx>w || (H.jump && i.jump) || (H.duck && i.duck);
            if(!dodged){ hurt(H.hit); }
            else { G.score+=H.pts;
              const how = (H.jump&&i.jump) ? "とびこえた! +" : (H.duck&&i.duck) ? "やりすごした! +" : "よけた! +";
              G.msg={txt:H.name, sub:how+H.pts, kind:"ok", t:56}; SFX.good(); }
          }
        }
      }
      G.objs=G.objs.filter(m=>m.z>-0.20);

      if(G.gapTimer-- <= 0){ spawn(); G.gapTimer=Math.floor(s.gap/spdM()*(0.72+Math.random()*0.6)); }
    }

    /* ---------- 描画 ---------- */
    function text(str,x,y,font=JP,col="#fff",align="left"){ ctx.font=font; ctx.textAlign=align; ctx.textBaseline="top"; ctx.fillStyle="#000"; ctx.fillText(str,x+2,y+2); ctx.fillStyle=col; ctx.fillText(str,x,y); }
    function band(z0,z1,col,hw){
      ctx.fillStyle=col; ctx.beginPath();
      ctx.moveTo(pX(-hw,z1),pY(z1)); ctx.lineTo(pX(hw,z1),pY(z1));
      ctx.lineTo(pX(hw,z0),pY(z0)); ctx.lineTo(pX(-hw,z0),pY(z0));
      ctx.closePath(); ctx.fill();
    }
    function drawSky(s){
      ctx.fillStyle=s.sky; ctx.fillRect(0,0,W,HZ+2);
      if(s.night){ if(!G.stars){ G.stars=Array.from({length:40},()=>({x:Math.random()*W,y:36+Math.random()*130})); }
        ctx.fillStyle="#fff"; G.stars.forEach((st,k)=>{ if((frame>>4)%3!==k%3) ctx.fillRect(st.x,st.y,2,2); });
        ctx.fillStyle="#f8f8d8"; ctx.beginPath(); ctx.arc(420,80,22,0,7); ctx.fill(); }
      else{ ctx.fillStyle="#fff"; for(let k=0;k<3;k++){ const cx=((k*210 - frame*.18)%(W+120)+W+120)%(W+120)-60, cy=52+k*30;
          ctx.fillRect(cx,cy,56,14); ctx.fillRect(cx+12,cy-10,28,12); ctx.fillRect(cx+8,cy+8,40,10); }
        if(!s.fog){ ctx.fillStyle="#f8f878"; ctx.fillRect(400,44,28,28); ctx.fillRect(408,36,12,8); ctx.fillRect(408,72,12,8); ctx.fillRect(392,52,8,12); ctx.fillRect(428,52,8,12); } }
      // 遠くの山なみ
      ctx.fillStyle=s.hill;
      for(let k=-1;k<5;k++){ const bx=k*150-30; ctx.beginPath(); ctx.moveTo(bx,HZ+2); ctx.lineTo(bx+75,HZ-72); ctx.lineTo(bx+150,HZ+2); ctx.fill(); }
      ctx.fillStyle=s.hill2; ctx.fillRect(0,HZ-6,W,10);
    }
    function drawGround(s){
      ctx.fillStyle=s.ground; ctx.fillRect(0,HZ,W,H-HZ);
      const SEG=0.075, off=G.scrollZ%(SEG*2);
      for(let k=20;k>=-5;k--){
        const z0=k*SEG-off, z1=z0+SEG;
        if(z1<-0.215||z0>FAR+0.1) continue;
        const a=Math.max(z0,-0.215), b=Math.min(z1,FAR+0.1);
        if(b<=a) continue;
        const light=(k%2===0);
        band(a,b, light?"#000000":"#000000", 1.30);          // 土手の影
        band(a,b, light?s.path:s.path2, 1.22);
      }
      // 道ばたの草
      const SEG2=0.15, off2=G.scrollZ%(SEG2*2);
      for(let k=16;k>=0;k--){
        const z0=k*SEG2-off2, z1=z0+SEG2*0.5;
        if(z1<-0.2||z0>FAR) continue;
        ctx.fillStyle=s.tree2;
        const y=pY(Math.max(z0,-0.15)), hw=pHW(Math.max(z0,-0.15));
        const hgt=Math.max(2,6*pz(Math.max(z0,0)));
        ctx.fillRect(W/2-hw*1.24,y-hgt,hw*0.10,hgt);
        ctx.fillRect(W/2+hw*1.14,y-hgt,hw*0.10,hgt);
      }
    }
    function drawTree(t,s){
      if(t.z<-0.1||t.z>FAR) return;
      const x=pX(t.lane,t.z), y=pY(t.z), k=pz(t.z);
      const h=(150+t.kind*26)*k, w=Math.max(3,26*k);
      ctx.fillStyle="#6c3c14"; ctx.fillRect(x-w*0.22,y-h*0.55,Math.max(2,w*0.44),h*0.55);
      ctx.fillStyle=s.tree;
      ctx.fillRect(x-w,      y-h*0.62, w*2,   h*0.22);
      ctx.fillRect(x-w*0.76, y-h*0.80, w*1.52,h*0.22);
      ctx.fillRect(x-w*0.48, y-h*0.97, w*0.96,h*0.22);
      ctx.fillStyle=s.tree2;
      ctx.fillRect(x-w*0.7,  y-h*0.60, w*0.5, h*0.08);
      ctx.fillRect(x-w*0.4,  y-h*0.78, w*0.34,h*0.07);
    }
    function drawAim(lane){
      for(let k=1;k<=7;k++){
        const z=k*0.14, y=pY(z), x=pX(lane,z), w=Math.max(2,11*pz(z));
        ctx.fillStyle=`rgba(255,255,255,${0.46-k*0.05})`;
        ctx.fillRect(x-w/2, y-Math.max(1,2*pz(z)), w, Math.max(1,4*pz(z)));
      }
    }
    /* 危険マーク（近づくと点滅） */
    function hazMark(m,x,y){
      const H=HAZ[m.kind]; if(!H||!H.mark) return;
      if(m.z > ((m.kind==="bee"||m.kind==="bear")?1.05:0.92)) return;
      const fast = (m.kind==="bee"||m.kind==="bear"||m.z<0.45) ? 2 : 3;
      if((frame>>fast)%2) text(H.mark, x-(H.mark.length*7), y-16, JP, H.col);
    }
    /* ヘビ：道を横切りながら近づく */
    function drawSnake(m,x,y,k){
      const seg=Math.max(2,10*k), n=8, dir=Math.cos((FAR-m.z)*3.4+m.phase)>=0?1:-1;
      drawShadow(x, y+2, seg*2.6, k);
      for(let i=n-1;i>=0;i--){
        const sx = x - dir*i*seg*0.82;
        const sy = y - Math.max(1,3*k) + Math.sin(frame*0.2 - i*0.8)*seg*0.45;
        ctx.fillStyle = i%2 ? "#1c6c24" : "#58a83c";
        ctx.fillRect(sx-seg/2, sy-seg/2, seg, seg);
        if(i%2===0){ ctx.fillStyle="#f8d878"; ctx.fillRect(sx-seg*0.18, sy-seg*0.5, seg*0.36, Math.max(1,seg*0.22)); }
      }
      // 頭
      const hy=y-Math.max(1,3*k)+Math.sin(frame*0.2)*seg*0.45;
      ctx.fillStyle="#1c6c24"; ctx.fillRect(x-dir*seg*0.2-seg*0.6, hy-seg*0.6, seg*1.2, seg*1.2);
      ctx.fillStyle="#f8f8f8"; ctx.fillRect(x+dir*seg*0.1, hy-seg*0.35, Math.max(1,seg*0.22), Math.max(1,seg*0.22));
      if((frame>>2)%2){ ctx.fillStyle="#f83800"; ctx.fillRect(x+dir*seg*0.6, hy, Math.max(1,seg*0.6), Math.max(1,seg*0.16)); }
      hazMark(m,x,y-seg*2.2);
    }
    /* スズメバチ：宙を飛ぶ。ジャンプではよけられない */
    function drawBee(m,x,y,k){
      const sc=Math.max(1,pS(m.z)*1.25);
      const hover = 46*k + Math.sin(frame*0.26+m.phase)*8*k;
      const by = y - hover;
      drawShadow(x, y+2, 6*sc, k);
      sprite(BEE[(frame>>1)%2], x-6.5*sc, by-3*sc, PAL, sc);
      hazMark(m, x, by-5*sc);
    }
    /* k は遠近係数。遠いものほど影もつぶれる */
    /* 回復のくだもの */
    function drawFruit(m,x,y,k){
      const f=FRUIT[m.fruit], sc=Math.max(1,pS(m.z)*0.95);
      drawShadow(x,y+2,5*sc,k);
      const bob=Math.sin(frame*0.12+m.z*8)*2*k;
      sprite(f.map, x-5*sc, y-10*sc+bob, FPAL, sc);
      if(!m.judged && m.z<0.95){
        // きらきら
        if((frame>>2)%2){ ctx.fillStyle="#f8f8f8";
          const r=Math.max(1,1.6*sc);
          ctx.fillRect(x+4*sc, y-11*sc+bob, r, r); ctx.fillRect(x-6*sc, y-6*sc+bob, r, r); }
        if((frame>>3)%2) text("♥", x-8, y-12*sc+bob-18, JP, "#f86880");
      }
    }
    /* クマ：手前で両手を広げてくる。ジャンプもしゃがみも効かない */
    function drawBear(m,x,y,k){
      const u=Math.max(1,6.4*k), open=!!m.open;
      const bw=10*u, bh=13*u;
      drawShadow(x,y+2,bw*0.62,k);
      /* 広げた腕の長さは、当たり判定の幅とそろえてある */
      const t=Math.max(0,Math.min(1,(m.openT||0)/12));
      const full=Math.max(2*u, HAZ.bear.open*pHW(m.z) - bw/2);
      const arm = 3.0*u + (full-3.0*u)*t;
      const ay = y-bh*0.74, ah=Math.max(2,3.2*u);
      ctx.fillStyle="#4c2c0c";
      ctx.fillRect(x-bw/2-arm, ay, arm, ah);
      ctx.fillRect(x+bw/2,     ay, arm, ah);
      // 手（前足）と爪
      const pw=Math.max(2,2.6*u), ph=Math.max(3,ah*1.7), py2=ay-(ph-ah)/2;
      ctx.fillStyle="#3c2008";
      ctx.fillRect(x-bw/2-arm-pw*0.4, py2, pw, ph);
      ctx.fillRect(x+bw/2+arm-pw*0.6, py2, pw, ph);
      ctx.fillStyle="#f0ece0";
      for(let c=0;c<3;c++){
        const cy=py2+ph*(0.16+c*0.30), ch=Math.max(1,ph*0.14), cw=Math.max(1,1.4*u);
        ctx.fillRect(x-bw/2-arm-pw*0.4-cw, cy, cw, ch);
        ctx.fillRect(x+bw/2+arm+pw*0.4,    cy, cw, ch);
      }
      ctx.fillStyle="#6c3c14"; ctx.fillRect(x-bw/2, y-bh, bw, bh);
      ctx.fillStyle="#f0e8d0"; ctx.fillRect(x-2.4*u, y-bh*0.72, 4.8*u, Math.max(1,1.7*u));
      const hw=7.4*u, hh=5.8*u, hy=y-bh-hh+0.8*u;
      ctx.fillStyle="#4c2c0c";
      ctx.fillRect(x-hw/2-1.3*u, hy-1.4*u, 2.7*u, 2.7*u);
      ctx.fillRect(x+hw/2-1.4*u, hy-1.4*u, 2.7*u, 2.7*u);
      ctx.fillRect(x-hw/2, hy, hw, hh);
      ctx.fillStyle="#c8a880"; ctx.fillRect(x-2.2*u, hy+hh*0.46, 4.4*u, hh*0.44);
      ctx.fillStyle="#181818"; ctx.fillRect(x-0.9*u, hy+hh*0.52, Math.max(1,1.8*u), Math.max(1,1.2*u));
      ctx.fillStyle=open?"#f83800":"#f8f8f8";
      ctx.fillRect(x-2.6*u, hy+hh*0.18, Math.max(1,1.5*u), Math.max(1,1.3*u));
      ctx.fillRect(x+1.1*u, hy+hh*0.18, Math.max(1,1.5*u), Math.max(1,1.3*u));
      if(open && (frame>>2)%2){ ctx.fillStyle="#a01038"; ctx.fillRect(x-1.7*u, hy+hh*0.70, 3.4*u, Math.max(1,1.6*u)); }
      hazMark(m, x, hy-3.6*u);
    }
    function drawShadow(x,y,r,k){ k=(k===undefined?1:k);
      ctx.fillStyle="rgba(0,0,0,.30)"; ctx.beginPath();
      ctx.ellipse(x,y,r,Math.max(1,r*0.34*k),0,0,7); ctx.fill(); }
    function drawObj(m){
      if(m.z<-0.15||m.z>FAR) return;
      const x=pX(m.lane,m.z), y=pY(m.z), k=pz(m.z), s=pS(m.z);
      if(m.kind==="mush"){
        drawShadow(x,y+2,5.5*s,k);
        const pal={...PAL, c:m.cap};
        sprite(MUSH, x-6*s, y-11*s, pal, s);
        if(!m.judged && m.z<0.9 && (frame>>3)%2) text("？", x-6, y-13*s-16*k-6, JP, "#f8f878");
        if(m.judged && m.result) text(m.result.kind==="ok"?"○":m.result.kind==="bad"?"×":"△", x-8, y-13*s-20, JP,
            m.result.kind==="ok"?"#58f858":m.result.kind==="bad"?"#f83800":"#f8d878");
      }else if(m.kind==="log"){
        const w=pHW(m.z)*1.24, h=Math.max(4,22*k);
        drawShadow(x,y+3,w*0.5,k);
        ctx.fillStyle="#6c3c14"; ctx.fillRect(x-w*0.5,y-h,w,h);
        ctx.fillStyle="#8c5c1c"; ctx.fillRect(x-w*0.5,y-h,w,Math.max(2,h*0.34));
        ctx.fillStyle="#3c2008"; ctx.fillRect(x-w*0.5,y-h,Math.max(2,h*0.5),h); ctx.fillRect(x+w*0.5-Math.max(2,h*0.5),y-h,Math.max(2,h*0.5),h);
        hazMark(m,x,y-h-22*k);
      }else if(m.kind==="rock"){
        const w=Math.max(5,46*k), h=Math.max(4,34*k);
        drawShadow(x,y+2,w*0.6,k);
        ctx.fillStyle="#8c8c8c"; ctx.fillRect(x-w*0.5,y-h,w,h);
        ctx.fillStyle="#b8b8b8"; ctx.fillRect(x-w*0.5,y-h,w*0.55,h*0.4);
        ctx.fillStyle="#585858"; ctx.fillRect(x-w*0.5,y-h*0.25,w,h*0.25);
        hazMark(m,x,y-h-16*k);
      }else if(m.kind==="snake"){
        drawSnake(m,x,y,k);
      }else if(m.kind==="bee"){
        drawBee(m,x,y,k);
      }else if(m.kind==="bear"){
        drawBear(m,x,y,k);
      }else{
        drawFruit(m,x,y,k);
      }
    }
    function drawIwao(){
      const i=G.iwao, k=pz(0), s=pS(0);
      const x=pX(i.lane,0)-7*s, y=GY-20*s+i.y;
      drawShadow(pX(i.lane,0), GY+3, i.jump?5.2*s:7.2*s);
      if(i.hurt>0 && (frame>>2)%2===0) return;
      let map=BACK[i.frame];
      if(i.jump) map=BACK[2]; else if(i.duck) map=BACK[3]; else if(i.pick>0) map=BACK[4];
      sprite(map,x,y,PAL,s);
    }
    function drawHUD(){
      ctx.fillStyle="#000"; ctx.fillRect(0,0,W,46);
      text("SCORE",12,8,EN8,"#f8f8f8"); text(String(G.score).padStart(7,"0"),12,22,EN,"#f8f878");
      text("HI",190,8,EN8,"#f8f8f8"); text(String(hi).padStart(7,"0"),190,22,EN8,"#c8c8c8");
      for(let k=0;k<LIVES;k++){ sprite(HEART,300+k*24,14,{...PAL,r:k<G.lives?"#f83800":"#404040"}); }
      sprite(BASKET,392,14,PAL); text("x"+G.basket,418,16,EN8,"#f8f878");
      text(stage().no,462,10,EN,"#f8f8f8");
      text(`${G.handled}/${PER_STAGE}`,462,30,EN8,"#a8e4b8");
      text(SPD[spd].n,262,34,EN8,"#7c7c7c");
      if(G.streak>=2) text(`x${1+Math.min(G.streak-1,4)*.5} れんぞく!`,12,50,JP,"#58f858");
    }
    function nextMush(){ let best=null; for(const m of G.objs){ if(m.kind==="mush"&&!m.judged&&(!best||m.z<best.z)) best=m; } return best; }
    function drawPhotoPanel(){
      const s=stage(), m=nextMush();
      const pw=s.fog?116:150, ph=s.fog?87:112, px=W-pw-12, py=54;
      ctx.fillStyle="#000"; ctx.fillRect(px-8,py-8,pw+16,ph+16); ctx.fillStyle="#f8f8f8"; ctx.fillRect(px-4,py-4,pw+8,ph+8); ctx.fillStyle="#000"; ctx.fillRect(px,py,pw,ph);
      if(m && m.ready){ drawCrop(m,px,py,pw,ph);
        if(s.night){ ctx.fillStyle="rgba(0,0,40,.25)"; ctx.fillRect(px,py,pw,ph); }
        // 近づくほどバーがのびる
        const t=Math.max(0,Math.min(1,1-m.z/FAR));
        ctx.fillStyle="#000"; ctx.fillRect(px-2,py+ph+12,pw+4,10);
        ctx.fillStyle="#303030"; ctx.fillRect(px,py+ph+14,pw,6);
        ctx.fillStyle=t>.72?"#f8d878":"#58a8f8"; ctx.fillRect(px,py+ph+14,pw*t,6);
        text("A=とる",W-12,py+ph+24,JP,"#f8f878","right");
      } else { text("？",px+pw/2,py+ph/2-12,JP,"#666","center"); }
    }
    function drawMsg(){ const m=G.msg; if(!m) return;
      const col=m.kind==="ok"?"#58f858":m.kind==="bad"?"#f83800":m.kind==="info"?"#f8f8f8":"#f8d878";
      const bw=322, bx=10, by=76;
      ctx.fillStyle="rgba(0,0,0,.78)"; ctx.fillRect(bx,by,bw,62);
      ctx.fillStyle="#f8f8f8"; ctx.fillRect(bx,by,bw,2); ctx.fillRect(bx,by+60,bw,2);
      text(m.txt,bx+bw/2,by+8,JP,"#fff","center"); text(m.sub,bx+bw/2,by+34,JP,col,"center"); }
    function drawFly(){ G.fly.forEach(f=>{ const p=f.t/24; const x=f.x+(400-f.x)*p, y=f.y+(18-f.y)*p - Math.sin(p*Math.PI)*70; sprite(MUSH,x,y,{...PAL,c:"#f8d878"},1); }); }
    function drawTitle(){
      const s=STAGES[0];
      drawSky(s); drawGround(s);
      G.trees.forEach(t=>drawTree(t,s));
      ctx.fillStyle="#000"; ctx.fillRect(40,52,W-80,120);
      ctx.fillStyle="#f8f878"; ctx.fillRect(48,60,W-96,104);
      text("KINOKO",W/2,70,EN,"#d02020","center"); text("HUNTER",W/2,92,EN,"#d02020","center"); text("IWAO",W/2,116,EN,"#3050a8","center");
      text("ファミコンふう キノコさいしゅう アクション",W/2,142,JP,"#000","center");
      
      ctx.fillStyle="rgba(0,0,0,.76)"; ctx.fillRect(40,180,W-80,120);
      text("← → ： よける　　↓ ： しゃがむ　　A ： とる",W/2,186,JP,"#fff","center");
      text("B ： ジャンプ（たおれ木は とぶしかない）",W/2,208,JP,"#f8d878","center");
      text("ハチは ↓ でしゃがんで やりすごす",W/2,230,JP,"#f8b800","center");
      text("クマは 両手を広げてくる。左右に にげろ！",W/2,252,JP,"#f83800","center");
      text("カキ・イチジク・クワの実で たいりょく かいふく",W/2,274,JP,"#a8e4b8","center");
      /* ゲームスピード */
      const sy=308, bw=400, bx=W/2-bw/2;
      ctx.fillStyle="#000"; ctx.fillRect(bx,sy,bw,34);
      ctx.fillStyle="#f8f878"; ctx.fillRect(bx+2,sy+2,bw-4,30);
      text("スピード",bx+52,sy+8,JP,"#000","center");
      for(let k=0;k<SPD.length;k++){
        const cx=bx+160+k*66, on=(k===spd);
        if(on){ ctx.fillStyle="#d02020"; ctx.fillRect(cx-30,sy+4,60,26); }
        text(SPD[k].n, cx, sy+8, JP, on?"#fff":"#6c6440", "center");
      }
      if((frame>>3)%2===0){ text("◀",bx+112,sy+8,JP,"#000","center"); text("▶",bx+350,sy+8,JP,"#000","center"); }
      text("十字キー ← → でえらぶ",W/2,346,JP,"#c8c8c8","center");
      if((frame>>5)%2===0) text("PUSH START",W/2,382,EN,"#f8f8f8","center");
      ctx.fillStyle="#000"; ctx.fillRect(W/2-150,430,300,24);
      text(`HI-SCORE ${String(hi).padStart(7,"0")}`,W/2,434,EN,"#f8f878","center");
      text("© 2026 IWAOTOKINOKO",W/2,460,EN8,"#e0e0e0","center");
    }
    function drawOverlayScreen(title,sub,col){ ctx.fillStyle="rgba(0,0,0,.75)"; ctx.fillRect(0,0,W,H); text(title,W/2,180,EN,col,"center"); if(sub) text(sub,W/2,220,JP,"#fff","center"); text(`SCORE ${String(G.score).padStart(7,"0")}`,W/2,262,EN8,"#f8f878","center"); text(`HI ${String(hi).padStart(7,"0")}`,W/2,282,EN8,"#c8c8c8","center"); if((frame>>5)%2===0) text("PUSH START",W/2,330,EN,"#f8f8f8","center"); }
    function draw(){
      ctx.setTransform(1,0,0,1,0,0);
      if(mode==="title"){ drawTitle(); return; }
      if(G.shake>0){ ctx.setTransform(1,0,0,1,(Math.random()-.5)*8,(Math.random()-.5)*8); }
      const s=stage();
      drawSky(s); drawGround(s);
      // 奥のものから順に
      drawAim(G.iwao.lane);
      const far=[...G.trees.map(t=>({z:t.z,t})), ...G.objs.map(o=>({z:o.z,o}))].sort((a,b)=>b.z-a.z);
      far.forEach(e=>{ if(e.t) drawTree(e.t,s); else drawObj(e.o); });
      drawIwao();
      if(s.fog){ ctx.fillStyle="rgba(220,220,220,.30)"; ctx.fillRect(0,HZ-40,W,H-HZ+40); }
      if(s.night){ ctx.fillStyle="rgba(0,0,40,.32)"; ctx.fillRect(0,0,W,H); }
      drawFly(); drawHUD(); drawPhotoPanel(); drawMsg();
      if(G.flash>0){ ctx.fillStyle="rgba(248,56,0,.35)"; ctx.fillRect(0,0,W,H); }
      if(G.heal>0){ ctx.fillStyle=`rgba(88,248,88,${G.heal/90})`; ctx.fillRect(0,0,W,H); }
      ctx.setTransform(1,0,0,1,0,0);
      if(mode==="clear"){ ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,W,H); text("STAGE CLEAR!",W/2,200,EN,"#f8f878","center"); text(`つぎは ${STAGES[Math.min(G.stage+1,STAGES.length-1)].name}`,W/2,236,JP,"#fff","center"); }
      if(mode==="gameover") drawOverlayScreen("GAME OVER","たいりょくが なくなった…","#f83800");
      if(mode==="ending"){ drawOverlayScreen("CONGRATULATIONS!","さんちょうに とうちゃく！ IWAO は ながおかの もりを まもった",'#58f858'); }
    }
    function loop(){ update(); draw(); requestAnimationFrame(loop); }
    loop();
  })();
  </script>
  <script src="i18n.js?v=20260920-1640"></script>
  <script>if(window.BGM) BGM.attach("hunter", "#bgmBtn");</script>
