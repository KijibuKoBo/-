<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>松永工房クラフトストーリー 〜小さな家具と、届かなかった手紙〜</title>
<style>
/* ==========================================================
   松永工房クラフトストーリー 第5章
   『家具コレクション × 工房発展 × 物語』
   - ゲームの主役は家具図鑑（コンプリートが最終目的）
   - 設計図 → 材料仕入れ → 制作(設計/素材/仕上げ) → 図鑑登録
     → 展示 → 来館者 → 収益 → 新設計図…のループ
   - 隠しレシピ発見／展示セットボーナス／工房発展
   絵本風 × 木の温かみ × ちょっと高級感
   ========================================================== */
:root{
  --cream:      #faf3e3;   /* 背景クリーム */
  --cream-deep: #f3e7cd;
  --brown:      #6b4a2f;   /* 濃いブラウン（文字） */
  --brown-mid:  #8a6446;
  --brown-soft: #b08a63;
  --wood-light: #e8cfa5;   /* 木目・明 */
  --wood-dark:  #caa06d;   /* 木目・暗 */
  --green:      #9dbb8f;   /* 淡いグリーン */
  --green-deep: #7a9c6e;
  --gold:       #c9a24b;   /* 高級感アクセント */
  --red:        #b8563e;   /* 納期超過などの注意色 */
  --paper:      #fffdf5;   /* カード紙色 */
  --shadow:     0 4px 12px rgba(107,74,47,.18);
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; }

body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI","Meiryo",sans-serif;
  color:var(--brown);
  background:
    repeating-linear-gradient(0deg,
      rgba(176,138,99,.05) 0px,  rgba(176,138,99,.05) 2px,
      transparent 2px,           transparent 26px),
    radial-gradient(circle at 50% -10%, #fff8e8 0%, var(--cream) 60%, var(--cream-deep) 100%);
  max-width:480px;
  margin:0 auto;
  min-height:100dvh;
  display:flex; flex-direction:column;
  user-select:none;
}

/* ---------- ヘッダー ---------- */
header{
  padding:12px 14px 10px; text-align:center;
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.08) 0 3px, transparent 3px 34px),
    linear-gradient(180deg, var(--wood-light), var(--wood-dark));
  border-bottom:4px solid var(--brown-mid);
  border-radius:0 0 18px 18px;
  box-shadow:var(--shadow);
}
header h1{
  font-size:1.02rem; letter-spacing:.06em; color:var(--brown);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
header h1 .sub{
  display:block; font-size:.68rem; font-weight:normal;
  color:#7d5a3c; margin-top:2px; letter-spacing:.02em;
}
.status{ display:flex; justify-content:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
.status .chip{
  background:var(--paper); border:2px solid var(--brown-soft);
  border-radius:999px; padding:3px 10px;
  font-size:.72rem; font-weight:bold; box-shadow:0 2px 3px rgba(107,74,47,.15);
}
.lvbar{
  margin:7px auto 0; width:78%; height:8px; border-radius:999px;
  background:rgba(255,253,245,.7); border:1.5px solid var(--brown-soft); overflow:hidden;
}
.lvbar>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--green),var(--green-deep));
  transition:width .5s ease; border-radius:999px;
}
.lvbar-label{ font-size:.62rem; color:#7d5a3c; margin-top:2px; }

/* ---------- メイン ---------- */
main{ flex:1; padding:14px 14px 8px; display:flex; flex-direction:column; gap:12px; }

/* ----- ヘンリーさん（案内役・常時表示） ----- */
#henry-area{ display:flex; align-items:flex-start; gap:10px; }
#henry-avatar{
  flex:0 0 62px; width:62px; height:62px;
  background:var(--paper); border:2.5px solid var(--brown-soft); border-radius:50%;
  box-shadow:0 2px 5px rgba(107,74,47,.2); overflow:hidden;
  animation:henrySway 4s ease-in-out infinite;
}
#henry-avatar svg{ width:100%; height:100%; display:block; }
@keyframes henrySway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
#message{
  flex:1; min-height:3.2em; position:relative;
  background:var(--paper); border:2px solid var(--brown-soft);
  border-radius:14px; padding:8px 12px;
  font-size:.8rem; line-height:1.6;
  transition:opacity .3s;
}
#message::before{
  content:""; position:absolute; left:-9px; top:20px;
  border:8px solid transparent; border-right-color:var(--brown-soft);
}
#message::after{
  content:""; position:absolute; left:-6px; top:22px;
  border:6px solid transparent; border-right-color:var(--paper);
}
.henry-name{ display:block; font-size:.6rem; color:var(--brown-soft); font-weight:bold; margin-bottom:1px; }

/* 工房まめ知識 */
.trivia{
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px dashed var(--gold); border-radius:12px;
  padding:8px 12px; font-size:.72rem; line-height:1.8;
  color:var(--brown-mid); text-align:justify;
}
.trivia b{ color:var(--brown); }
.trivia.pop{ animation:triviaIn .4s ease; }
@keyframes triviaIn{ from{ transform:translateY(-6px); opacity:0; } to{ transform:none; opacity:1; } }

/* ----- 家具カード ----- */
.card{
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.05) 0 2px, transparent 2px 40px),
    linear-gradient(160deg, #fff9ec, var(--paper));
  border:3px solid var(--wood-dark);
  border-radius:20px;
  box-shadow:var(--shadow), inset 0 0 0 4px rgba(232,207,165,.35);
  padding:14px 16px 14px;
  position:relative; overflow:hidden;
}
.card .art{ width:116px; height:116px; margin:0 auto; display:block;
  filter:drop-shadow(0 4px 4px rgba(107,74,47,.22)); }
.card .art svg{ width:100%; height:100%; display:block; }
/* 実物の写真を入れたときも、枠に収める */
.card .art img{ width:100%; height:100%; object-fit:contain; display:block; }
.card h2{ text-align:center; font-size:1.06rem; margin-top:2px; letter-spacing:.04em; }
.card .desc{ font-size:.75rem; color:var(--brown-mid); text-align:center; margin-top:4px; line-height:1.6; }
.card .meta{ display:flex; justify-content:center; gap:6px; margin-top:8px; font-size:.7rem; flex-wrap:wrap; }
.card .meta span{
  background:var(--cream-deep); border-radius:999px; padding:2px 9px;
  border:1px solid var(--wood-dark);
}
.card .meta .late{ color:var(--red); border-color:var(--red); font-weight:bold; }

/* 進捗バー・品質ゲージ */
.progress{
  margin-top:10px; height:14px; border-radius:999px;
  background:var(--cream-deep); border:2px solid var(--brown-soft); overflow:hidden;
}
.progress>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--gold),#e0bf74);
  transition:width .35s ease; border-radius:999px;
}
.progress-label{ text-align:center; font-size:.72rem; margin-top:4px; color:var(--brown-mid); }
.quality-row{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:.72rem; }
.quality-bar{
  flex:1; height:10px; border-radius:999px;
  background:var(--cream-deep); border:1.5px solid var(--brown-soft); overflow:hidden;
}
.quality-bar>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--green),var(--green-deep));
  transition:width .35s ease; border-radius:999px;
}
.rank-badge{
  display:inline-block; min-width:1.7em; text-align:center;
  font-weight:bold; font-size:.74rem; border-radius:999px; padding:1px 8px;
  border:1.5px solid currentColor;
}
.rank-S{ color:#a97c14; background:#fdf3d5; }
.rank-A{ color:var(--green-deep); background:#eef5e8; }
.rank-B{ color:var(--brown-mid); background:var(--cream-deep); }
.rank-C{ color:#9a8a78; background:#f2eee6; }

/* 完成アニメーション */
.card.done{
  animation:cardPop .6s ease, cardGlow 1.6s ease-in-out .3s 3;
  border-color:var(--gold);
}
@keyframes cardPop{
  0%{ transform:scale(1); } 35%{ transform:scale(1.06) rotate(-1.5deg); }
  70%{ transform:scale(.98) rotate(1deg); } 100%{ transform:scale(1); }
}
@keyframes cardGlow{
  0%,100%{ box-shadow:var(--shadow), 0 0 0 rgba(201,162,75,0); }
  50%{ box-shadow:var(--shadow), 0 0 28px 6px rgba(201,162,75,.65); }
}
.confetti{
  position:fixed; top:-40px; font-size:1.4rem; pointer-events:none; z-index:99;
  animation:fall 1.7s linear forwards;
}
@keyframes fall{ to{ transform:translateY(105vh) rotate(360deg); opacity:.2; } }

/* ----- 設計図えらび ----- */
.select-title{ text-align:center; font-size:.86rem; color:var(--brown-mid); }
.select-list{ display:flex; flex-direction:column; gap:10px; }
.select-item{
  display:flex; align-items:center; gap:12px;
  background:var(--paper); border:2.5px solid var(--wood-dark);
  border-radius:16px; padding:8px 14px; cursor:pointer;
  box-shadow:0 3px 6px rgba(107,74,47,.15);
  transition:transform .12s;
  text-align:left; width:100%; font-family:inherit; color:inherit;
}
.select-item:active{ transform:scale(.97); }
.select-item .thumb{ width:52px; height:52px; flex:0 0 52px; }
.select-item .thumb svg{ width:100%; height:100%; }
.select-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:10px; }
.select-item .icon{ font-size:2rem; width:52px; text-align:center; }
.select-item .name{ font-weight:bold; font-size:.9rem; }
.select-item .info{ font-size:.66rem; color:var(--brown-mid); margin-top:2px; line-height:1.5; }
.select-item.locked{
  opacity:.55; filter:grayscale(.6); cursor:default;
  border-style:dashed; box-shadow:none;
}
.mat-chip{
  display:inline-block; font-size:.64rem; border-radius:999px; padding:1px 7px;
  border:1px solid var(--wood-dark); background:var(--cream-deep); margin:1px 1px 0 0;
}
.mat-chip.ng{ color:var(--red); border-color:var(--red); background:#f8ece8; }

/* ----- 制作の設計えらび（設計・素材・仕上げ） ----- */
.prep-group{ margin-top:10px; }
.prep-group .g-title{ font-size:.76rem; font-weight:bold; margin-bottom:6px; text-align:center; }
.opt-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.opt-chip{
  font-family:inherit; font-size:.74rem; font-weight:bold; color:var(--brown);
  padding:9px 12px; border-radius:14px; cursor:pointer;
  border:2px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  min-height:44px;
}
.opt-chip .o-note{ display:block; font-size:.58rem; font-weight:normal; color:var(--brown-mid); }
.opt-chip.selected{
  background:linear-gradient(180deg,#eef5e8,var(--green));
  border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.3);
}
.opt-chip:disabled{ opacity:.45; cursor:default; }
.start-btn{
  display:block; width:100%; margin-top:12px;
  font-family:inherit; font-size:.96rem; font-weight:bold; color:#fff;
  padding:14px; border-radius:18px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55, var(--shadow);
}
.start-btn:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; }
.cancel-link{
  text-align:center; font-size:.7rem; color:var(--brown-soft);
  margin-top:8px; text-decoration:underline; cursor:pointer;
}

/* ---------- 工程エリア ---------- */
#steps-area{ padding:4px 14px 10px; }
.steps{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
.step-chip{
  font-size:.7rem; font-weight:bold; color:var(--brown);
  padding:5px 10px; border-radius:999px;
  border:2px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
}
.step-chip.done-step{ background:var(--wood-light); border-color:var(--wood-dark); opacity:.75; }
.step-chip.current{
  background:linear-gradient(180deg,#eef5e8,var(--green));
  border-color:var(--green-deep);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
.choice-title{ text-align:center; font-size:.8rem; font-weight:bold; margin-bottom:8px; }
.choices{ display:flex; gap:8px; }
.choice-btn{
  flex:1; font-family:inherit; font-weight:bold; color:var(--brown);
  padding:12px 4px 10px; border-radius:18px; cursor:pointer;
  border:2.5px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  box-shadow:0 3px 0 var(--brown-soft);
  transition:transform .1s;
  min-height:88px;
}
.choice-btn .c-icon{ display:block; font-size:1.6rem; line-height:1.2; }
.choice-btn .c-label{ display:block; font-size:.92rem; margin-top:3px; }
.choice-btn .c-note{ display:block; font-size:.6rem; font-weight:normal; color:var(--brown-mid); margin-top:2px; line-height:1.4; }
.choice-btn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-soft); }
.choice-btn:disabled{ opacity:.55; box-shadow:none; cursor:default; }
.choice-teinei{ border-color:var(--green-deep); box-shadow:0 3px 0 var(--green-deep);
  background:linear-gradient(180deg,#f2f7ee,#dcead4); }
.choice-teinei:active{ box-shadow:0 1px 0 var(--green-deep); }

/* 完成後の2択（納品／展示） */
.finish-row{ display:flex; gap:8px; margin-top:4px; }
.deliver-btn, .exhibit-btn{
  flex:1; font-family:inherit; font-size:.84rem; font-weight:bold; color:#fff;
  padding:13px 6px; border-radius:18px; border:none; cursor:pointer;
  letter-spacing:.02em; line-height:1.4;
}
.deliver-btn{
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55; animation:pulse 1.4s infinite;
}
.exhibit-btn{
  background:linear-gradient(180deg,#d8b45e,var(--gold));
  box-shadow:0 4px 0 #a97c14;
}
.exhibit-btn:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; animation:none; }
.deliver-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #5f7d55; }
.exhibit-btn:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 #a97c14; }

/* ---------- 固定フッター ---------- */
footer{
  position:sticky; bottom:0; z-index:30;
  display:flex; gap:5px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.08) 0 3px, transparent 3px 34px),
    linear-gradient(180deg, var(--wood-light), var(--wood-dark));
  border-top:4px solid var(--brown-mid);
  border-radius:18px 18px 0 0;
  box-shadow:0 -4px 12px rgba(107,74,47,.2);
}
.foot-btn{
  flex:1; font-family:inherit; font-size:.7rem; font-weight:bold; color:var(--brown);
  min-height:52px;
  padding:8px 1px; border-radius:14px; cursor:pointer;
  border:2.5px solid var(--brown-mid);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  box-shadow:0 3px 0 var(--brown-mid);
}
.foot-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-mid); }

/* ---------- モーダル共通 ---------- */
.modal-back{
  position:fixed; inset:0; background:rgba(80,55,35,.55);
  display:none; align-items:center; justify-content:center; z-index:50;
  padding:20px;
}
.modal-back.open{ display:flex; }
.modal{
  width:100%; max-width:420px; max-height:82dvh; overflow-y:auto;
  background:var(--paper); border:3px solid var(--wood-dark);
  border-radius:20px; padding:18px 16px;
  box-shadow:0 10px 30px rgba(60,40,20,.4);
  animation:modalIn .25s ease;
}
@keyframes modalIn{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
.modal h3{
  text-align:center; font-size:1.05rem; letter-spacing:.12em;
  border-bottom:2px dashed var(--brown-soft); padding-bottom:8px; margin-bottom:12px;
}
.modal .close{
  display:block; margin:14px auto 0; font-family:inherit; font-weight:bold;
  padding:9px 34px; border-radius:999px; cursor:pointer;
  border:2px solid var(--brown-mid); background:var(--cream-deep); color:var(--brown);
}
.modal .x-close{
  position:sticky; top:0; float:right; z-index:2;
  width:40px; height:40px; border-radius:50%;
  border:2px solid var(--brown-mid); background:var(--cream-deep); color:var(--brown);
  font-family:inherit; font-size:1rem; font-weight:bold; cursor:pointer;
  box-shadow:0 2px 4px rgba(107,74,47,.25); margin-left:8px;
}
.dex-section-title{
  text-align:center; font-size:.82rem; font-weight:bold; letter-spacing:.1em;
  margin:16px 0 10px; color:var(--brown-mid);
  border-bottom:2px dashed var(--wood-light); padding-bottom:5px;
}

/* ---------- 図鑑（ゲームの主役） ---------- */
.dex-complete{
  text-align:center; margin-bottom:12px;
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px solid var(--gold); border-radius:14px; padding:10px;
}
.dex-complete .big{ font-size:1.3rem; font-weight:bold; color:#a97c14; }
.dex-complete .small{ font-size:.68rem; color:var(--brown-mid); margin-top:2px; }
.dex-item{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:8px 12px; margin-bottom:10px; background:#fffdf7;
}
.dex-item .d-head{ display:flex; gap:12px; align-items:center; }
.dex-item .thumb{ width:52px; height:52px; flex:0 0 52px; }
.dex-item .thumb svg{ width:100%; height:100%; }
.dex-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:10px; }
.dex-item .icon{ font-size:1.8rem; width:52px; text-align:center; }
.dex-item .name{ font-weight:bold; font-size:.9rem; }
.dex-item .count{ font-size:.68rem; color:var(--brown-mid); margin-top:3px; line-height:1.7; }
.dex-item .d-desc{ font-size:.72rem; color:var(--brown-mid); margin-top:6px; line-height:1.7; text-align:justify; }
.dex-item .d-story{
  margin-top:6px; font-size:.74rem; line-height:1.85; text-align:justify;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
  border:1.5px dashed var(--wood-dark); border-radius:10px; padding:8px 10px;
}
.dex-item.unknown{ opacity:.6; }
.dex-item.unknown .d-head{ filter:grayscale(1); }
.dex-item.secret{ border-color:var(--gold); }
.knowledge{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:10px 13px; margin-bottom:10px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
}
.knowledge h4{ font-size:.82rem; margin-bottom:4px; }
.knowledge p{ font-size:.74rem; line-height:1.8; text-align:justify; color:var(--brown-mid); }

/* 手紙のきれはし */
.letter-item{
  border:2px solid #d9c48f; border-radius:4px 14px 4px 14px;
  padding:10px 13px; margin-bottom:10px;
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(176,138,99,.12) 22px 23px),
    linear-gradient(180deg,#fdf8e9,#f7eed3);
  font-size:.76rem; line-height:1.95; text-align:justify;
}
.letter-item h4{ font-size:.78rem; margin-bottom:4px; color:#8a6a2f; }
.letter-item.locked{ opacity:.55; filter:grayscale(.4); }
.story-item{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:12px 14px; margin-bottom:12px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
}
.story-item h4{ font-size:.88rem; margin-bottom:6px; }
.story-item p{ font-size:.8rem; line-height:1.9; text-align:justify; }
.story-item.locked{ opacity:.6; }
.story-item.final{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.25); }

/* ---------- 仕入れ（材料） ---------- */
.mat-item{
  display:flex; gap:12px; align-items:center;
  border:2px solid var(--wood-light); border-radius:14px;
  padding:9px 12px; margin-bottom:9px; background:#fffdf7;
}
.mat-item .m-icon{ font-size:1.7rem; width:40px; text-align:center; }
.mat-item .m-body{ flex:1; }
.mat-item .m-name{ font-weight:bold; font-size:.86rem; }
.mat-item .m-desc{ font-size:.66rem; color:var(--brown-mid); margin-top:1px; line-height:1.5; }
.mat-item .m-own{ font-size:.72rem; font-weight:bold; color:var(--green-deep); white-space:nowrap; }
.mat-buy{
  font-family:inherit; font-weight:bold; font-size:.72rem; color:#fff;
  padding:9px 10px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 3px 0 #5f7d55; white-space:nowrap;
}
.mat-buy:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 #5f7d55; }
.mat-buy:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; cursor:default; }

/* ---------- ショールーム（展示） ---------- */
.show-head{

}

}

.show-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:8px; }
.show-item .s-body{ flex:1; }
.show-item .s-name{ font-weight:bold; font-size:.82rem; }

.sell-btn{
  font-family:inherit; font-weight:bold; font-size:.7rem; color:var(--brown);

}
.bonus-chip{
  display:inline-block; font-size:.66rem; font-weight:bold; color:#a97c14;

}
.bonus-chip.off{ color:var(--brown-soft); border-color:var(--brown-soft); background:var(--cream-deep); opacity:.7; }

/* ---------- 設備 ---------- */
.gear-item{
  display:flex; gap:12px; align-items:center;
  border:2px solid var(--wood-light); border-radius:14px;

}
.gear-item .g-icon{ font-size:1.9rem; width:44px; text-align:center; }
.gear-item .g-name{ font-weight:bold; font-size:.86rem; }

.gear-item .g-body{ flex:1; }
.gear-buy{
  font-family:inherit; font-weight:bold; font-size:.72rem; color:#fff;
  padding:9px 11px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));

}
.gear-buy:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 #5f7d55; }
.gear-buy:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; cursor:default; }
.gear-owned{
  font-size:.72rem; font-weight:bold; color:var(--green-deep);

/* ---------- 工房紹介 ---------- */
.about-hero{ text-align:center; margin-bottom:12px; }
.about-hero .art{ width:110px; height:110px; margin:0 auto; }

.about-hero .catch{ font-size:.82rem; color:var(--brown-mid); margin-top:6px; letter-spacing:.06em; }
.about-block{
  border:2px solid var(--wood-light); border-radius:14px;

}
.about-block h4{ font-size:.84rem; margin-bottom:5px; }
.about-block p{ font-size:.76rem; line-height:1.9; text-align:justify; color:var(--brown-mid); }
.reset-link{
  text-align:center; font-size:.66rem; color:var(--brown-soft);
  margin-top:14px; text-decoration:underline; cursor:pointer;
}

/* ---------- 職人アクション ---------- */
/* 山場の呼び出し */
.act-call{
  text-align:center; padding:14px 12px 12px; border-radius:18px;

}

.act-go{

}

.act-skip{

}

}
.act-say{

.mult-row{
  text-align:center; font-size:.68rem; color:var(--brown-mid);
  margin-top:5px; line-height:1.6;
}

.act-effect{

}

.skill-row .s-num{ color:var(--brown-soft); font-size:.68rem; }

.player-row{

}
.player-face{

}

.player-row .lvbar-label{ margin-top:0; text-align:left; }

}

.av-chip{
  width:46px; height:46px; padding:0; cursor:pointer; overflow:hidden;

}

.av-chip.selected{ border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.35); }
.av-swatch{
  width:34px; height:34px; border-radius:50%; cursor:pointer;

}
.av-swatch.selected{ border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.35); }
.av-done{
  display:block; width:100%; margin-top:14px;
  font-family:inherit; font-size:1rem; font-weight:bold; color:#fff;
  padding:14px; border-radius:18px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55;
}
.av-done:active{ transform:translateY(3px); box-shadow:0 1px 0 #5f7d55; }

/* 集中力が心もとないときのチップ */
.chip.focus-low{ border-color:var(--red); color:var(--red); }

/* 山場工程 */
.step-chip.critical{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.35); }
.crit-tag{ color:#a97c14; font-size:.76rem; margin-left:4px; }
.ct-type{ font-size:.64rem; font-weight:normal; color:var(--brown-soft); letter-spacing:.08em; }

/* しくじりの警告 */
.flaw-note{
  text-align:center; font-size:.7rem; color:var(--red);
  background:#f9ece8; border:1.5px dashed var(--red);
  border-radius:10px; padding:5px 8px; margin-bottom:8px;
}

/* 今日はここまで */
.rest-link{
  text-align:center; font-size:.7rem; color:var(--brown-mid);
  margin-top:10px; text-decoration:underline; cursor:pointer; padding:4px;
}

/* 職人手帳 */
.note-item{
  border:2px solid var(--wood-light); border-radius:12px;
  padding:7px 11px; margin-bottom:7px; background:#fffdf7;
  font-size:.7rem; line-height:1.7;
}
.note-item .n-head{ font-weight:bold; font-size:.78rem; }
.note-item .n-combo{ color:var(--brown-mid); }
.note-item.hit{ border-color:var(--gold); background:#fdf6e6; }
.note-item.near{ border-color:var(--green-deep); }
.note-near-tag{
  display:inline-block; font-size:.64rem; font-weight:bold; color:var(--green-deep);
  border:1.5px solid var(--green-deep); background:#eef5e8;
  border-radius:999px; padding:1px 7px; margin-left:4px;
}
.note-empty{ text-align:center; font-size:.74rem; color:var(--brown-mid); line-height:1.9; }

/* 図鑑の山場メモ */
.dex-crit{
  display:inline-block; font-size:.66rem; font-weight:bold; color:#a97c14;
  border:1.5px solid var(--gold); background:#fdf3d5;
  border-radius:999px; padding:1px 8px; margin-top:4px;
}

/* 来館者のひとこと */
.visitor-line{
  border:2px solid var(--wood-light); border-radius:12px;
  padding:8px 11px; margin-bottom:10px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
  font-size:.74rem; line-height:1.8; text-align:justify;
}

/* 物語解放ポップアップ */
#story-pop .modal{ text-align:center; }
#story-pop .story-text{
  font-size:.84rem; line-height:2; margin:10px 0; text-align:justify;
  padding:12px; background:#fdf6e6; border-radius:12px;
  border:1.5px dashed var(--gold);
  white-space:pre-line;
}
.pop-badge{ font-size:2.2rem; display:block; animation:pulse 1.2s infinite; }
</style>

<body>

<!-- ========== ヘッダー ========== -->
<header>
  <h1>🪑 松永工房クラフトストーリー
    <span class="sub">〜小さな家具と、届かなかった手紙〜</span>
  </h1>
  <div class="status">
    <span class="chip">💰 <span id="st-money">0</span>円</span>

<!-- ========== メイン ========== -->
<main>

</main>

<!-- ========== 工程エリア ========== -->
<div id="steps-area"></div>

<!-- ========== 固定フッター ========== -->
<footer>

<!-- ========== モーダル：図鑑（主役。物語・手紙もここに） ========== -->
<div class="modal-back" id="dex-modal">

<!-- ========== モーダル：ショールーム（展示） ========== -->

    <button class="close" data-close="show-modal">とじる</button>

    <button class="x-close" data-close="market-modal" aria-label="とじる">✕</button>
    <h3>🧺 材料の仕入れ</h3>
    <div id="market-body"></div>
    <button class="close" data-close="market-modal">とじる</button>
  </div>
</div>

<!-- ========== モーダル：設備投資 ========== -->
<div class="modal-back" id="gear-modal">
  <div class="modal">
    <button class="x-close" data-close="gear-modal" aria-label="とじる">✕</button>
    <h3>🛠 工房の設備</h3>
    <div id="gear-list"></div>

</div>

<!-- ========== モーダル：松永工房紹介 ========== -->
<div class="modal-back" id="about-modal">
  <div class="modal">
    <button class="x-close" data-close="about-modal" aria-label="とじる">✕</button>

  <div class="modal">
    <button class="x-close" data-close="avatar-modal" aria-label="とじる">✕</button>

      <input class="av-name-input" id="av-name" maxlength="12" placeholder="名前を入れてください">

    <div class="av-hint">ヘンリーさんが、この名前で呼んでくれます</div>
    <div id="av-rows"></div>
    <button class="av-done" id="av-done">この職人ではじめる</button>

<!-- ========== モーダル：物語解放ポップアップ ========== -->
<div class="modal-back" id="story-pop">
  <div class="modal">

<script>
/* ==========================================================
   職人（プレイヤー）の似顔絵
   ----------------------------------------------------------
   パーツを組み合わせてSVGを描く。保存されるのは番号だけなので軽い。
   パーツを増やすときは、各配列に1つ足すだけでよい。

const AV_HAIR_COLOR = ["#3a2a1c", "#6b4a2f", "#a9713f", "#d8b45e", "#e9e9e2", "#7a3f31"];

const AV_HAIR = [
  { name: "みじかめ",

  { name: "ながめ",

    front: c => `<path d="M16 48 Q18 16 50 14 Q82 16 84 48 Q74 32 58 34 Q52 24 44 34 Q28 34 16 48 Z" fill="${c}"/>` },
  { name: "むすび",
    back: c => `<circle cx="50" cy="11" r="11" fill="${c}"/>`,
    front: c => `<path d="M16 48 Q18 16 50 14 Q82 16 84 48 Q78 32 56 32 Q34 32 16 48 Z" fill="${c}"/>` },
  { name: "くるくる",
    back: () => "",
    front: c => `<path d="M17 48 Q13 34 22 30 Q20 16 34 18 Q40 8 50 14 Q60 8 66 18 Q80 16 78 30 Q87 34 83 48 Q72 34 50 34 Q28 34 17 48 Z" fill="${c}"/>` },
  { name: "ぼうず",
    back: () => "",
    front: c => `<path d="M19 46 Q23 22 50 20 Q77 22 81 46 Q73 37 50 37 Q27 37 19 46 Z" fill="${c}" opacity=".8"/>` },
  { name: "つるり",
    back: () => "", front: () => "" }
];

/* 目 */
const AV_EYES = [
  { name: "まるい", svg: () => `
    <circle cx="38" cy="53" r="4.2" fill="#4a3423"/><circle cx="62" cy="53" r="4.2" fill="#4a3423"/>

/* 似顔絵SVGを組み立てる。av = {skin,hairColor,hair,eyes,mouth,hat,glasses,beard} の番号 */
function buildAvatar(av) {
  const a = Object.assign({ skin:0, hairColor:1, hair:0, eyes:0, mouth:0, hat:0, glasses:0, beard:0 }, av || {});
  const skin = AV_SKIN[a.skin] || AV_SKIN[0];
  const hc   = AV_HAIR_COLOR[a.hairColor] || AV_HAIR_COLOR[0];
  const hair = AV_HAIR[a.hair] || AV_HAIR[0];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="職人の顔">
    ${hair.back(hc)}
    <ellipse cx="17" cy="57" rx="5" ry="7" fill="${skin}"/>

    <circle cx="50" cy="54" r="34" fill="${skin}"/>

    <ellipse cx="70" cy="65" rx="5" ry="3.2" fill="#f0b9a0" opacity=".5"/>
    ${(AV_BEARD[a.beard] || AV_BEARD[0]).svg(hc)}
    ${(AV_MOUTH[a.mouth] || AV_MOUTH[0]).svg()}
    ${(AV_EYES[a.eyes] || AV_EYES[0]).svg()}
    ${(AV_GLASSES[a.glasses] || AV_GLASSES[0]).svg()}
    ${hair.front(hc)}
    ${(AV_HAT[a.hat] || AV_HAT[0]).svg()}
  </svg>`;
}

const stepType = (step) => STEP_TYPES[STEP_TYPE_OF[step.label] || "kumi"];
const choicesForStep = (step) => stepType(step).choices;

/* ==========================================================
   職人アクション
   ----------------------------------------------------------
   山場工程だけ、選択肢ではなく実際に指を動かして作る。
   反射神経ではなく「ていねいさ・正確さ」を測る。
   どのアクションも 0〜100 点を返し、その点が品質に化ける。

   アクションを足すときは CRAFT_ACTIONS にキーを1つ増やし、
   その工程タイプ（STEP_TYPE_OF の値）と同じ名前にすればよい。
   ========================================================== */
const ACT_VIEW = 300;          // アクション画面の座標系（正方形）

/* 画面上の指の位置を、SVGの座標に直す。
   SVGに余白が入っても正しく取れるよう、ブラウザ自身の変換を使う */
function actPoint(svg, e) {
  const m = svg.getScreenCTM();
  if (m) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(m.inverse());
    return { x: q.x, y: q.y };
  }
  const r = svg.getBoundingClientRect();   // 念のための保険
  return { x: (e.clientX - r.left) / r.width * ACT_VIEW,
           y: (e.clientY - r.top) / r.height * ACT_VIEW };
}
const actDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp100 = (n) => Math.max(0, Math.min(100, Math.round(n)));

/* ----------------------------------------------------------
   彫刻の文様
   一筆でなぞれる形だけを使う。points() が採点用の通過点、
   dense() が下絵として描くなめらかな線。
   文様を足すときは、この2つを返す項目を1つ増やすだけでよい。

        held = parts.filter(p => !p.at).find(p => {
          const w = p.w * CELL / 2, h = p.h * CELL / 2;
          return pt.x > p.sx - 10 && pt.x < p.sx + w + 10 && pt.y > p.sy - 10 && pt.y < p.sy + h + 10;
        });
        if (held) {
          grab = { x: pt.x - held.sx, y: pt.y - held.sy };
          /* つかんだら実寸になる */
          const rc = svg.querySelector("#q" + held.id + " rect");
          rc.setAttribute("width", held.w * CELL);
          rc.setAttribute("height", held.h * CELL);
        }
      };
      ui.onPoint = (pt) => {
        if (!held) return;
        svg.querySelector("#q" + held.id).setAttribute("transform",
          `translate(${pt.x - grab.x - held.sx},${pt.y - grab.y - held.sy})`);
      };
      ui.onUp = (pt) => {
        if (!held) return;
        const p = held; held = null;
        const g = svg.querySelector("#q" + p.id), rc = g.querySelector("rect");
        const at = { x: pt.x - grab.x, y: pt.y - grab.y };
        const c = Math.round((at.x - OX) / CELL), r = Math.round((at.y - OY) / CELL);
        const used = occupied();
        let ok = c >= 0 && r >= 0 && c + p.w <= COLS && r + p.h <= ROWS;
        if (ok) {
          for (let i = 0; i < p.w && ok; i++)
            for (let j = 0; j < p.h && ok; j++)
              if (used[(c + i) + "," + (r + j)]) ok = false;
        }
        if (!ok) {                       /* 板からはみ出す・節にかかる・重なる */
          bad++;
          g.removeAttribute("transform");
          rc.setAttribute("width", p.w * CELL / 2);
          rc.setAttribute("height", p.h * CELL / 2);
          ui.say(c >= 0 && r >= 0 && c + p.w <= COLS && r + p.h <= ROWS
            ? "そこは節じゃ。よけて取るのじゃ。" : "板からはみ出しておるぞ。");
          return;
        }
        p.at = { c, r };
        placed++;
        g.setAttribute("transform", `translate(${cx(c) - p.sx},${cy(r) - p.sy})`);
        rc.setAttribute("stroke", "#523318");
        rc.setAttribute("stroke-width", "3");
        ui.say("");
        ui.progress(placed / parts.length);
        if (placed === parts.length) {
          setTimeout(() => done(clamp100(100 - bad * 7),
            bad ? `${bad}度ほど取り直したな。` : "無駄なく取れておる。見事な木取りじゃ。"), 280);
        }
      };
    }
  },

  /* ---------- 釘打ち：拍に合わせてほぞを打ちこむ ---------- */
  rhythm: {
    name: "釘打ち", limit: 0,
    tip: "ほぞに釘を打ちこむ。輪がしるしに<b>重なった瞬間</b>に叩く。強すぎても弱すぎても木が割れる。",
    start(svg, ui, done) {
      const N = 8, TARGET = 16, R0 = 44, DUR = 820, GAP = 240;
      const nails = [];
      for (let i = 0; i < N; i++) nails.push({ x: 42 + i * 31, hit: null });
      let idx = 0, t0 = Date.now() + 500, phase = "gap", raf = null, sum = 0;

      svg.innerHTML =
        `<rect x="16" y="150" width="268" height="86" rx="10" fill="#8a5a30"/>
         <rect x="16" y="140" width="268" height="18" rx="6" fill="#b07c4a"/>` +
        nails.map((n, i) => `<g id="n${i}">
          <rect x="${n.x - 3}" y="118" width="6" height="30" rx="2" fill="#b8b8b8"/>
          <ellipse cx="${n.x}" cy="118" rx="7" ry="3.5" fill="#d8d8d8"/>
        </g>`).join("") +
        `<circle id="ring" cx="${nails[0].x}" cy="118" r="${R0}" fill="none"
           stroke="#7a9c6e" stroke-width="3.5" opacity="0"/>
         <circle id="mark" cx="${nails[0].x}" cy="118" r="${TARGET}" fill="none"
           stroke="#c9a24b" stroke-width="3" stroke-dasharray="4 4"/>
         <text id="hitword" x="150" y="76" text-anchor="middle" font-size="22" fill="#a97c14" opacity="0"></text>
         <text x="150" y="34" text-anchor="middle" font-size="14" fill="#8a6446">輪が金の印に重なったら叩く</text>
         <text x="150" y="272" text-anchor="middle" font-size="13" fill="#b08a63">トン……トン……と、同じ拍で</text>`;

      const ring = svg.querySelector("#ring"), mark = svg.querySelector("#mark");
      const word = svg.querySelector("#hitword");

      const moveTo = (i) => {
        ring.setAttribute("cx", nails[i].x);
        mark.setAttribute("cx", nails[i].x);
      };
      const say = (t, col) => {
        word.textContent = t; word.setAttribute("fill", col);
        word.setAttribute("opacity", "1");
        setTimeout(() => word.setAttribute("opacity", "0"), 420);
      };

      /* 打った瞬間の輪の大きさで出来を決める */
      const judge = (r) => {
        const off = Math.abs(r - TARGET);
        let s, t, col;
        if (off <= 3)      { s = 100; t = "会心！"; col = "#a97c14"; }
        else if (off <= 8) { s = 78;  t = "よし";   col = "#7a9c6e"; }
        else if (off <= 15){ s = 48;  t = "あまい"; col = "#8a6446"; }
        else               { s = 12;  t = "曲がった"; col = "#b8563e"; }
        nails[idx].hit = s; sum += s;
        say(t, col);
        /* 打てたぶんだけ釘が沈む */
        const g = svg.querySelector("#n" + idx);
        g.setAttribute("transform", `translate(0,${8 + (100 - s) / 100 * 6})`);
        if (s <= 12) g.setAttribute("opacity", ".55");
        ui.progress((idx + 1) / N);
        idx++;
        if (idx >= N) {
          ring.setAttribute("opacity", "0");
          phase = "done";
          const avg = sum / N;
          setTimeout(() => done(clamp100(avg),
            avg >= 85 ? "小気味のよい音じゃった。" :
            avg >= 55 ? "まずまずの手さばきじゃ。" : "拍が合っておらんかったのう。"), 420);
        } else {
          phase = "gap"; t0 = Date.now();
          moveTo(idx);
        }
      };

      const loop = () => {
        const el = Date.now() - t0;
        if (phase === "swing") {
          const p = Math.min(1, el / DUR);
          ring.setAttribute("r", (R0 - (R0 - 5) * p).toFixed(1));
          if (p >= 1) judge(0);          // 叩かずに過ぎた
        } else if (phase === "gap") {
          if (el >= GAP) {
            phase = "swing"; t0 = Date.now();
            ring.setAttribute("opacity", "1");
            ring.setAttribute("r", R0);
          }
        }
        if (phase !== "done") raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
      ui.onStop = () => { if (raf) cancelAnimationFrame(raf); phase = "done"; };
      ui.onDown = () => { if (phase === "swing") judge(+ring.getAttribute("r")); };
    }
  },

  /* ---------- 彫刻：下絵の文様を一筆でなぞる ---------- */
  hori: {
    name: "彫刻", limit: 24000,
    tip: "うっすら引いた下絵を、<b>一筆で</b>なぞって彫る。線から外れぬように。",
    start(svg, ui, done) {
      /* 家具によって文様が変わる。難しい家具ほど込み入った文様になる */
      const kind = CARVE_PATTERN[state.currentId] || "vine";
      const pat = CARVE_PATTERNS[kind];
      const pts = pat.points().map(p => ({ ...p, hit: false }));
      const R = 34;                                   // 線から離れてよい幅
      /* 各点について「いちばん近づいた距離」を覚えておく。
         順番の前後で減点せず、線をどれだけ忠実になぞれたかだけを見る */
      pts.forEach(p => { p.min = 9999; });
      let finished = false;

      /* なめらかな下絵の線（採点は点で、見た目は曲線で） */
      const smooth = (list) => list.map((p, i) =>
        (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");

      svg.innerHTML =
        `<rect x="14" y="14" width="272" height="272" rx="16" fill="#b07c4a"/>
         <rect x="24" y="24" width="252" height="252" rx="11" fill="none"
           stroke="#8a5a30" stroke-width="3" opacity=".55"/>
         ${pat.decor || ""}
         <path d="${smooth(pat.dense())}" stroke="#8a5a30" stroke-width="10" fill="none"
           stroke-linecap="round" stroke-linejoin="round" opacity=".32"/>
         <path id="carved" d="" stroke="#f2cf9d" stroke-width="7.5" fill="none"
           stroke-linecap="round" stroke-linejoin="round"/>` +
        pts.map((p, i) => `<circle id="d${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}"
          r="4.5" fill="#8a5a30" opacity=".5"/>`).join("") +
        `<circle id="startdot" cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="13"
           fill="none" stroke="#7a9c6e" stroke-width="3">
           <animate attributeName="r" values="10;16;10" dur="1.3s" repeatCount="indefinite"/>
         </circle>
         `;
      ui.setTip(`うっすら引いた下絵を、<b>一筆で</b>なぞって彫る。線から外れぬように。
        <br><b>${pat.label}</b>`);

      /* 彫れたところは、点を直線でつながず、下絵と同じ曲線で描く。
         つながって彫れている区間だけを、その区間の曲線として起こす */
      const drawCarved = () => {
        const runs = [];
        let cur = [];
        pts.forEach((t, i) => {
          if (t.hit) cur.push(i);
          else { if (cur.length > 1) runs.push(cur); cur = []; }
        });
        if (cur.length > 1) runs.push(cur);
        const last = pts.length - 1;
        const d = runs.map(run => {
          const t0 = run[0] / last, t1 = run[run.length - 1] / last;
          const sub = [];
          for (let k = 0; k <= 44; k++) sub.push(pat.curve(t0 + (t1 - t0) * k / 44));
          return smooth(sub);
        }).join(" ");
        svg.querySelector("#carved").setAttribute("d", d);
      };

      const finish = () => {
        const hit = pts.filter(p => p.hit);
        const dev = hit.length ? hit.reduce((a, p) => a + p.min, 0) / hit.length : R;
        const missed = pts.length - hit.length;
        done(clamp100(hit.length / pts.length * 100 - dev * 1.2),
          missed ? `${missed}か所ほど彫り残したのう。`
            : dev > 14 ? "線から少し逃げておったな。" : "線が生きておる。よい彫りじゃ。");
      };
      ui.onTimeout = finish;

      ui.onPoint = (p) => {
        let n = 0;
        pts.forEach((t, i) => {
          const d = actDist(p, t);
          if (d < t.min) {
            t.min = d;
            if (d < R && !t.hit) {
              t.hit = true;
              const dot = svg.querySelector("#d" + i);
              dot.setAttribute("fill", "#f2cf9d");
              dot.setAttribute("opacity", "1");
              if (i === 0) svg.querySelector("#startdot").style.display = "none";
              drawCarved();
            }
          }
          if (t.hit) n++;
        });
        ui.progress(n / pts.length);
        if (n === pts.length && !finished) { finished = true; setTimeout(finish, 280); }
      };
    }
  },

  /* ---------- 金具：位置を合わせて留める ---------- */
  kanagu: {
    name: "金具", limit: 0,
    tip: "金具を<b>印に合わせて</b>置き、ねじ穴をひとつずつ留める。",
    start(svg, ui, done) {
      const T = { x: 150, y: 132 };
      let placed = false, placeScore = 0, screws = 0, screwSum = 0;
      const holes = [{ x: T.x - 26, y: T.y }, { x: T.x + 26, y: T.y }];

      svg.innerHTML =
        `<rect x="30" y="60" width="240" height="180" rx="14" fill="#b07c4a"/>
         <path d="M${T.x - 16} ${T.y} L${T.x + 16} ${T.y} M${T.x} ${T.y - 16} L${T.x} ${T.y + 16}"
           stroke="#c9a24b" stroke-width="2.4"/>
         <circle cx="${T.x}" cy="${T.y}" r="30" fill="none" stroke="#c9a24b"
           stroke-width="2" stroke-dasharray="5 5"/>
         <g id="metal" style="cursor:grab">
           <rect x="${150 - 38}" y="${216 - 9}" width="76" height="18" rx="7"
             fill="#e8c04b" stroke="#a97c14" stroke-width="2.4"/>
         </g>
         <text x="150" y="44" text-anchor="middle" font-size="15" fill="#8a6446">金具を印へ</text>`;

      let held = false, grab = null, pos = { x: 150, y: 216 };
      ui.onDown = (p) => {
        if (placed) return;
        if (Math.abs(p.x - pos.x) < 50 && Math.abs(p.y - pos.y) < 22) {
          held = true; grab = { x: p.x - pos.x, y: p.y - pos.y };
        }
      };
      ui.onPoint = (p) => {
        if (!held) return;
        const at = { x: p.x - grab.x, y: p.y - grab.y };
        svg.querySelector("#metal").setAttribute("transform",
          `translate(${at.x - 150},${at.y - 216})`);
      };
      ui.onUp = (p) => {
        if (!held) { if (placed) tapScrew(p); return; }
        held = false;
        const at = { x: p.x - grab.x, y: p.y - grab.y };
        const d = actDist(at, T);
        if (d > 34) { svg.querySelector("#metal").removeAttribute("transform"); return; }
        placed = true;
        placeScore = Math.max(0, 100 - d * 2.6);
        svg.querySelector("#metal").setAttribute("transform",
          `translate(${T.x - 150},${T.y - 216})`);
        ui.progress(0.4);
        ui.say("よし。あとはねじ穴を留めるのじゃ。");
        svg.insertAdjacentHTML("beforeend", holes.map((h, i) =>
          `<circle id="h${i}" cx="${h.x}" cy="${h.y}" r="6" fill="#a97c14"
             stroke="#fff" stroke-width="1.6"/>`).join(""));
      };
      function tapScrew(p) {
        const i = holes.findIndex(h => !h.done && actDist(p, h) < 32);
        if (i < 0) return;
        holes[i].done = true;
        screwSum += Math.max(0, 100 - actDist(p, holes[i]) * 5);
        screws++;
        const el = svg.querySelector("#h" + i);
        el.setAttribute("fill", "#f2cf9d");
        el.setAttribute("r", "7");
        ui.progress(0.4 + 0.3 * screws);
        if (screws === holes.length) {
          setTimeout(() => done(
            clamp100(placeScore * 0.6 + (screwSum / holes.length) * 0.4),
            placeScore > 80 ? "寸分の狂いもない。" : "少し傾いておるかのう。"), 260);
        }
      }
    }
  }
};

/* ---------- セーブ／ロード ---------- */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* 保存不可でも続行 */ }
}
function load() {
  let savedVer = 5;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      savedVer = data.ver;
      state = Object.assign(state, data);
    }
  } catch (e) { /* 壊れたデータは無視して新規開始 */ }

  /* --- 旧セーブデータからの移行（第1〜4章を壊さず引き継ぐ） --- */
  Object.keys(state.completed).forEach(id => {
    if (typeof state.completed[id] === "number") {
      state.completed[id] = { count: state.completed[id], best: null };
    }
  });
  if (typeof state.quality !== "number") state.quality = state.stepIndex;
  if (savedVer === undefined) {   // 第1・2章: 品質を100点制へ換算
    state.quality = state.currentId
      ? Math.max(0, Math.min(100, BASE_QUALITY + state.quality * 6)) : 0;
  }
  if (savedVer !== 4 && savedVer !== 5) {   // 第3章まで: 時間・設備を補完
    if (typeof state.day !== "number") state.day = 1;
    if (typeof state.hoursLeft !== "number") state.hoursLeft = HOURS_PER_DAY;
    if (!Array.isArray(state.gear)) state.gear = [];
    state.craftUsed = state.currentId ? state.stepIndex * 2 : 0;
  }
  if (savedVer !== 5 && savedVer !== 6) {   // 第4章まで: 材料・展示・来館者を補完
    Object.values(state.completed).forEach(rec => {
      if (rec && typeof rec === "object") {
        if (rec.bestScore === undefined) rec.bestScore = null;
        if (rec.bestPop === undefined) rec.bestPop = null;
      }
    });
    if (!state.materials || typeof state.materials !== "object") {
      state.materials = { walnut: 0, oak: 2, cherry: 0, brass: 0, glass: 0, cloth: 2 };
    }
    if (!Array.isArray(state.showroom)) state.showroom = [];
    if (typeof state.totalVisitors !== "number") state.totalVisitors = 0;
    if (!Array.isArray(state.seenBP)) state.seenBP = [];
    /* 旧セーブで制作途中なら、標準の組み合わせで続行（材料消費なし） */
    if (state.currentId && !state.craft) {
      state.craft = { design: "classic", wood: "oak", finish: "natural" };
    }
  }
  if (savedVer !== 6) {   // 第5章まで: 集中力・手帳・山場の記憶を補完
    if (typeof state.focus !== "number") state.focus = FOCUS_PER_DAY;
    if (typeof state.flaws !== "number") state.flaws = 0;
    if (!Array.isArray(state.notebook)) state.notebook = [];
    if (!Array.isArray(state.knownCritical)) state.knownCritical = [];
    /* すでに作ったことのある家具は、山場を知っているものとして引き継ぐ */
    Object.keys(state.completed).forEach(id => {
      if (CRITICAL_STEP[id] !== undefined && state.knownCritical.indexOf(id) < 0) {
        state.knownCritical.push(id);
      }
    });
    state.ver = 6;
  }
  if (savedVer !== 7) {   // 第6章まで: 職人の名前と顔を用意する
    if (!state.player || typeof state.player !== "object") state.player = {};
    if (typeof state.player.name !== "string") state.player.name = "";
    if (!state.player.avatar || typeof state.player.avatar !== "object") {
      state.player.avatar = { skin:0, hairColor:1, hair:0, eyes:0, mouth:0, hat:0, glasses:0, beard:0 };
    }
    state.ver = 7;
  }
  if (savedVer !== 8) {   // 第7章まで: 職人アクションの記録欄を用意する
    if (!state.actionBest || typeof state.actionBest !== "object") state.actionBest = {};
    if (!state.actionStats || typeof state.actionStats !== "object") state.actionStats = {};
    state.ver = 8;
  }
  if (savedVer !== 9) {   // 第8章まで: 山場の出来を覚える欄を用意する
    if (state.actionScore === undefined) state.actionScore = null;
    state.ver = 9;
  }
}

const esc = (t) => String(t).replace(/[&<>"]/g,

/* 図鑑・カードの絵。photo(将来のユーザー写真) → SVG → 絵文字 の順で採用 */
function artOf(entry, cls, filter) {
  if (entry.photo) {
    const st = filter ? ` style="filter:${filter}"` : "";
    return `<span class="${cls}"${st}><img src="${entry.photo}" alt="${esc(entry.name)}"></span>`;
  }
  if (SVG_ART[entry.art]) {
    const st = filter ? ` style="filter:${filter}"` : "";
    return `<span class="${cls}"${st}>${SVG_ART[entry.art]}</span>`;
  }
  return `<span class="icon">${entry.icon}</span>`;
}

function calcLevel(exp) {
  let lv = 1;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i]) lv = i + 1;

function bpUnlocked(f) {
  const u = f.unlock;
  if (u.type === "level") return state.level >= u.v;
  if (u.type === "visitors") return state.totalVisitors >= u.v;
  if (u.type === "letters") return lettersFound() >= u.v;
  return false;
}
function bpCondLabel(f) {

  if (u.type === "level") return `工房レベル ${u.v} で解放`;
  if (u.type === "visitors") return `のべ来館者 ${u.v} 人で解放`;

/* ==========================================================
   材料：所持数・必要数・消費
   ========================================================== */
/* 必要材料 {woodId or null, wood数, 部品} を prep/craft の選択から計算 */
function neededMaterials(f, designId) {
  const d = designById(designId);
  const woodCount = Math.max(1, (f.materials.wood || 0) + (d.extraWood || 0));
  const parts = {};
  ["brass", "glass", "cloth"].forEach(k => { if (f.materials[k]) parts[k] = f.materials[k]; });
  return { woodCount, parts };
}
/* 選んだ木材・部品が足りているか */
function canCraft(f, designId, woodId) {
  const need = neededMaterials(f, designId);
  if ((state.materials[woodId] || 0) < need.woodCount) return false;
  return Object.keys(need.parts).every(k => (state.materials[k] || 0) >= need.parts[k]);
}
/* どれかの木材で作れるか（設計図一覧の判定用） */
function canCraftAnyWood(f) {
  return MATERIALS.filter(m => m.type === "wood")
    .some(w => canCraft(f, prepDesignDefault(f), w.id));
}
function prepDesignDefault() { return "classic"; }
/* 材料を消費して制作開始 */
function consumeMaterials(f, designId, woodId) {
  const need = neededMaterials(f, designId);
  state.materials[woodId] -= need.woodCount;
  Object.keys(need.parts).forEach(k => { state.materials[k] -= need.parts[k]; });
}

/* ==========================================================
   図鑑エントリ（家具＋隠しレシピ）
   ========================================================== */
function allDexEntries() {
  return FURNITURE.map(f => ({ kind: "base", ...f }))
    .concat(RECIPES.map(r => {
      const base = furnitureById(r.baseId);
      return { kind: "secret", id: r.id, name: r.name, icon: r.icon,
               art: base.art, photo: base.photo, artFilter: r.filter,
               description: r.description, story: r.story, hint: r.hint };
    }));
}
const dexTotal = () => allDexEntries().length;
const dexFound = () => allDexEntries().filter(e => state.completed[e.id] && state.completed[e.id].count > 0).length;

  $("#chip-focus").classList.toggle("focus-low", state.focus < 30);

  const title = LEVEL_TITLES[Math.min(state.level - 1, LEVEL_TITLES.length - 1)];
  $("#player-face").innerHTML = buildAvatar(state.player.avatar);

    fill.style.width = "100%";
    label.innerHTML = `${who}（最高レベル！）　📖 ${dexFound()}/${dexTotal()}`;

    fill.style.width = Math.min(100, ((state.exp - cur) / (next - cur)) * 100) + "%";
    label.innerHTML = `${who}　次のLvまで あと${next - state.exp}　📖 ${dexFound()}/${dexTotal()}`;
  }
}
