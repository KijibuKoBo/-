/* ==========================================================
   材料：所持数・必要数・消費
   ========================================================== */
/* 必要材料 {woodId or null, wood数, 部品} を prep/craft の選択から計算 */
function neededMaterials(f, designId) {
  const d = designById(designId);
  const woodCount = Math.max(1, (f.materials.wood || 0) + (d.extraWood || 0));
  const parts = {};
  ["brass", "glass", "cloth"].forEach(k => { if (f.materials[k]) parts[k] = f.materials[k]; });
  return { woodCount, parts };
}
/* 選んだ木材・部品が足りているか */
function canCraft(f, designId, woodId) {
  const need = neededMaterials(f, designId);
  if ((state.materials[woodId] || 0) < need.woodCount) return false;
  return Object.keys(need.parts).every(k => (state.materials[k] || 0) >= need.parts[k]);
}
/* どれかの木材で作れるか（設計図一覧の判定用） */
function canCraftAnyWood(f) {
  return MATERIALS.filter(m => m.type === "wood")
    .some(w => canCraft(f, prepDesignDefault(f), w.id));
}
function prepDesignDefault() { return "classic"; }
/* 材料を消費して制作開始 */
function consumeMaterials(f, designId, woodId) {
  const need = neededMaterials(f, designId);
  state.materials[woodId] -= need.woodCount;
  Object.keys(need.parts).forEach(k => { state.materials[k] -= need.parts[k]; });
}

/* ==========================================================
   図鑑エントリ（家具＋隠しレシピ）
   ========================================================== */
function allDexEntries() {
  return FURNITURE.map(f => ({ kind: "base", ...f }))
    .concat(RECIPES.map(r => {
      const base = furnitureById(r.baseId);
      return { kind: "secret", id: r.id, name: r.name, icon: r.icon,
               art: base.art, photo: r.photo || base.photo,
               artFilter: r.photo ? null : r.filter,
               description: r.description, story: r.story, hint: r.hint };
    }));
}
const dexTotal = () => allDexEntries().length;
const dexFound = () => allDexEntries().filter(e => state.completed[e.id] && state.completed[e.id].count > 0).length;

/* ==========================================================
   描画：ステータス
   ========================================================== */
function renderStatus() {
  $("#st-money").textContent = state.money.toLocaleString();
  $("#st-level").textContent = state.level;
  $("#st-day").textContent = state.day;
  $("#st-hours").textContent = state.hoursLeft;
  $("#st-focus").textContent = state.focus;
  /* 集中力が心もとなくなったら赤くする */
  $("#chip-focus").classList.toggle("focus-low", state.focus < focusPerDay() * 0.3);
  $("#st-visitors").textContent = state.totalVisitors.toLocaleString();

  const cur = LEVELS[state.level - 1];
  const next = LEVELS[state.level];
  const fill = $("#lv-fill"), label = $("#lv-label");
  const title = LEVEL_TITLES[Math.min(state.level - 1, LEVEL_TITLES.length - 1)];
  $("#player-face").innerHTML = buildAvatar(state.player.avatar);
  const who = `<b>${esc(you())}</b>・${title}`;
  if (next === undefined) {
    fill.style.width = "100%";
    label.innerHTML = `${who}（最高レベル！）　📖 ${dexFound()}/${dexTotal()}`;
  } else {
    fill.style.width = Math.min(100, ((state.exp - cur) / (next - cur)) * 100) + "%";
    label.innerHTML = `${who}　次のLvまで あと${next - state.exp}　📖 ${dexFound()}/${dexTotal()}`;
  }
}

/* ==========================================================
   描画：設計図えらび（ホーム画面）
   ========================================================== */
function renderSelect() {
  const card = (f) => {
    if (bpUnlocked(f)) {
      const need = neededMaterials(f, "classic");
      const partChips = Object.keys(need.parts).map(k => {
        const m = materialById(k);
        const ok = (state.materials[k] || 0) >= need.parts[k];
        return `<span class="mat-chip${ok ? "" : " ng"}">${m.icon}${m.name}×${need.parts[k]}</span>`;
      }).join("");
      const woodOk = MATERIALS.some(m => m.type === "wood" && (state.materials[m.id] || 0) >= need.woodCount);
      const woodChip = `<span class="mat-chip${woodOk ? "" : " ng"}">🪵木材×${need.woodCount}〜</span>`;
      return `<button class="select-item" data-id="${f.id}">
        ${artOf(f, "thumb")}
        <span><span class="name">${f.name}</span>
        <div class="info">💰${f.price.toLocaleString()}円〜 ／ ⏳納期${f.deadline}h ／ 人気${f.basePop}<br>${woodChip}${partChips}</div></span>
      </button>`;
    }
    return `<div class="select-item locked">
      <span class="icon">📜</span>
      <span><span class="name">？？？の設計図</span>
      <div class="info">${bpCondLabel(f)}</div></span>
    </div>`;
  };

  let html = `<div class="select-title">📜 どの設計図で作る？（図鑑 ${dexFound()}/${dexTotal()}）</div>`;
  CHAPTERS.forEach(ch => {
    const list = FURNITURE.filter(f => chapterOf(f) === ch.n);
    if (!list.length) return;
    const open = chapterOpen(ch.n);
    const next = CHAPTERS[ch.n];          // 次の章（最後の章では undefined）
    const sub = !open
      ? `🔒 ${CHAPTERS[ch.n - 2].short}の家具を <b>会心で ${chapterDone(ch.n - 1)} / ${ch.need} 台</b>仕上げると開く`
      : next
        ? `次の章まで　<b>会心の一台 ${chapterDone(ch.n)} / ${next.need} 台</b><span class="ch-ace">会心＝Aランク以上を、納期内に</span>`
        : "ここが最後の章じゃ";
    html += `<div class="ch-head${open ? "" : " locked"}">
      <div class="ch-name">${open ? "" : "🔒 "}${ch.name}　<span class="ch-n">${list.length}種</span></div>
      <div class="ch-sub">${sub}</div></div>`;
    if (open) html += `<div class="select-list">${list.map(card).join("")}</div>`;
  });
  $("#card-area").innerHTML = html;
  $("#steps-area").innerHTML = "";

  document.querySelectorAll(".select-item[data-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = furnitureById(btn.dataset.id);
      /* 設計えらびへ。木材は持っているものを初期選択 */
      const firstWood = MATERIALS.find(m => m.type === "wood" && (state.materials[m.id] || 0) > 0);
      prep = { fid: f.id, design: "classic", wood: firstWood ? firstWood.id : "oak", finish: "natural" };
      showMessage(`「${f.name}」じゃな。設計・素材・仕上げで顔つきが決まるぞ。`);
      render();
    });
  });
}

/* ==========================================================
   描画：制作前の設計えらび（設計・素材・仕上げ）
   ========================================================== */
function renderPrep() {
  const f = furnitureById(prep.fid);
  const need = neededMaterials(f, prep.design);
  const ok = canCraft(f, prep.design, prep.wood);

  /* 選択肢の行を作る共通関数 */
  const row = (items, key, fmt) => items.map(it =>
    `<button class="opt-chip${prep[key] === it.id ? " selected" : ""}" data-k="${key}" data-v="${it.id}" ${fmt && fmt(it) === false ? "disabled" : ""}>
      ${it.icon} ${it.name}<span class="o-note">${it.note || it.desc || ""}</span>
    </button>`).join("");

  const woods = MATERIALS.filter(m => m.type === "wood" && chOpen(m)).map(m => ({
    ...m, note: `${m.desc.split("。")[1] || ""}　所持${state.materials[m.id] || 0}`
  }));

  const partChips = Object.keys(need.parts).map(k => {
    const m = materialById(k);
    const okp = (state.materials[k] || 0) >= need.parts[k];
    return `<span class="mat-chip${okp ? "" : " ng"}">${m.icon}${m.name} ${state.materials[k] || 0}/${need.parts[k]}</span>`;
  }).join("");
  const woodOk = (state.materials[prep.wood] || 0) >= need.woodCount;
  const woodChip = `<span class="mat-chip${woodOk ? "" : " ng"}">${materialById(prep.wood).icon}${materialById(prep.wood).name} ${state.materials[prep.wood] || 0}/${need.woodCount}</span>`;

  $("#card-area").innerHTML = `
    <div class="card prep-card">
      <div class="prep-head">
        ${artOf(f, "art")}
        <div class="ph-body">
          <h2>${f.name}</h2>
          <p class="desc">${f.description}</p>
        </div>
      </div>
      <div class="prep-group"><span class="g-title">📐 設計</span>
        <div class="opt-row">${row(DESIGNS.filter(chOpen), "design")}</div></div>
      <div class="prep-group"><span class="g-title">🪵 木材</span>
        <div class="opt-row">${row(woods, "wood")}</div></div>
      <div class="prep-group"><span class="g-title">🖌️ 仕上げ</span>
        <div class="opt-row">${row(FINISHES.filter(chOpen), "finish")}</div></div>
      <div class="prep-mats">🧺 ${woodChip}${partChips}</div>
    </div>`;

  $("#steps-area").innerHTML =
    `<button class="start-btn" id="btn-start" ${ok ? "" : "disabled"}>
      ${ok ? "🔨 制作をはじめる" : "🧺 材料が足りない（仕入れよう）"}</button>
     <div class="cancel-link" id="btn-cancel">設計図えらびに戻る</div>`;

  document.querySelectorAll(".opt-chip").forEach(b =>
    b.addEventListener("click", () => { prep[b.dataset.k] = b.dataset.v; render(); }));
  $("#btn-cancel").addEventListener("click", () => { prep = null; render(); });
  $("#btn-start").addEventListener("click", () => {
    if (!canCraft(f, prep.design, prep.wood)) return;
    consumeMaterials(f, prep.design, prep.wood);
    state.currentId = f.id;
    state.craft = { design: prep.design, wood: prep.wood, finish: prep.finish };
    state.stepIndex = 0;
    state.craftUsed = 0;
    state.flaws = 0;
    state.actionScore = null;
    /* 土台＝素材50＋設備＋設計・素材・仕上げの補正。
       ここに通常工程の判断が積み上がり、最後に山場の腕前が掛かる */
    state.quality = BASE_QUALITY + gearQualityBonus()
      + designById(prep.design).q + materialById(prep.wood).q + finishById(prep.finish).q;
    prep = null;
    save();
    hideTrivia();
    showMessage(`材料をそろえて、いざ制作じゃ。納期は${f.deadline}時間。よい家具になりそうかの？`);
    render();
  });
}

/* ==========================================================
   完成品（ピース）の計算：隠しレシピ判定・人気・価格
   ========================================================== */
function matchRecipe() {
  const c = state.craft || {};
  return RECIPES.find(r => r.baseId === state.currentId &&
    r.combo.design === c.design && r.combo.wood === c.wood && r.combo.finish === c.finish) || null;
}
function currentPiece() {
  const f = furnitureById(state.currentId);
  const c = state.craft || { design: "classic", wood: "oak", finish: "natural" };
  const v = matchRecipe();
  /* 土台（判断の積み上げ）に、山場の腕前が掛かって品質が決まる。
     山場をまだ通っていなければ、土台そのままを見せる */
  const base = Math.round(state.quality);
  const score = state.actionScore === null
    ? base
    : Math.max(0, Math.min(100, Math.round(base * skillMult(state.actionScore))));
  const rank = calcRank(score);
  const onTime = state.craftUsed <= f.deadline;
  const d = designById(c.design), w = materialById(c.wood), fin = finishById(c.finish);
  const pop = Math.max(1, f.basePop + (v ? v.popBonus : 0) + d.pop + (w.pop || 0) + fin.pop + RANKS[rank].popBonus);
  const mult = RANKS[rank].mult * (onTime ? ONTIME_MULT : LATE_MULT)
    * d.priceMult * (w.priceMult || 1) * fin.priceMult * (v ? v.priceMult : 1) * gearPriceMult();
  const price = Math.round(f.price * mult / 10) * 10;
  return {
    fid: v ? v.id : f.id, baseId: f.id, name: v ? v.name : f.name,
    design: c.design, wood: c.wood, finish: c.finish,
    score, rank, onTime, pop, price, secret: !!v
  };
}

/* ==========================================================
   描画：制作画面
   ========================================================== */
/* しくじりが残っているときの注意書き */
const flawNoteOf = () => state.flaws > 0
  ? `<div class="flaw-note">⚠️ しくじりが ${state.flaws} つ残っている。検品で取り返せる。</div>` : "";

function renderCraft() {
  const f = furnitureById(state.currentId);
  const c = state.craft || {};
  const total = f.steps.length;
  const done = state.stepIndex >= total;
  const pct = Math.round((state.stepIndex / total) * 100);
  /* 土台（判断の積み上げ）と、山場の腕前を分けて見せる */
  const base = Math.round(state.quality);
  const hasAct = state.actionScore !== null;
  const score = hasAct
    ? Math.max(0, Math.min(100, Math.round(base * skillMult(state.actionScore))))
    : base;
  const qPct = Math.max(0, Math.min(100, score));
  const rank = calcRank(score);

  const remain = f.deadline - state.craftUsed;
  const deadlineChip = remain >= 0
    ? `<span>⏳あと${remain}h</span>`
    : `<span class="late">⏰超過${-remain}h</span>`;
  const attrChips =
    `<span>${designById(c.design).icon}${designById(c.design).name}</span>` +
    `<span>${materialById(c.wood) ? materialById(c.wood).icon + materialById(c.wood).name : ""}</span>` +
    `<span>${finishById(c.finish).icon}${finishById(c.finish).name}</span>`;

  $("#card-area").innerHTML = `
    <div class="card${done ? " done" : ""}" id="craft-card">
      ${artOf(f, "art")}
      <h2>${done ? currentPiece().name + " ✨" : f.name}</h2>
      <div class="meta">${attrChips}${deadlineChip}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-label">${done ? "🎉 完成！" : `工程 ${state.stepIndex} / ${total}`}</div>
      <div class="quality-row">
        <span>${hasAct ? "品質" : "土台"}</span>
        <div class="quality-bar"><i style="width:${qPct}%"></i></div>
        <span>${score}点</span>
        ${rankBadge(rank)}
      </div>
      ${hasAct
        ? `<div class="mult-row">土台 ${base}点 × 🔥腕前 <b>×${skillMult(state.actionScore).toFixed(2)}</b>（山場 ${state.actionScore}点）</div>`
        : `<div class="mult-row">🔥山場の出来で、この土台に <b>×0.55〜×1.10</b> が掛かる</div>`}
    </div>`;

  /* 山場工程は、その家具を一度作っていれば見える */
  const critIdx = CRITICAL_STEP[f.id];
  const critKnown = state.knownCritical.indexOf(f.id) >= 0;
  const chips = `<div class="steps">` + f.steps.map((s, i) => {
    const isCrit = critKnown && i === critIdx;
    const cls = (i < state.stepIndex ? "done-step" : (i === state.stepIndex ? "current" : ""))
      + (isCrit ? " critical" : "");
    const mark = i < state.stepIndex ? "✅ " : `${s.icon} `;
    return `<span class="step-chip ${cls}">${mark}${s.label}${isCrit ? " 🔥" : ""}</span>`;
  }).join("") + `</div>`;

  if (done) {
    /* 完成 → 納品（即金）か 展示（来館収入）を選ぶ */
    const p = currentPiece();
    const slotsFree = state.showroom.length < showSlots();
    $("#steps-area").innerHTML = chips +
      `<div class="finish-row">
        <button class="deliver-btn" id="btn-deliver">🚚 納品する<br>＋${p.price.toLocaleString()}円</button>
        <button class="exhibit-btn" id="btn-exhibit" ${slotsFree ? "" : "disabled"}>🖼 展示する<br>${slotsFree ? `人気${p.pop}・毎日収入` : `展示枠がいっぱい`}</button>
      </div>`;
    $("#btn-deliver").addEventListener("click", () => finishCraft(false));
    $("#btn-exhibit").addEventListener("click", () => { if (slotsFree) finishCraft(true); });
    /* 固定フッターやブラウザのバーに隠れないよう、ボタンまで送っておく */
    const toBtn = () => $("#btn-deliver") &&
      $("#btn-deliver").scrollIntoView({ block: "center", behavior: "smooth" });
    requestAnimationFrame(toBtn);
    setTimeout(toBtn, 500);
  } else {
    const step = f.steps[state.stepIndex];
    const atCrit = state.stepIndex === critIdx;
    const act = atCrit ? actionFor(step) : null;

    /* 山場の工程は、選択肢ではなく自分の手で作る */
    if (act) {
      const tired = state.focus < 30;
      $("#steps-area").innerHTML = chips + flawNoteOf() +
        `<div class="act-call">
          <div class="ac-head">🔥 ここが山場じゃ ——「${step.label}」</div>
          <div class="ac-game">${act.name}　<span class="ac-lv">難度 ${
            "★".repeat(actLevel(f))}${"☆".repeat(3 - actLevel(f))} ${
            ACT_LEVEL_NAME[actLevel(f)]}</span></div>
          <div class="ac-sub">${act.tip}</div>
          ${tired ? `<div class="ac-tired">⚠️ 集中力が足りん。手元が狂うぞ（腕前−15%）</div>` : ""}
          <div class="tool-row">${TOOLS.map(t =>
            `<button class="tool-chip${state.tool === t.id ? " selected" : ""}" data-tool="${t.id}">
               ${t.icon} ${t.name}<span class="t-note">${t.note}</span></button>`).join("")}</div>
          <button class="act-go" id="btn-action">🖐 腕を見せる</button>
          <div class="act-skip" id="btn-skip-action">ふつうに作る（腕前は並・時間が2時間よけいにかかる）</div>
        </div>
        <div class="rest-link" id="btn-rest">🌙 今日はここまでにする（残り${state.hoursLeft}時間を捨てて集中力を戻す）</div>`;
      document.querySelectorAll(".tool-chip[data-tool]").forEach(b =>
        b.addEventListener("click", () => { state.tool = b.dataset.tool; save(); render(); }));
      $("#btn-action").addEventListener("click", () => runAction(step));
      $("#btn-skip-action").addEventListener("click", () => doAction(50, true));   // ふつうの出来どまり
      $("#btn-rest").addEventListener("click", restForToday);
      const toBottomA = () => { if (state.currentId) window.scrollTo(0, document.documentElement.scrollHeight); };
      requestAnimationFrame(toBottomA);
      setTimeout(toBottomA, 450);
      return;
    }

    /* 工程の性質に応じて、選べる手が変わる */
    const isCrit = critKnown && atCrit;
    $("#steps-area").innerHTML = chips + flawNoteOf() +
      `<div class="choice-title">${step.icon} 「${step.label}」${isCrit ? "<b class=\"crit-tag\">🔥ここが山場</b>" : ""}<br><span class="ct-type">${stepType(step).name}の工程</span></div>
       <div class="choices">` +
      choicesForStep(step).map(ch => {
        const short = state.focus < ch.focus;   // 集中力が足りない手は選べない
        return `<button class="choice-btn ${ch.cls}" data-choice="${ch.id}" ${short ? "disabled" : ""}>
          <span class="c-icon">${ch.icon}</span>
          <span class="c-label">${ch.label}</span>
          <span class="c-note">${short ? "集中力がたりない" : `⏱${effHours(ch)}h ／ 🕯${ch.focus}`}</span>
        </button>`;
      }).join("") +
      `</div>
       <div class="rest-link" id="btn-rest">🌙 今日はここまでにする（残り${state.hoursLeft}時間を捨てて集中力を戻す）</div>`;
    document.querySelectorAll(".choice-btn:not([disabled])").forEach(b =>
      b.addEventListener("click", () => doStep(b.dataset.choice)));
    $("#btn-rest").addEventListener("click", restForToday);
  }

  const toBottom = () => { if (state.currentId) window.scrollTo(0, document.documentElement.scrollHeight); };
  requestAnimationFrame(toBottom);
  setTimeout(toBottom, 450);
}

function render() {
  renderStatus();
  if (state.currentId) renderCraft();
  else if (prep) renderPrep();
  else renderSelect();
}

/* ==========================================================
   ゲーム進行
   ========================================================== */
function doStep(choiceId) {
  const f = furnitureById(state.currentId);
  const step = f.steps[state.stepIndex];
  const list = choicesForStep(step);
  const choice = list.find(ch => ch.id === choiceId) || list[1];
  const hours = effHours(choice);
  const isCrit = state.stepIndex === CRITICAL_STEP[f.id];

  document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
  showMessage(`${step.icon} ${step.label}中… ${choice.working}`);

  setTimeout(() => {
    let delta = choice.q();
    let note = "";

    /* しくじり判定。急いだ手ほど出やすい */
    if (choice.flaw && Math.random() < choice.flaw) {
      delta -= 8;
      state.flaws++;
      note = "　……ありゃ、手がすべった。";
    }
    /* 検品でしくじりを1つ取り返す（リカバリー） */
    if (choice.repair && state.flaws > 0) {
      state.flaws--;
      delta += 10;
      note = "　傷を見つけて、そっと直した。";
    }
    /* 歩留まり優先：端材から材料が戻ることがある */
    if (choice.saveMaterial && Math.random() < choice.saveMaterial && state.craft) {
      const w = state.craft.wood;
      state.materials[w] = (state.materials[w] || 0) + 1;
      note += `　端材から${materialById(w).name}が1本とれた！`;
    }
    /* 工程数のちがう家具でも判断の効き目がそろうよう、枠に収める */
    delta = Math.round(delta * stepScale(f));

    state.quality = Math.max(0, Math.min(100, state.quality + delta));
    state.stepIndex++;
    state.focus = Math.max(0, state.focus - choice.focus);

    /* 時間経過。日が変わると集中力が戻り、来館者が来る */
    state.craftUsed += hours;
    state.hoursLeft -= hours;
    let extra = "";
    while (state.hoursLeft <= 0) {
      state.hoursLeft += hoursPerDay();
      state.day++;
      state.focus = focusPerDay();
      extra += dailyVisitors();
    }
    save();

    const sign = delta >= 0 ? `+${delta}` : `${delta}`;
    let msg = `${step.icon} ${step.msg}${note}　${pick(choice.henry)}`
      + `（品質${sign}${isCrit ? "・🔥山場" : ""}・${hours}時間・🕯${choice.focus}）${extra}`;
    msg += announceBP();
    showMessage(msg);
    maybeShowTrivia();

    render();
    if (state.stepIndex >= f.steps.length) {
      confetti();
      const pc = currentPiece();
      showMessage(`🎉 「${pc.name}」完成じゃ！ 品質${pc.score}点、${RANKS[pc.rank].label}`
        + `${pc.onTime ? "　期日内じゃ！" : ""}${pc.secret ? "　…おや、これはただの家具ではないぞ…！" : ""}`
        + `　納品するか、展示するか選ぶのじゃ。`);
    }
  }, choice.time);
}

/* ==========================================================
   職人アクションを走らせる
   ========================================================== */
let actRunning = null;   // 実行中のアクション（後片付け用）

function runAction(step) {
  const act = actionFor(step);
  if (!act) return;
  const svg = $("#act-svg");

  $("#act-title").textContent = `🔥 ${act.name}　${"★".repeat(actLevel(furnitureById(state.currentId)))}`;
  $("#act-tip").innerHTML = act.tip;
  $("#act-say").textContent = "";
  $("#act-bar").style.width = "0%";
  $("#act-result").hidden = true;
  $("#act-tip").hidden = false;
  svg.style.display = "";
  $(".act-bar-wrap").style.display = "";
  openModal("action-modal");

  let ended = false, tick = null, down = false;
  const ui = {
    progress: (r) => { $("#act-bar").style.width = Math.min(100, r * 100) + "%"; },
    say: (t) => { $("#act-say").textContent = t; },
    setTip: (html) => { $("#act-tip").innerHTML = html; }
  };

  const cleanup = () => {
    if (ui.onStop) ui.onStop();          // 動き続けるアクションを止める
    if (tick) clearInterval(tick);
    svg.onpointerdown = svg.onpointermove = svg.onpointerup = svg.onpointercancel = null;
    actRunning = null;
  };
  const finish = (score, comment) => {
    if (ended) return;
    ended = true;
    cleanup();
    showActionResult(Math.round(score), comment);
  };
  actRunning = cleanup;

  /* 指（マウス）を SVG の座標に直して、アクションに渡す */
  svg.onpointerdown = (e) => {
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 一部の環境では不要 */ }
    down = true;
    const pt = actPoint(svg, e);
    if (ui.onDown) ui.onDown(pt);
    if (ui.onPoint) ui.onPoint(pt);
  };
  svg.onpointermove = (e) => {
    if (!down) return;
    e.preventDefault();
    if (ui.onPoint) ui.onPoint(actPoint(svg, e));
  };
  svg.onpointerup = svg.onpointercancel = (e) => {
    if (!down) return;
    down = false;
    if (ui.onUp) ui.onUp(actPoint(svg, e));
  };

  act.start(svg, ui, finish, actLevel(furnitureById(state.currentId)));

  /* 制限時間のあるアクションだけ、残り時間を出す */
  if (act.limit) {
    const end = Date.now() + act.limit;
    tick = setInterval(() => {
      const left = end - Date.now();
      if (left <= 0) {
        clearInterval(tick); tick = null;
        if (ui.onTimeout) ui.onTimeout(); else finish(0, "時間切れじゃ。");
      } else {
        ui.say(`のこり ${(left / 1000).toFixed(1)} 秒`);
      }
    }, 100);
  }
}

/* アクションの結果を見せてから、工程を進める */
function showActionResult(score, comment) {
  const f = furnitureById(state.currentId);
  const best = state.actionBest[f.id] || 0;
  const isBest = score > best;
  const grade = score >= 90 ? "職人級じゃ！" : score >= 70 ? "よい仕事じゃ。"
    : score >= 45 ? "まずまずといったところか。" : "うむ……次じゃ、次。";

  $("#act-tip").hidden = true;
  $("#act-svg").style.display = "none";
  $(".act-bar-wrap").style.display = "none";
  $("#act-say").textContent = "";
  const r = $("#act-result");
  r.hidden = false;
  /* この出来が家具にどう効くのかを、その場で見せる */
  const base = Math.round(state.quality);
  const mult = skillMult(score);
  const proj = Math.max(0, Math.min(100, Math.round(base * mult)));
  const restSteps = f.steps.length - 1 - state.stepIndex;

  r.innerHTML =
    `<div class="act-score">${score}<span class="unit">点</span></div>
     <div class="act-effect">
       土台 ${base}点 × <b>×${mult.toFixed(2)}</b> → <b>${proj}点</b> ${rankBadge(calcRank(proj))}
       ${restSteps > 0 ? `<div class="ae-note">このあと ${restSteps} 工程ぶん、土台はまだ伸びる</div>` : ""}
     </div>
     ${isBest ? `<div class="act-best">✨ 自己ベスト更新！（これまで ${best}点）</div>`
               : `<div class="act-best" style="color:var(--brown-soft)">自己ベスト ${best}点</div>`}
     <div class="act-henry">${grade}${comment ? " " + comment : ""}</div>
     <button class="act-go" id="act-next">この出来で進める</button>`;
  $("#act-next").addEventListener("click", () => {
    closeModal("action-modal");
    doAction(score, false);
  });
}

/* アクションの点を品質に変える。山場なので振れ幅が大きい */
function doAction(rawScore, skipped) {
  const f = furnitureById(state.currentId);
  const step = f.steps[state.stepIndex];
  const type = STEP_TYPE_OF[step.label];

  /* 集中力が切れていると、手元が狂う */
  const tired = state.focus < 30;
  const tool = toolById(state.tool);
  let n = tired ? rawScore * 0.85 : rawScore;
  if (!skipped) n *= tool.mult;                          // えらんだ道具のぶん
  const score = Math.max(0, Math.min(100, Math.round(n)));

  /* 山場の出来は、品質に足すのではなく、最後に土台へ掛ける */
  state.actionScore = score;
  if (score < 40 && !(tool.safe && !skipped)) state.flaws++;   // 古い道具なら、しくじらない

  state.stepIndex++;
  state.focus = Math.max(0, state.focus - 30 - (skipped ? 0 : tool.focus));

  /* 記録：家具ごとの自己ベストと、工程タイプごとの成績 */
  if (!skipped) {
    if (score > (state.actionBest[f.id] || 0)) state.actionBest[f.id] = score;
    const st = state.actionStats[type] || { n: 0, sum: 0 };
    st.n++; st.sum += score;
    state.actionStats[type] = st;
  }

  /* 時間経過。アクションをとばすと、手堅いぶん時間が余計にかかる */
  const hours = Math.max(1, (skipped ? 5 : 3) - speedBonus());
  state.craftUsed += hours;
  state.hoursLeft -= hours;
  let extra = "";
  while (state.hoursLeft <= 0) {
    state.hoursLeft += hoursPerDay();
    state.day++;
    state.focus = focusPerDay();
    extra += dailyVisitors();
  }
  save();

  const mult = skillMult(score).toFixed(2);
  let msg = skipped
    ? `${step.icon} ${step.msg}　手数をかけて、手堅く仕上げた。（腕前 ×${mult}・${hours}時間）${extra}`
    : `${step.icon} ${step.msg}　${step.label}は ${score}点。（腕前 ×${mult}・🔥山場・${hours}時間）${extra}`;
  if (tired && !skipped) msg += "　……手が疲れておったな。";
  msg += announceBP();
  showMessage(msg);
  maybeShowTrivia();

  render();
  if (state.stepIndex >= f.steps.length) {
    confetti();
    const pc = currentPiece();
    showMessage(`🎉 「${pc.name}」完成じゃ！ 品質${pc.score}点、${RANKS[pc.rank].label}`
      + `${pc.onTime ? "　期日内じゃ！" : ""}${pc.secret ? "　…おや、これはただの家具ではないぞ…！" : ""}`);
  }
}

/* 今日はここまで。残り時間を捨てて翌日へ（集中力が全回復する）
   集中力が尽きたときの逃げ道であり、納期を削る代償でもある */
function restForToday() {
  state.craftUsed += state.hoursLeft;   // 残り時間は納期から差し引かれる
  state.hoursLeft = hoursPerDay();
  state.day++;
  state.focus = focusPerDay();
  const extra = dailyVisitors();
  save();
  showMessage(`🌙 道具を片づけて、今日はここまで。${extra}　よく休んだ。手が戻っておる。`);
  render();
}

/* 日付が変わったときの来館者と売店収入 */
function dailyVisitors() {
  const pieces = state.showroom;
  const popSum = pieces.reduce((s, p) => s + p.pop, 0);
  const bonusMult = SET_BONUSES.reduce((m, b) => m * (b.check(pieces) ? b.mult : 1), 1);
  const visitors = Math.max(1, Math.round((3 + popSum * 0.8) * gearVisitorMult()));
  state.totalVisitors += visitors;
  let text = `　🌙 ${state.day}日目の朝じゃ。`;
  if (popSum > 0) {
    const income = Math.round(visitors * 12 * bonusMult * gearShopMult() / 10) * 10;
    state.money += income;
    text += `昨日の来館者${visitors}人・売店収入+${income.toLocaleString()}円！`;
  } else {
    text += `来館者${visitors}人（展示があればもっと来るんじゃがのう）。`;
  }

  /* 来館者がひとり、展示を見ていく。3割の確率で昔の仕事の話をしていく */
  const v = pick(VISITORS);
  let line;
  if (!pieces.length) {
    line = v.miss;
  } else if (Math.random() < 0.3) {
    line = v.hint;
  } else {
    line = pieces.some(pc => v.likes(pc)) ? v.hit : v.miss;
  }
  state.lastVisitor = `${v.icon} ${v.name}　${line}`;
  return text + `　${state.lastVisitor}`;
}

/* 隠しレシピに「あと一歩」（3つのうち2つ一致）なら、そのレシピを返す。
   完全一致でも2つ一致でもない組み合わせでは、何も起きない */
function nearMissRecipe(baseId, c) {
  if (!c) return null;
  return RECIPES.find(r => {
    if (r.baseId !== baseId) return false;
    let hit = 0;
    if (r.combo.design === c.design) hit++;
    if (r.combo.wood === c.wood) hit++;
    if (r.combo.finish === c.finish) hit++;
    return hit === 2;
  }) || null;
}

/* 会心の一台：Aランク以上を、納期内に仕上げたもの。章を開く鍵になる */
const isAce = (p) => p.onTime && (p.rank === "S" || p.rank === "A");

/* 完成品を 納品(即売) または 展示 する。図鑑登録は両方共通 */
function finishCraft(exhibit) {
  const p = currentPiece();
  const f = furnitureById(state.currentId);
  const rec = state.completed[p.fid];
  const firstTime = !rec;

  /* --- 図鑑登録（回数・最高品質・最高人気） --- */
  if (rec) {
    rec.count++;
    if (rec.best === null || RANK_ORDER.indexOf(p.rank) > RANK_ORDER.indexOf(rec.best)) rec.best = p.rank;
    if (rec.bestScore == null || p.score > rec.bestScore) rec.bestScore = p.score;
    if (rec.bestPop == null || p.pop > rec.bestPop) rec.bestPop = p.pop;
    if (isAce(p)) rec.ace = true;
  } else {
    state.completed[p.fid] =
      { count: 1, best: p.rank, bestScore: p.score, bestPop: p.pop, ace: isAce(p) };
  }

  /* --- 職人手帳：試した組み合わせは必ず記録する（謎解きの material） --- */
  const near = nearMissRecipe(f.id, state.craft);
  const c = state.craft || {};
  state.notebook.unshift({
    day: state.day, fid: p.fid, name: p.name, base: f.name,
    design: c.design, wood: c.wood, finish: c.finish,
    score: p.score, rank: p.rank, pop: p.pop, price: p.price,
    secret: p.secret, near: !!near && !p.secret
  });
  if (state.notebook.length > 40) state.notebook.length = 40;

  /* --- 一度作れば、その家具の山場工程を覚える --- */
  const knewCritical = state.knownCritical.indexOf(f.id) >= 0;
  if (!knewCritical) state.knownCritical.push(f.id);

  state.exp += f.exp;
  const newLevel = calcLevel(state.exp);
  const leveledUp = newLevel > state.level;
  state.level = newLevel;

  /* --- 納品 or 展示 --- */
  let msg;
  if (exhibit) {
    state.showroom.push(p);
    msg = `🖼 「${p.name}」をショールームに展示した！ 人気${p.pop}。あすから来館者が見にくるぞ。`;
  } else {
    state.money += p.price;
    const sns = pick(SNS_BY_RANK[p.rank]);
    msg = `🚚 品質${p.rank}（${p.score}点）・${p.onTime ? "期日内✨" : "納期おくれ…"}で納品！ ＋${p.price.toLocaleString()}円　${HENRY_DELIVER[p.rank]}　${sns}`;
  }

  /* はじめて作った家具は、山場がどこだったかを教えてくれる */
  if (!knewCritical) {
    msg += `　🔥 ${you()}、この家具は「${f.steps[CRITICAL_STEP[f.id]].label}」が山場じゃったな。覚えておくのじゃぞ。`;
  }
  /* あと一歩で隠しレシピ、というときだけ手応えを口にする */
  if (near && !p.secret) {
    msg += `　……ふむ。なにか惜しい気がするのう。あと一つ、何かが違う。`;
  }
  if (leveledUp) {
    msg += `　🏠 ${you()}、腕を上げたのう。工房レベルが ${state.level} じゃ！`;
    confetti();
  }

  /* 制作終了 */
  state.currentId = null;
  state.craft = null;
  state.stepIndex = 0;
  state.quality = 0;
  state.craftUsed = 0;
  hideTrivia();

  msg += announceBP();
  showMessage(msg);

  /* --- 初完成：図鑑に物語（＋童話）が登録される --- */
  if (firstTime) {
    state.stories.push(p.fid);
    if (p.secret) {
      const r = RECIPES.find(x => x.id === p.fid);
      openStoryPop(`🎊 隠しレシピ発見！「${p.name}」`, `${r.description}\n\n${r.story}`, "🎊✨");
    } else if (f.letter && p.fid === f.id) {
      openStoryPop(`「${f.name}」を図鑑に登録！`, `${f.story}\n\n📖 ${f.letter}`);
    } else {
      openStoryPop(`「${p.name}」を図鑑に登録！`, f.story);
    }
  }
  /* 童話がすべてそろったら最終章 */
  if (!state.stories.includes("final") &&
      FURNITURE.filter(x => x.letter).every(x => state.stories.includes(x.id))) {
    state.stories.push("final");
    setTimeout(() => openStoryPop(FINAL_STORY.title, FINAL_STORY.text), firstTime ? 600 : 0);
  }

  save();
  render();
}

/* ==========================================================
   モーダル
   ========================================================== */
function openModal(id) { $("#" + id).classList.add("open"); }
function closeModal(id) { $("#" + id).classList.remove("open"); }
function openStoryPop(title, text, badge) {
  $("#pop-badge").textContent = badge || "📜✨";
  $("#pop-title").textContent = title;
  /* 童話に仕込まれた技術のヒントを太字で見せたいので innerHTML を使う。
     入るのは自前のゲームデータだけで、プレイヤーの入力は混ざらない */
  $("#pop-text").innerHTML = text.replace(/\n/g, "<br>");
  openModal("story-pop");
}

/* ---------- 図鑑（主役）：画像・説明・記録・物語・童話・達成率 ---------- */
function renderDex() {
  const found = dexFound(), total = dexTotal();
  $("#dex-complete").innerHTML = `<div class="dex-complete">
    <div class="big">📖 ${found} / ${total}</div>
    <div class="small">コンプリート率 ${Math.round(found / total * 100)}%　全部あつめて図鑑を完成させよう！</div>
  </div>`;

  $("#dex-list").innerHTML = allDexEntries().map(e => {
    const rec = state.completed[e.id];
    if (rec && rec.count > 0) {
      const story = state.stories.includes(e.id) && e.story
        ? `<div class="d-story">📜 ${e.story}</div>` : "";
      return `<div class="dex-item${e.kind === "secret" ? " secret" : ""}">
        <div class="d-head">
          ${artOf(e, "thumb", e.artFilter)}
          <span><div class="name">${e.kind === "secret" ? "✨ " : ""}${e.name}</div>
          <div class="count">🔨 ${rec.count}台　最高品質 ${rec.best ? rankBadge(rec.best) : "—"}${rec.bestScore != null ? ` <b>${rec.bestScore}点</b>` : ""}　💖 人気 ${rec.bestPop != null ? rec.bestPop : "—"}</div></span>
        </div>
        <div class="d-desc">${e.description}</div>
        ${e.kind === "base" && state.knownCritical.indexOf(e.id) >= 0
          ? `<span class="dex-crit">🔥 山場は「${e.steps[CRITICAL_STEP[e.id]].label}」</span>` +
            (rec && rec.ace ? `<span class="dex-ace">🏅 会心の一台</span>`
              : `<span class="dex-ace off">Aランク以上＋納期内で「会心」</span>`)
            + (state.actionBest[e.id]
              ? `<span class="dex-crit" style="margin-left:5px">🖐 自己ベスト ${state.actionBest[e.id]}点</span>` : "")
          : ""}
        ${story}
      </div>`;
    }
    /* 未発見 */
    const hint = e.kind === "secret"
      ? `🔮 ${e.hint}`
      : (bpUnlocked(e) ? "設計図はある。作って図鑑に登録しよう！" : bpCondLabel(e));
    return `<div class="dex-item unknown${e.kind === "secret" ? " secret" : ""}">
      <div class="d-head">
        <span class="icon">${e.kind === "secret" ? "✨" : "❓"}</span>
        <span><div class="name">？？？</div>
        <div class="count">${hint}</div></span>
      </div>
    </div>`;
  }).join("");

  /* 職人手帳：試した組み合わせの記録。隠しレシピを推理するための材料 */
  $("#note-list").innerHTML = state.notebook.length
    ? state.notebook.map(n => {
        const d = designById(n.design), w = materialById(n.wood), fi = finishById(n.finish);
        const cls = n.secret ? " hit" : (n.near ? " near" : "");
        return `<div class="note-item${cls}">
          <div class="n-head">${n.secret ? "✨ " : ""}${n.name}　${rankBadge(n.rank)} ${n.score}点　💖${n.pop}
            ${n.near ? '<span class="note-near-tag">惜しい</span>' : ""}</div>
          <div class="n-combo">${d.icon}${d.name} ／ ${w ? w.icon + w.name : "—"} ／ ${fi.icon}${fi.name}
            　<span style="color:var(--brown-soft)">${n.day}日目・${n.price.toLocaleString()}円</span></div>
        </div>`;
      }).join("")
    : `<p class="note-empty">まだ何も試していない。<br>作った組み合わせは、ここに全部ひかえておく。<br>「惜しい」と出たら、あと一つだけ変えてみるのじゃ。</p>`;

  /* 童話のきれはし（家具が置かれる童話の一場面。隠しレシピのヒントでもある） */
  const withLetters = FURNITURE.filter(f => f.letter);
  const lf = lettersFound();
  let letters = `<p style="text-align:center;font-size:.72rem;color:var(--brown-mid);margin-bottom:10px;">
    あつめたページ　${lf} / ${withLetters.length}<br>
    <span style="font-size:.66rem">家具をはじめて完成させると、その家具が置かれる童話のページが1枚ふえる</span></p>`;
  letters += withLetters.map((f, i) => {
    if (state.stories.includes(f.id)) {
      return `<div class="letter-item"><h4>📖 ${i + 1}ページ目　—— ${esc(f.name)}の童話</h4>${f.letter}</div>`;
    }
    return `<div class="letter-item locked"><h4>🔒 ${i + 1}ページ目</h4>まだ見つかっていない。ある家具をはじめて完成させると、どこかから出てくるらしい……</div>`;
  }).join("");
  if (state.stories.includes("final")) {
    letters += `<div class="story-item final"><h4>📖 ${FINAL_STORY.title}</h4><p>${FINAL_STORY.text}</p></div>`;
  } else {
    letters += `<div class="story-item locked final"><h4>🔒 ${FINAL_STORY.title}</h4><p>ページをすべて集めると、まっさらな最後の一枚が出てくるらしい……。</p></div>`;
  }
  $("#letter-list").innerHTML = letters;
}

/* ---------- ショールーム（展示） ---------- */
function renderShow() {
  const pieces = state.showroom;
  const popSum = pieces.reduce((s, p) => s + p.pop, 0);
  const bonuses = SET_BONUSES.map(b =>
    `<span class="bonus-chip${b.check(pieces) ? "" : " off"}">${b.check(pieces) ? "✓ " : ""}${b.name}　${b.desc}</span>`).join(" ");
  const estVisitors = Math.max(1, Math.round((3 + popSum * 0.8) * gearVisitorMult()));
  const bonusMult = SET_BONUSES.reduce((m, b) => m * (b.check(pieces) ? b.mult : 1), 1);
  const estIncome = popSum > 0
    ? Math.round(estVisitors * 12 * bonusMult * gearShopMult() / 10) * 10 : 0;

  let html = state.lastVisitor ? `<div class="visitor-line">${state.lastVisitor}</div>` : "";
  html += `<div class="show-head">
    展示 <b>${pieces.length} / ${showSlots()}</b> 枠　合計人気 <b>${popSum}</b><br>
    あすの来館予想 👥${estVisitors}人・売店収入 💰${estIncome.toLocaleString()}円/日<br>${bonuses}
  </div>`;

  if (!pieces.length) {
    html += `<p style="text-align:center;font-size:.76rem;color:var(--brown-mid);line-height:1.9;">
      まだ何も展示されていない。<br>家具を完成させたとき「🖼 展示する」を選ぶと<br>ここに並んで、毎日収入を生むぞ。</p>`;
  } else {
    html += pieces.map((p, i) => {
      const base = furnitureById(p.baseId || p.fid) || {};
      const r = RECIPES.find(x => x.id === p.fid);
      return `<div class="show-item">
        ${artOf(r && r.photo ? { name: p.name, photo: r.photo, icon: base.icon } : base,
                "thumb", r && !r.photo ? r.filter : null)}
        <span class="s-body"><div class="s-name">${p.secret ? "✨ " : ""}${p.name}</div>
        <div class="s-info">${rankBadge(p.rank)} ${p.score}点　💖人気${p.pop}　${designById(p.design).name}・${materialById(p.wood) ? materialById(p.wood).name : ""}・${finishById(p.finish).name}</div></span>
        <button class="sell-btn" data-i="${i}">💰 ${p.price.toLocaleString()}円で売る</button>
      </div>`;
    }).join("");
  }
  $("#show-body").innerHTML = html;

  document.querySelectorAll(".sell-btn[data-i]").forEach(b =>
    b.addEventListener("click", () => {
      const i = +b.dataset.i;
      const p = state.showroom[i];
      if (!p) return;
      state.money += p.price;
      state.showroom.splice(i, 1);
      save();
      showMessage(`🚚 展示していた「${p.name}」が売れた！ ＋${p.price.toLocaleString()}円`);
      renderShow(); renderStatus();
    }));
}

/* ---------- 仕入れ（材料） ---------- */
function renderMarket() {
  $("#market-body").innerHTML =
    `<p style="text-align:center;font-size:.74rem;color:var(--brown-mid);margin-bottom:10px;">
      所持金 💰 ${state.money.toLocaleString()}円</p>` +
    MATERIALS.filter(chOpen).map(m => `<div class="mat-item">
      <span class="m-icon">${m.icon}</span>
      <span class="m-body"><div class="m-name">${m.name}</div>
      <div class="m-desc">${m.desc}</div></span>
      <span class="m-own">×${state.materials[m.id] || 0}</span>
      <button class="mat-buy" data-m="${m.id}" ${state.money < matPrice(m) ? "disabled" : ""}>
        ${matPrice(m).toLocaleString()}円${gearMatOff() > 0
          ? `<span style="display:block;font-size:.56rem;font-weight:normal;opacity:.8;text-decoration:line-through">${m.price.toLocaleString()}円</span>` : ""}</button>
    </div>`).join("");

  document.querySelectorAll(".mat-buy[data-m]").forEach(b =>
    b.addEventListener("click", () => {
      const m = materialById(b.dataset.m);
      if (!m || state.money < matPrice(m)) return;
      state.money -= matPrice(m);
      state.materials[m.id] = (state.materials[m.id] || 0) + 1;
      save();
      renderMarket(); renderStatus();
      if (prep || !state.currentId) render();   /* 設計図一覧の在庫表示も更新 */
    }));
}

/* ---------- 設備 ---------- */
function renderGear() {
  const own = GEAR.filter(g => hasGear(g.id));
  const effects = [];
  if (gearQualityBonus()) effects.push(`品質+${gearQualityBonus()}`);
  if (gearPriceMult() > 1)   effects.push(`納品価格×${gearPriceMult().toFixed(2)}`);
  if (gearVisitorMult() > 1) effects.push(`来館者×${gearVisitorMult().toFixed(2)}`);
  if (gearShopMult() > 1)    effects.push(`売店収入×${gearShopMult().toFixed(2)}`);
  if (speedBonus())          effects.push(`工程-${speedBonus()}h`);
  if (hoursPerDay() > HOURS_PER_DAY) effects.push(`1日${hoursPerDay()}時間`);
  if (focusPerDay() > FOCUS_PER_DAY) effects.push(`集中力${focusPerDay()}`);
  if (gearMatOff() > 0)      effects.push(`仕入れ-${Math.round(gearMatOff() * 100)}%`);
  effects.push(`展示枠${showSlots()}`);

  let html = `<div class="show-head">
      所持金 <b>💰 ${state.money.toLocaleString()}円</b>　導入 <b>${own.length} / ${GEAR.length}</b><br>
      いまの効果：${effects.join("・")}
    </div>`;

  GEAR_CATS.forEach(c => {
    const list = GEAR.filter(g => g.cat === c.id);
    if (!list.length) return;
    html += `<div class="dex-section-title">${c.name}</div>`;
    html += list.map(g => {
      const owned = hasGear(g.id);
      const open = gearUnlocked(g);
      if (!open && !owned) {
        return `<div class="gear-item locked">
          <span class="g-icon">🔒</span>
          <span class="g-body"><div class="g-name">？？？</div>
          <div class="g-desc">${gearCondLabel(g)}</div></span>
        </div>`;
      }
      const btn = owned
        ? `<span class="gear-owned">✓ 導入済み</span>`
        : `<button class="gear-buy" data-gear="${g.id}" ${state.money < g.price ? "disabled" : ""}>
            💰${g.price.toLocaleString()}円</button>`;
      return `<div class="gear-item${owned ? " owned" : ""}">
        <span class="g-icon">${g.icon}</span>
        <span class="g-body"><div class="g-name">${g.name}</div>
        <div class="g-desc">${g.desc}</div></span>
        ${btn}
      </div>`;
    }).join("");
  });
  $("#gear-list").innerHTML = html;

  document.querySelectorAll(".gear-buy[data-gear]").forEach(b =>
    b.addEventListener("click", () => {
      const g = GEAR.find(x => x.id === b.dataset.gear);
      if (!g || hasGear(g.id) || state.money < g.price) return;
      state.money -= g.price;
      state.gear.push(g.id);
      save();
      confetti();
      showMessage(`🛠 「${g.name}」を工房に迎えた！ ${g.desc}　工房がまた一歩、大きくなったのう。`);
      renderGear(); renderStatus();
    }));
}

/* 得意・不得意：山場のアクションでどれだけの腕を見せたかの平均。
   数値を上げても強くはならない。自分がどんな職人かを映すだけの鏡 */
function skillBlock() {
  const rows = Object.keys(CRAFT_ACTIONS).map(k => {
    const st = state.actionStats[k];
    const avg = st && st.n ? st.sum / st.n : null;
    const stars = avg === null ? 0 : Math.max(1, Math.round(avg / 20));
    return `<div class="skill-row">
      <span class="s-name">${CRAFT_ACTIONS[k].name}</span>
      <span class="s-stars">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</span>
      <span class="s-num">${avg === null ? "まだ" : `平均${Math.round(avg)}点・${st.n}回`}</span>
    </div>`;
  }).join("");
  return `<div class="about-block">
    <h4>🖐 腕まえ</h4>
    <p style="margin-bottom:6px">山場の工程で見せた腕の平均。得意も不得意も、あなたという職人の顔です。</p>
    ${rows}
  </div>`;
}

  $("#av-name").value = state.player.name || "";
  $("#avatar-title").textContent = first ? "🧑‍🔧 あなたの職人をつくる" : "🧑‍🔧 職人を変える";
  $("#av-done").textContent = first ? "この職人ではじめる" : "決定する";
  renderAvatarEditor();
  openModal("avatar-modal");
}

function renderAvatarEditor() {
  $("#av-preview").innerHTML = buildAvatar(avDraft);
  $("#av-rows").innerHTML = AVATAR_ROWS.map(row => {
    const opts = row.list.map((it, i) => {
      const sel = avDraft[row.key] === i ? " selected" : "";
      if (row.color) {
        return `<button class="av-swatch${sel}" style="background:${it}"
          data-k="${row.key}" data-i="${i}" aria-label="${row.title} ${i + 1}"></button>`;
      }
      /* 選択肢ごとの見本：その部分だけ差し替えた顔を小さく描く */
      const mini = Object.assign({}, avDraft);
      mini[row.key] = i;
      return `<button class="av-chip${sel}" data-k="${row.key}" data-i="${i}"
        title="${it.name}" aria-label="${it.name}">${buildAvatar(mini)}</button>`;
    }).join("");
    return `<div class="av-row"><div class="g-title">${row.title}</div>
      <div class="av-opts">${opts}</div></div>`;
  }).join("");

  document.querySelectorAll("#av-rows [data-k]").forEach(b =>
    b.addEventListener("click", () => {
      avDraft[b.dataset.k] = +b.dataset.i;
      renderAvatarEditor();
    }));
}

function saveAvatar() {
  const nm = $("#av-name").value.trim().slice(0, 12);
  state.player.name = nm || "見習い";
  state.player.avatar = avDraft;
  save();
  closeModal("avatar-modal");
  renderStatus();
  showMessage(avFirst
    ? `ようこそ、${you()}。わしはヘンリー、この工房に住みついておる案内役じゃ。まずは設計図をえらんで、一台こしらえてみるのじゃ。`
    : `ほう、${you()}。ずいぶん職人らしい顔になったのう。`);
}

/* ---------- 工房紹介 ---------- */
function renderAbout() {
  const title = LEVEL_TITLES[Math.min(state.level - 1, LEVEL_TITLES.length - 1)];
  $("#about-body").innerHTML =
    `<div class="about-hero">
      <span class="art"><img src="${PHOTOS.bk_henry}" alt="ヘンリーさん"></span>
      <div class="catch">「小さな家具にも、大きな物語を。」</div>
    </div>
    <div class="about-block" style="text-align:center">
      <div class="av-preview" style="width:84px;height:84px;border-width:2px;">${buildAvatar(state.player.avatar)}</div>
      <h4 style="margin-top:6px">${esc(you())}　<span style="font-weight:normal;color:var(--brown-mid)">${title}</span></h4>
      <p style="text-align:center">この工房で家具をこしらえている職人。</p>
      <button class="foot-btn" id="btn-edit-avatar" style="max-width:200px;margin:8px auto 0;display:block;min-height:44px">🧑‍🔧 職人を変える</button>
    </div>` +
    skillBlock() +
    ABOUT_BLOCKS.map(b =>
      `<div class="about-block"><h4>${b.icon} ${b.title}</h4><p>${b.text}</p></div>`).join("");
  $("#knowledge-list").innerHTML = KNOWLEDGE.map(k =>
    `<div class="knowledge"><h4>${k.icon} ${k.title}</h4><p>${k.text}</p></div>`).join("");
}

/* ==========================================================
   初期化
   ========================================================== */
function init() {
  load();
  state.level = calcLevel(state.exp);
  /* 初回は現在解放済みの設計図を「告知済み」にしておく（起動時に騒がない） */
  if (!state.seenBP.length) state.seenBP = FURNITURE.filter(bpUnlocked).map(f => f.id);

  $("#henry-avatar").innerHTML = `<img src="${PHOTOS.bk_henry}" alt="ヘンリーさん">`;

  $("#btn-dex").addEventListener("click", () => { renderDex(); openModal("dex-modal"); });
  $("#btn-show").addEventListener("click", () => { renderShow(); openModal("show-modal"); });
  $("#btn-market").addEventListener("click", () => { renderMarket(); openModal("market-modal"); });
  $("#btn-gear").addEventListener("click", () => { renderGear(); openModal("gear-modal"); });
  $("#btn-about").addEventListener("click", () => {
    renderAbout(); openModal("about-modal");
    $("#btn-edit-avatar").addEventListener("click", () => {
      closeModal("about-modal"); openAvatarEditor(false);
    });
  });
  $("#act-cancel").addEventListener("click", () => { if (actRunning) actRunning(); });
  /* ヘッダーの顔をタップしても職人を変えられる */
  $("#player-face").addEventListener("click", () => openAvatarEditor(false));
  $("#av-done").addEventListener("click", saveAvatar);

  document.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => closeModal(b.dataset.close)));
  document.querySelectorAll(".modal-back").forEach(m =>
    m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("open"); }));

  $("#btn-reset").addEventListener("click", () => {
    if (confirm("セーブデータを消して、はじめからやり直しますか？")) {
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }
  });

  render();
  if (!state.player.name) {
    /* はじめての起動：まず自分の職人をこしらえてもらう */
    showMessage("ようこそ、松永工房へ。……そうじゃ、まだあんたのことを聞いておらんかった。");
    openAvatarEditor(true);
  } else if (state.currentId) {
    showMessage(`おかえり、${you()}。「${furnitureById(state.currentId).name}」の続きを作ろうかの。`);
  } else if (state.exp > 0) {
    showMessage(`おかえり、${you()}。図鑑は ${dexFound()}/${dexTotal()}。今日はどれを作って、どう並べるかの？`);
  } else {
    showMessage("ようこそ、松永工房へ。わしはヘンリー、案内役じゃ。まずは設計図をえらんで一台作り、図鑑に登録してみるのじゃ。ゆくゆくは展示室に家具を並べて、たくさんのお客を呼ぶんじゃぞ。");
  }
}

init();
</script>
</body>
</html>
