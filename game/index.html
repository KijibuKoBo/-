<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>松永工房クラフトストーリー 〜小さな家具と、いろいろな童話〜</title>
<style>
/* ==========================================================
   松永工房クラフトストーリー 第5章
   『家具コレクション × 工房発展 × 物語』
   - ゲームの主役は家具図鑑（コンプリートが最終目的）
   - 設計図 → 材料仕入れ → 制作(設計/素材/仕上げ) → 図鑑登録
     → 展示 → 来館者 → 収益 → 新設計図…のループ
   - 隠しレシピ発見／展示セットボーナス／工房発展
   絵本風 × 木の温かみ × ちょっと高級感
   ========================================================== */
:root{
  --cream:      #faf3e3;   /* 背景クリーム */
  --cream-deep: #f3e7cd;
  --brown:      #6b4a2f;   /* 濃いブラウン（文字） */
  --brown-mid:  #8a6446;
  --brown-soft: #b08a63;
  --wood-light: #e8cfa5;   /* 木目・明 */
  --wood-dark:  #caa06d;   /* 木目・暗 */
  --green:      #9dbb8f;   /* 淡いグリーン */
  --green-deep: #7a9c6e;
  --gold:       #c9a24b;   /* 高級感アクセント */
  --red:        #b8563e;   /* 納期超過などの注意色 */
  --paper:      #fffdf5;   /* カード紙色 */
  --shadow:     0 4px 12px rgba(107,74,47,.18);
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
img,svg{ max-width:100%; }

/* 高さは固定しない。固定すると、はみ出した分までスクロールが届かなくなる */
html{
  height:auto;
  /* iOS Safari は、これが無いと勝手に文字だけを大きくしてしまう。
     写真はそのままで文字だけ膨らむので、画面からはみ出す */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI","Meiryo",sans-serif;
  color:var(--brown);
  background:
    repeating-linear-gradient(0deg,
      rgba(176,138,99,.05) 0px,  rgba(176,138,99,.05) 2px,
      transparent 2px,           transparent 26px),
    radial-gradient(circle at 50% -10%, #fff8e8 0%, var(--cream) 60%, var(--cream-deep) 100%);
  max-width:480px;
  margin:0 auto;
  min-height:100dvh;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  /* ボタンを続けて押したときに、ダブルタップで拡大してしまうのを止める */
  touch-action:manipulation;
  overflow-x:hidden;
  display:flex; flex-direction:column;
  user-select:none;
}

/* ---------- ヘッダー ---------- */
header{
  padding:8px 12px 7px; text-align:center;
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.08) 0 3px, transparent 3px 34px),
    linear-gradient(180deg, var(--wood-light), var(--wood-dark));
  border-bottom:4px solid var(--brown-mid);
  border-radius:0 0 18px 18px;
  box-shadow:var(--shadow);
}
header h1{
  font-size:.94rem; letter-spacing:.04em; color:var(--brown);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
header h1 .sub{
  display:block; font-size:.6rem; font-weight:normal;
  color:#7d5a3c; margin-top:1px; letter-spacing:.02em;
}
.status{ display:flex; justify-content:center; gap:4px; margin-top:6px; flex-wrap:wrap; }
.status .chip{
  background:var(--paper); border:1.5px solid var(--brown-soft);
  border-radius:999px; padding:2px 7px;
  font-size:.64rem; font-weight:bold; box-shadow:0 1px 2px rgba(107,74,47,.15);
  white-space:nowrap;
}
.lvbar{
  margin:5px auto 0; width:78%; height:6px; border-radius:999px;
  background:rgba(255,253,245,.7); border:1.5px solid var(--brown-soft); overflow:hidden;
}
.lvbar>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--green),var(--green-deep));
  transition:width .5s ease; border-radius:999px;
}
.lvbar-label{ font-size:.58rem; color:#7d5a3c; margin-top:1px; }

/* ---------- メイン ---------- */
main{ flex:1; padding:10px 14px 8px; display:flex; flex-direction:column; gap:10px; }

/* ----- ヘンリーさん（案内役・常時表示） ----- */
#henry-area{ display:flex; align-items:flex-start; gap:10px; }
#henry-avatar{
  flex:0 0 52px; width:52px; height:52px;
  background:var(--paper); border:2.5px solid var(--brown-soft); border-radius:50%;
  box-shadow:0 2px 5px rgba(107,74,47,.2); overflow:hidden;
  animation:henrySway 4s ease-in-out infinite;
}
#henry-avatar svg{ width:100%; height:100%; display:block; }
#henry-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
@keyframes henrySway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
#message{
  flex:1; min-height:3.2em; position:relative;
  background:var(--paper); border:2px solid var(--brown-soft);
  border-radius:14px; padding:8px 12px;
  font-size:.8rem; line-height:1.6;
  transition:opacity .3s;
}
#message::before{
  content:""; position:absolute; left:-9px; top:20px;
  border:8px solid transparent; border-right-color:var(--brown-soft);
}
#message::after{
  content:""; position:absolute; left:-6px; top:22px;
  border:6px solid transparent; border-right-color:var(--paper);
}
.henry-name{ display:block; font-size:.6rem; color:var(--brown-soft); font-weight:bold; margin-bottom:1px; }

/* 工房まめ知識 */
.trivia{
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px dashed var(--gold); border-radius:12px;
  padding:8px 12px; font-size:.72rem; line-height:1.8;
  color:var(--brown-mid); text-align:justify;
}
.trivia b{ color:var(--brown); }
.trivia.pop{ animation:triviaIn .4s ease; }
@keyframes triviaIn{ from{ transform:translateY(-6px); opacity:0; } to{ transform:none; opacity:1; } }

/* ----- 家具カード ----- */
.card.prep-card{ padding:12px 12px 12px; }
.card{
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.05) 0 2px, transparent 2px 40px),
    linear-gradient(160deg, #fff9ec, var(--paper));
  border:3px solid var(--wood-dark);
  border-radius:20px;
  box-shadow:var(--shadow), inset 0 0 0 4px rgba(232,207,165,.35);
  padding:14px 16px 14px;
  position:relative; overflow:hidden;
}
.card .art{ width:152px; height:152px; margin:0 auto; display:block;
  filter:drop-shadow(0 4px 4px rgba(107,74,47,.22)); }
.card .art svg{ width:100%; height:100%; display:block; }
/* 設計をえらぶ画面は、絵より選択肢を見せたいので絵を小さく */
.card.prep-card .art{ width:86px; height:86px; }
/* 実物の写真を入れたときも、枠に収める */
.card .art img{ width:100%; height:100%; object-fit:contain; display:block; }
.card h2{ text-align:center; font-size:1.06rem; margin-top:2px; letter-spacing:.04em; }
.card .desc{ font-size:.75rem; color:var(--brown-mid); text-align:center; margin-top:4px; line-height:1.6; }
.card .meta{ display:flex; justify-content:center; gap:6px; margin-top:8px; font-size:.7rem; flex-wrap:wrap; }
.card .meta span{
  background:var(--cream-deep); border-radius:999px; padding:2px 9px;
  border:1px solid var(--wood-dark);
}
.card .meta .late{ color:var(--red); border-color:var(--red); font-weight:bold; }

/* 進捗バー・品質ゲージ */
.progress{
  margin-top:10px; height:14px; border-radius:999px;
  background:var(--cream-deep); border:2px solid var(--brown-soft); overflow:hidden;
}
.progress>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--gold),#e0bf74);
  transition:width .35s ease; border-radius:999px;
}
.progress-label{ text-align:center; font-size:.72rem; margin-top:4px; color:var(--brown-mid); }
.quality-row{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:.72rem; }
.quality-bar{
  flex:1; height:10px; border-radius:999px;
  background:var(--cream-deep); border:1.5px solid var(--brown-soft); overflow:hidden;
}
.quality-bar>i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--green),var(--green-deep));
  transition:width .35s ease; border-radius:999px;
}
.rank-badge{
  display:inline-block; min-width:1.7em; text-align:center;
  font-weight:bold; font-size:.74rem; border-radius:999px; padding:1px 8px;
  border:1.5px solid currentColor;
}
.rank-S{ color:#a97c14; background:#fdf3d5; }
.rank-A{ color:var(--green-deep); background:#eef5e8; }
.rank-B{ color:var(--brown-mid); background:var(--cream-deep); }
.rank-C{ color:#9a8a78; background:#f2eee6; }

/* 完成アニメーション */
.card.done{
  animation:cardPop .6s ease, cardGlow 1.6s ease-in-out .3s 3;
  border-color:var(--gold);
}
@keyframes cardPop{
  0%{ transform:scale(1); } 35%{ transform:scale(1.06) rotate(-1.5deg); }
  70%{ transform:scale(.98) rotate(1deg); } 100%{ transform:scale(1); }
}
@keyframes cardGlow{
  0%,100%{ box-shadow:var(--shadow), 0 0 0 rgba(201,162,75,0); }
  50%{ box-shadow:var(--shadow), 0 0 28px 6px rgba(201,162,75,.65); }
}
.confetti{
  position:fixed; top:-40px; font-size:1.4rem; pointer-events:none; z-index:99;
  animation:fall 1.7s linear forwards;
}
@keyframes fall{ to{ transform:translateY(105vh) rotate(360deg); opacity:.2; } }

/* ----- 設計図えらび ----- */
.select-title{ text-align:center; font-size:.86rem; color:var(--brown-mid); }
/* 章の見出し */
.ch-head{
  margin:14px 0 8px; text-align:center;
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px solid var(--gold); border-radius:14px; padding:8px 10px;
}
.ch-head.locked{ border-color:var(--brown-soft); opacity:.75; background:var(--cream-deep); }
.ch-head .ch-name{ font-size:.88rem; font-weight:bold; letter-spacing:.06em; }
.ch-head .ch-n{ font-size:.66rem; font-weight:normal; color:var(--brown-mid); }
.ch-head .ch-sub{ font-size:.68rem; color:var(--brown-mid); margin-top:3px; line-height:1.6; }
.ch-head .ch-sub b{ color:#a97c14; }
.ch-head .ch-ace{ display:block; font-size:.62rem; color:var(--brown-soft); margin-top:1px; }
.select-list{ display:flex; flex-direction:column; gap:10px; }
.select-item{
  display:flex; align-items:center; gap:12px;
  background:var(--paper); border:2.5px solid var(--wood-dark);
  border-radius:16px; padding:8px 14px; cursor:pointer;
  box-shadow:0 3px 6px rgba(107,74,47,.15);
  transition:transform .12s;
  text-align:left; width:100%; font-family:inherit; color:inherit;
}
.select-item:active{ transform:scale(.97); }
.select-item .thumb{ width:52px; height:52px; flex:0 0 52px; }
.select-item .thumb svg{ width:100%; height:100%; }
.select-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:10px; }
.select-item .icon{ font-size:2rem; width:52px; text-align:center; }
.select-item .name{ font-weight:bold; font-size:.9rem; }
.select-item .info{ font-size:.66rem; color:var(--brown-mid); margin-top:2px; line-height:1.5; }
.select-item.locked{
  opacity:.55; filter:grayscale(.6); cursor:default;
  border-style:dashed; box-shadow:none;
}
.mat-chip{
  display:inline-block; font-size:.64rem; border-radius:999px; padding:1px 7px;
  border:1px solid var(--wood-dark); background:var(--cream-deep); margin:1px 1px 0 0;
}
.mat-chip.ng{ color:var(--red); border-color:var(--red); background:#f8ece8; }

/* ----- 制作の設計えらび（設計・素材・仕上げ） ----- */
/* 絵と名前を横ならびにして、縦の長さを詰める */
.prep-head{ display:flex; align-items:center; gap:10px; }
.prep-head .art{ flex:0 0 86px; }
.prep-head .ph-body{ flex:1; min-width:0; }
.prep-head h2{ text-align:left; font-size:.98rem; margin:0; }
.prep-head .desc{ text-align:left; margin-top:3px; font-size:.68rem; line-height:1.55; }

/* 見出しを行の左に置いて、1項目を1行におさめる */
.prep-group{
  margin-top:7px; display:grid; grid-template-columns:2.9em 1fr;
  align-items:center; gap:6px;
}
.prep-group .g-title{ font-size:.62rem; font-weight:bold; text-align:right; line-height:1.3; }
.prep-mats{
  margin-top:8px; text-align:center; font-size:.7rem;
  border-top:1.5px dashed var(--wood-light); padding-top:7px;
}
/* 3つを横にならべる。折り返すと画面が長くなりすぎる */
.opt-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
.opt-chip{
  font-family:inherit; font-size:.63rem; font-weight:bold; color:var(--brown);
  padding:7px 2px; border-radius:13px; cursor:pointer; letter-spacing:-.02em;
  white-space:nowrap;
  border:2px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  min-height:48px; line-height:1.35;
}
.opt-chip .o-note{ display:block; font-size:.5rem; font-weight:normal; white-space:normal;
  color:var(--brown-mid); line-height:1.4; margin-top:1px; }
.opt-chip.selected{
  background:linear-gradient(180deg,#eef5e8,var(--green));
  border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.3);
}
.opt-chip:disabled{ opacity:.45; cursor:default; }
.start-btn{
  display:block; width:100%; margin-top:12px;
  font-family:inherit; font-size:.96rem; font-weight:bold; color:#fff;
  padding:14px; border-radius:18px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55, var(--shadow);
}
.start-btn:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; }
.cancel-link{
  text-align:center; font-size:.7rem; color:var(--brown-soft);
  margin-top:8px; text-decoration:underline; cursor:pointer;
}

/* ---------- 工程エリア ---------- */
#steps-area{ padding:4px 14px 10px; }
.steps{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
.step-chip{
  font-size:.7rem; font-weight:bold; color:var(--brown);
  padding:5px 10px; border-radius:999px;
  border:2px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
}
.step-chip.done-step{ background:var(--wood-light); border-color:var(--wood-dark); opacity:.75; }
.step-chip.current{
  background:linear-gradient(180deg,#eef5e8,var(--green));
  border-color:var(--green-deep);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
.choice-title{ text-align:center; font-size:.8rem; font-weight:bold; margin-bottom:8px; }
.choices{ display:flex; gap:8px; }
.choice-btn{
  flex:1; font-family:inherit; font-weight:bold; color:var(--brown);
  padding:12px 4px 10px; border-radius:18px; cursor:pointer;
  border:2.5px solid var(--brown-soft);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  box-shadow:0 3px 0 var(--brown-soft);
  transition:transform .1s;
  min-height:88px;
}
.choice-btn .c-icon{ display:block; font-size:1.6rem; line-height:1.2; }
.choice-btn .c-label{ display:block; font-size:.92rem; margin-top:3px; }
.choice-btn .c-note{ display:block; font-size:.6rem; font-weight:normal; color:var(--brown-mid); margin-top:2px; line-height:1.4; }
.choice-btn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-soft); }
.choice-btn:disabled{ opacity:.55; box-shadow:none; cursor:default; }
.choice-teinei{ border-color:var(--green-deep); box-shadow:0 3px 0 var(--green-deep);
  background:linear-gradient(180deg,#f2f7ee,#dcead4); }
.choice-teinei:active{ box-shadow:0 1px 0 var(--green-deep); }

/* 完成後の2択（納品／展示） */
.finish-row{ display:flex; gap:8px; margin-top:4px; }
.deliver-btn, .exhibit-btn{
  flex:1; font-family:inherit; font-size:.84rem; font-weight:bold; color:#fff;
  padding:13px 6px; border-radius:18px; border:none; cursor:pointer;
  letter-spacing:.02em; line-height:1.4;
}
.deliver-btn{
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55; animation:pulse 1.4s infinite;
}
.exhibit-btn{
  background:linear-gradient(180deg,#d8b45e,var(--gold));
  box-shadow:0 4px 0 #a97c14;
}
.exhibit-btn:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; animation:none; }
.deliver-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #5f7d55; }
.exhibit-btn:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 #a97c14; }

/* 固定フッターの高さぶんの余白。これがないと、いちばん下のボタンが隠れる */
#bottom-space{ flex:0 0 auto; height:92px; }

/* ---------- 固定フッター ---------- */
footer{
  position:sticky; bottom:0; z-index:30;
  display:flex; gap:5px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:
    repeating-linear-gradient(90deg,
      rgba(107,74,47,.08) 0 3px, transparent 3px 34px),
    linear-gradient(180deg, var(--wood-light), var(--wood-dark));
  border-top:4px solid var(--brown-mid);
  border-radius:18px 18px 0 0;
  box-shadow:0 -4px 12px rgba(107,74,47,.2);
}
.foot-btn{
  flex:1; font-family:inherit; font-size:.7rem; font-weight:bold; color:var(--brown);
  min-height:52px;
  padding:8px 1px; border-radius:14px; cursor:pointer;
  border:2.5px solid var(--brown-mid);
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
  box-shadow:0 3px 0 var(--brown-mid);
}
.foot-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-mid); }

/* ---------- モーダル共通 ---------- */
.modal-back{
  position:fixed; inset:0; background:rgba(80,55,35,.55);
  display:none; align-items:center; justify-content:center; z-index:50;
  padding:20px;
}
.modal-back.open{ display:flex; }
.modal{
  width:100%; max-width:420px; max-height:82dvh; overflow-y:auto;
  background:var(--paper); border:3px solid var(--wood-dark);
  border-radius:20px; padding:18px 16px;
  box-shadow:0 10px 30px rgba(60,40,20,.4);
  animation:modalIn .25s ease;
}
@keyframes modalIn{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
.modal h3{
  text-align:center; font-size:1.05rem; letter-spacing:.12em;
  border-bottom:2px dashed var(--brown-soft); padding-bottom:8px; margin-bottom:12px;
}
.modal .close{
  display:block; margin:14px auto 0; font-family:inherit; font-weight:bold;
  padding:9px 34px; border-radius:999px; cursor:pointer;
  border:2px solid var(--brown-mid); background:var(--cream-deep); color:var(--brown);
}
.modal .x-close{
  position:sticky; top:0; float:right; z-index:2;
  width:40px; height:40px; border-radius:50%;
  border:2px solid var(--brown-mid); background:var(--cream-deep); color:var(--brown);
  font-family:inherit; font-size:1rem; font-weight:bold; cursor:pointer;
  box-shadow:0 2px 4px rgba(107,74,47,.25); margin-left:8px;
}
.dex-section-title{
  text-align:center; font-size:.82rem; font-weight:bold; letter-spacing:.1em;
  margin:16px 0 10px; color:var(--brown-mid);
  border-bottom:2px dashed var(--wood-light); padding-bottom:5px;
}

/* ---------- 図鑑（ゲームの主役） ---------- */
.dex-complete{
  text-align:center; margin-bottom:12px;
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px solid var(--gold); border-radius:14px; padding:10px;
}
.dex-complete .big{ font-size:1.3rem; font-weight:bold; color:#a97c14; }
.dex-complete .small{ font-size:.68rem; color:var(--brown-mid); margin-top:2px; }
.dex-item{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:8px 12px; margin-bottom:10px; background:#fffdf7;
}
.dex-item .d-head{ display:flex; gap:12px; align-items:center; }
.dex-item .thumb{ width:52px; height:52px; flex:0 0 52px; }
.dex-item .thumb svg{ width:100%; height:100%; }
.dex-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:10px; }
.dex-item .icon{ font-size:1.8rem; width:52px; text-align:center; }
.dex-item .name{ font-weight:bold; font-size:.9rem; }
.dex-item .count{ font-size:.68rem; color:var(--brown-mid); margin-top:3px; line-height:1.7; }
.dex-item .d-desc{ font-size:.72rem; color:var(--brown-mid); margin-top:6px; line-height:1.7; text-align:justify; }
.dex-item .d-story{
  margin-top:6px; font-size:.74rem; line-height:1.85; text-align:justify;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
  border:1.5px dashed var(--wood-dark); border-radius:10px; padding:8px 10px;
}
.dex-item.unknown{ opacity:.6; }
.dex-item.unknown .d-head{ filter:grayscale(1); }
.dex-item.secret{ border-color:var(--gold); }
.knowledge{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:10px 13px; margin-bottom:10px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
}
.knowledge h4{ font-size:.82rem; margin-bottom:4px; }
.knowledge p{ font-size:.74rem; line-height:1.8; text-align:justify; color:var(--brown-mid); }

/* 童話のきれはし */
.letter-item{
  border:2px solid #d9c48f; border-radius:4px 14px 4px 14px;
  padding:10px 13px; margin-bottom:10px;
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(176,138,99,.12) 22px 23px),
    linear-gradient(180deg,#fdf8e9,#f7eed3);
  font-size:.76rem; line-height:1.95; text-align:justify;
}
.letter-item h4{ font-size:.78rem; margin-bottom:4px; color:#8a6a2f; }
.letter-item.locked{ opacity:.55; filter:grayscale(.4); }
.story-item{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:12px 14px; margin-bottom:12px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
}
.story-item h4{ font-size:.88rem; margin-bottom:6px; }
.story-item p{ font-size:.8rem; line-height:1.9; text-align:justify; }
.story-item.locked{ opacity:.6; }
.story-item.final{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.25); }

/* ---------- 仕入れ（材料） ---------- */
.mat-item{
  display:flex; gap:12px; align-items:center;
  border:2px solid var(--wood-light); border-radius:14px;
  padding:9px 12px; margin-bottom:9px; background:#fffdf7;
}
.mat-item .m-icon{ font-size:1.7rem; width:40px; text-align:center; }
.mat-item .m-body{ flex:1; }
.mat-item .m-name{ font-weight:bold; font-size:.86rem; }
.mat-item .m-desc{ font-size:.66rem; color:var(--brown-mid); margin-top:1px; line-height:1.5; }
.mat-item .m-own{ font-size:.72rem; font-weight:bold; color:var(--green-deep); white-space:nowrap; }
.mat-buy{
  font-family:inherit; font-weight:bold; font-size:.72rem; color:#fff;
  padding:9px 10px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 3px 0 #5f7d55; white-space:nowrap;
}
.mat-buy:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 #5f7d55; }
.mat-buy:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; cursor:default; }

/* ---------- ショールーム（展示） ---------- */
.show-head{
  text-align:center; margin-bottom:10px;
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  border:2px solid var(--gold); border-radius:14px; padding:9px;
  font-size:.72rem; color:var(--brown-mid); line-height:1.8;
}
.show-head b{ color:#a97c14; font-size:.9rem; }
.show-item{
  display:flex; gap:10px; align-items:center;
  border:2px solid var(--wood-light); border-radius:14px;
  padding:8px 12px; margin-bottom:9px; background:#fffdf7;
}
.show-item .thumb{ width:46px; height:46px; flex:0 0 46px; }
.show-item .thumb svg{ width:100%; height:100%; }
.show-item .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:8px; }
.show-item .s-body{ flex:1; }
.show-item .s-name{ font-weight:bold; font-size:.82rem; }
.show-item .s-info{ font-size:.66rem; color:var(--brown-mid); margin-top:2px; line-height:1.6; }
.sell-btn{
  font-family:inherit; font-weight:bold; font-size:.7rem; color:var(--brown);
  padding:8px 10px; border-radius:12px; cursor:pointer;
  border:2px solid var(--brown-mid); background:var(--cream-deep); white-space:nowrap;
}
.bonus-chip{
  display:inline-block; font-size:.66rem; font-weight:bold; color:#a97c14;
  border:1.5px solid var(--gold); background:#fdf3d5;
  border-radius:999px; padding:2px 9px; margin:2px 1px;
}
.bonus-chip.off{ color:var(--brown-soft); border-color:var(--brown-soft); background:var(--cream-deep); opacity:.7; }

/* ---------- 設備 ---------- */
.gear-item{
  display:flex; gap:12px; align-items:center;
  border:2px solid var(--wood-light); border-radius:14px;
  padding:10px 12px; margin-bottom:10px; background:#fffdf7;
}
.gear-item .g-icon{ font-size:1.9rem; width:44px; text-align:center; }
.gear-item .g-name{ font-weight:bold; font-size:.86rem; }
.gear-item .g-desc{ font-size:.68rem; color:var(--brown-mid); margin-top:2px; line-height:1.6; }
.gear-item .g-body{ flex:1; }
.gear-buy{
  font-family:inherit; font-weight:bold; font-size:.72rem; color:#fff;
  padding:9px 11px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 3px 0 #5f7d55; white-space:nowrap;
}
.gear-buy:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 #5f7d55; }
.gear-buy:disabled{ background:var(--cream-deep); color:var(--brown-soft); box-shadow:none; cursor:default; }
.gear-owned{
  font-size:.72rem; font-weight:bold; color:var(--green-deep);
  border:2px solid var(--green-deep); border-radius:999px; padding:6px 9px; white-space:nowrap;
}
.gear-item.owned{ background:#f7f3e6; border-color:var(--green); }
.gear-item.locked{
  opacity:.55; filter:grayscale(.5);
  border-style:dashed; box-shadow:none;
}

/* ---------- 工房紹介 ---------- */
.about-hero{ text-align:center; margin-bottom:12px; }
.about-hero .art{ width:110px; height:110px; margin:0 auto; }
.about-hero .art svg{ width:100%; height:100%; }
.about-hero .art img{ width:100%; height:100%; object-fit:contain; display:block; }
.about-hero .catch{ font-size:.82rem; color:var(--brown-mid); margin-top:6px; letter-spacing:.06em; }
.about-block{
  border:2px solid var(--wood-light); border-radius:14px;
  padding:11px 13px; margin-bottom:10px; background:#fffdf7;
}
.about-block h4{ font-size:.84rem; margin-bottom:5px; }
.about-block p{ font-size:.76rem; line-height:1.9; text-align:justify; color:var(--brown-mid); }
.reset-link{
  text-align:center; font-size:.66rem; color:var(--brown-soft);
  margin-top:14px; text-decoration:underline; cursor:pointer;
}

/* ---------- 職人アクション ---------- */
/* 山場の呼び出し */
.act-call{
  text-align:center; padding:14px 12px 12px; border-radius:18px;
  border:2.5px solid var(--gold);
  background:linear-gradient(180deg,#fdf6e6,#f7ecd2);
  box-shadow:0 0 0 2px rgba(201,162,75,.2);
}
.act-call .ac-head{ font-size:.94rem; font-weight:bold; color:#a97c14; }
.tool-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:9px; }
.tool-chip{
  font-family:inherit; font-size:.63rem; font-weight:bold; color:var(--brown);
  padding:7px 2px; border-radius:12px; cursor:pointer; min-height:50px;
  border:2px solid var(--brown-soft); line-height:1.3;
  background:linear-gradient(180deg,#fffaf0,var(--cream-deep));
}
.tool-chip .t-note{ display:block; font-size:.5rem; font-weight:normal; color:var(--brown-mid); margin-top:2px; }
.tool-chip.selected{
  background:linear-gradient(180deg,#eef5e8,var(--green));
  border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.3);
}
.act-call .ac-game{ font-size:.82rem; font-weight:bold; margin-top:5px; }
.act-call .ac-lv{ font-size:.68rem; font-weight:normal; color:#a97c14; }
.act-call .ac-sub{ font-size:.74rem; color:var(--brown-mid); margin-top:4px; line-height:1.7; }
.act-call .ac-tired{ font-size:.7rem; color:var(--red); margin-top:5px; font-weight:bold; }
.act-go{
  display:block; width:100%; margin-top:10px;
  font-family:inherit; font-size:1rem; font-weight:bold; color:#fff;
  padding:15px; border-radius:18px; border:none; cursor:pointer;
  background:linear-gradient(180deg,#d8b45e,var(--gold));
  box-shadow:0 4px 0 #a97c14; letter-spacing:.06em;
  animation:pulse 1.6s infinite;
}
.act-go:active{ transform:translateY(3px); box-shadow:0 1px 0 #a97c14; }
.act-skip{
  text-align:center; font-size:.7rem; color:var(--brown-soft);
  margin-top:9px; text-decoration:underline; cursor:pointer; padding:3px;
}

/* アクション画面 */
.act-tip{
  font-size:.76rem; line-height:1.8; color:var(--brown-mid);
  text-align:center; margin-bottom:8px;
}
.act-tip b{ color:var(--brown); }
.act-stage{
  width:100%; max-width:320px; margin:0 auto;
  aspect-ratio:1/1; border-radius:16px; overflow:hidden;
  border:3px solid var(--wood-dark); background:#fdf6e6;
  touch-action:none;                 /* 指でなぞる間、画面を動かさない */
}
.act-stage svg{ width:100%; height:100%; display:block; touch-action:none; }
.act-bar-wrap{
  height:10px; border-radius:999px; margin:10px auto 0; max-width:320px;
  background:var(--cream-deep); border:1.5px solid var(--brown-soft); overflow:hidden;
}
.act-bar-wrap>i{
  display:block; height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,var(--gold),#e0bf74); transition:width .18s;
}
.act-say{
  text-align:center; font-size:.74rem; color:var(--brown-mid);
  min-height:1.5em; margin-top:7px; line-height:1.6;
}
.act-result{ text-align:center; }
.act-score{ font-size:2.1rem; font-weight:bold; color:#a97c14; line-height:1.2; }
.act-score .unit{ font-size:.9rem; }
.act-best{ font-size:.74rem; color:var(--green-deep); font-weight:bold; }
.act-henry{
  font-size:.8rem; line-height:1.8; margin:8px 0 2px;
  padding:10px 12px; background:#fdf6e6; border-radius:12px;
  border:1.5px dashed var(--gold); text-align:justify;
}

/* 土台と腕前の内訳 */
.mult-row{
  text-align:center; font-size:.68rem; color:var(--brown-mid);
  margin-top:5px; line-height:1.6;
}
.mult-row b{ color:#a97c14; font-size:.78rem; }
.act-effect{
  font-size:.82rem; color:var(--brown-mid); line-height:1.8;
  margin:6px 0 2px; padding:8px 10px;
  background:var(--cream-deep); border-radius:12px;
}
.act-effect b{ color:#a97c14; font-size:1rem; }
.act-effect .ae-note{ font-size:.68rem; color:var(--brown-soft); margin-top:3px; }

/* 得意・不得意 */
.skill-row{
  display:flex; align-items:center; gap:8px;
  font-size:.76rem; padding:3px 0;
}
.skill-row .s-name{ width:3.6em; font-weight:bold; }
.skill-row .s-stars{ color:var(--gold); letter-spacing:.12em; }
.skill-row .s-num{ color:var(--brown-soft); font-size:.68rem; }

/* 職人（あなた）の顔と名前 */
.player-row{
  display:flex; align-items:center; justify-content:center; gap:6px; margin-top:3px;
}
.player-face{
  width:26px; height:26px; flex:0 0 26px; cursor:pointer;
  background:var(--paper); border:2px solid var(--brown-soft); border-radius:50%;
  overflow:hidden; box-shadow:0 1px 3px rgba(107,74,47,.25);
}
.player-face svg{ width:100%; height:100%; display:block; }
.player-row .lvbar-label{ margin-top:0; text-align:left; }
.player-row .lvbar-label b{ color:var(--brown); }

/* 似顔絵メーカー：顔と名前は上に貼りつけて、パーツを選ぶ間も見えるようにする */
.av-top{
  position:sticky; top:0; z-index:1;
  background:var(--paper); padding:2px 0 8px;
  box-shadow:0 6px 8px -6px rgba(107,74,47,.3);
}
.av-preview{
  width:104px; height:104px; margin:0 auto 4px;
  background:var(--paper); border:3px solid var(--brown-soft); border-radius:50%;
  overflow:hidden; box-shadow:var(--shadow);
}
.av-preview svg{ width:100%; height:100%; display:block; }
.av-name-input{
  display:block; width:100%; max-width:240px; margin:8px auto 0;
  font-family:inherit; font-size:1rem; text-align:center; color:var(--brown);
  padding:10px 12px; border-radius:14px;
  border:2.5px solid var(--brown-soft); background:#fffdf7;
}
.av-name-input:focus{ outline:none; border-color:var(--green-deep); }
.av-hint{ text-align:center; font-size:.68rem; color:var(--brown-mid); margin-bottom:6px; }
.av-row{ margin-top:10px; }
.av-row .g-title{ font-size:.74rem; font-weight:bold; text-align:center; margin-bottom:5px; }
.av-opts{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.av-chip{
  width:46px; height:46px; padding:0; cursor:pointer; overflow:hidden;
  border:2px solid var(--brown-soft); border-radius:12px; background:#fffdf7;
}
.av-chip svg{ width:100%; height:100%; display:block; }
.av-chip.selected{ border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.35); }
.av-swatch{
  width:34px; height:34px; border-radius:50%; cursor:pointer;
  border:2.5px solid var(--brown-soft); padding:0;
}
.av-swatch.selected{ border-color:var(--green-deep); box-shadow:0 0 0 2px rgba(122,156,110,.35); }
.av-done{
  display:block; width:100%; margin-top:14px;
  font-family:inherit; font-size:1rem; font-weight:bold; color:#fff;
  padding:14px; border-radius:18px; border:none; cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green-deep));
  box-shadow:0 4px 0 #5f7d55;
}
.av-done:active{ transform:translateY(3px); box-shadow:0 1px 0 #5f7d55; }

/* 集中力が心もとないときのチップ */
.chip.focus-low{ border-color:var(--red); color:var(--red); }

/* 山場工程 */
.step-chip.critical{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.35); }
.crit-tag{ color:#a97c14; font-size:.76rem; margin-left:4px; }
.ct-type{ font-size:.64rem; font-weight:normal; color:var(--brown-soft); letter-spacing:.08em; }

/* しくじりの警告 */
.flaw-note{
  text-align:center; font-size:.7rem; color:var(--red);
  background:#f9ece8; border:1.5px dashed var(--red);
  border-radius:10px; padding:5px 8px; margin-bottom:8px;
}

/* 今日はここまで */
.rest-link{
  text-align:center; font-size:.7rem; color:var(--brown-mid);
  margin-top:10px; text-decoration:underline; cursor:pointer; padding:4px;
}

/* 職人手帳 */
.note-item{
  border:2px solid var(--wood-light); border-radius:12px;
  padding:7px 11px; margin-bottom:7px; background:#fffdf7;
  font-size:.7rem; line-height:1.7;
}
.note-item .n-head{ font-weight:bold; font-size:.78rem; }
.note-item .n-combo{ color:var(--brown-mid); }
.note-item.hit{ border-color:var(--gold); background:#fdf6e6; }
.note-item.near{ border-color:var(--green-deep); }
.note-near-tag{
  display:inline-block; font-size:.64rem; font-weight:bold; color:var(--green-deep);
  border:1.5px solid var(--green-deep); background:#eef5e8;
  border-radius:999px; padding:1px 7px; margin-left:4px;
}
.note-empty{ text-align:center; font-size:.74rem; color:var(--brown-mid); line-height:1.9; }

.dex-ace{
  display:inline-block; font-size:.66rem; font-weight:bold; color:#a97c14;
  border:1.5px solid var(--gold); background:#fdf3d5;
  border-radius:999px; padding:1px 8px; margin:4px 0 0 4px;
}
.dex-ace.off{ color:var(--brown-soft); border-color:var(--brown-soft); background:var(--cream-deep); }

/* 図鑑の山場メモ */
.dex-crit{
  display:inline-block; font-size:.66rem; font-weight:bold; color:#a97c14;
  border:1.5px solid var(--gold); background:#fdf3d5;
  border-radius:999px; padding:1px 8px; margin-top:4px;
}

/* 来館者のひとこと */
.visitor-line{
  border:2px solid var(--wood-light); border-radius:12px;
  padding:8px 11px; margin-bottom:10px;
  background:linear-gradient(180deg,#fffef9,#fdf6e6);
  font-size:.74rem; line-height:1.8; text-align:justify;
}

/* 物語解放ポップアップ */
#story-pop .modal{ text-align:center; }
#story-pop .story-text{
  font-size:.84rem; line-height:2; margin:10px 0; text-align:justify;
  padding:12px; background:#fdf6e6; border-radius:12px;
  border:1.5px dashed var(--gold);
  white-space:pre-line;
}
.pop-badge{ font-size:2.2rem; display:block; animation:pulse 1.2s infinite; }
</style>
</head>
<body>

<!-- ========== ヘッダー ========== -->
<header>
  <h1>🪑 松永工房クラフトストーリー
    <span class="sub">〜小さな家具と、いろいろな童話〜</span>
  </h1>
  <div class="status">
    <span class="chip">💰 <span id="st-money">0</span>円</span>
    <span class="chip">🏠 Lv.<span id="st-level">1</span></span>
    <span class="chip">📅 <span id="st-day">1</span>日目</span>
    <span class="chip">⏱ <span id="st-hours">8</span>h</span>
    <span class="chip" id="chip-focus">🕯 <span id="st-focus">100</span></span>
    <span class="chip">👥 のべ<span id="st-visitors">0</span>人</span>
  </div>
  <div class="lvbar"><i id="lv-fill"></i></div>
  <div class="player-row">
    <span class="player-face" id="player-face" title="職人を変える"></span>
    <span class="lvbar-label" id="lv-label"></span>
  </div>
</header>

<!-- ========== メイン ========== -->
<main>
  <div id="henry-area">
    <div id="henry-avatar"></div>
    <div id="message"><span class="henry-name">ヘンリーさん</span><span id="message-text"></span></div>
  </div>
  <div id="trivia" class="trivia" hidden></div>
  <div id="card-area"></div>
</main>

<!-- ========== 工程エリア ========== -->
<div id="steps-area"></div>

<!-- 固定フッターの下に中身が隠れないための余白 -->
<div id="bottom-space"></div>

<!-- ========== 固定フッター ========== -->
<footer>
  <button class="foot-btn" id="btn-dex">📖<br>図鑑</button>
  <button class="foot-btn" id="btn-show">🖼<br>展示室</button>
  <button class="foot-btn" id="btn-market">🧺<br>仕入れ</button>
  <button class="foot-btn" id="btn-gear">🛠<br>設備</button>
  <button class="foot-btn" id="btn-about">🏠<br>工房</button>
</footer>

<!-- ========== モーダル：図鑑（主役。物語・童話もここに） ========== -->
<div class="modal-back" id="dex-modal">
  <div class="modal">
    <button class="x-close" data-close="dex-modal" aria-label="とじる">✕</button>
    <h3>📖 家具図鑑</h3>
    <div id="dex-complete"></div>
    <div id="dex-list"></div>
    <div class="dex-section-title">📓 職人手帳</div>
    <div id="note-list"></div>
    <div class="dex-section-title">📖 童話のきれはし</div>
    <div id="letter-list"></div>
    <button class="close" data-close="dex-modal">とじる</button>
  </div>
</div>

<!-- ========== モーダル：ショールーム（展示） ========== -->
<div class="modal-back" id="show-modal">
  <div class="modal">
    <button class="x-close" data-close="show-modal" aria-label="とじる">✕</button>
    <h3>🖼 ショールーム</h3>
    <div id="show-body"></div>
    <button class="close" data-close="show-modal">とじる</button>
  </div>
</div>

<!-- ========== モーダル：仕入れ（材料） ========== -->
<div class="modal-back" id="market-modal">
  <div class="modal">
    <button class="x-close" data-close="market-modal" aria-label="とじる">✕</button>
    <h3>🧺 材料の仕入れ</h3>
    <div id="market-body"></div>
    <button class="close" data-close="market-modal">とじる</button>
  </div>
</div>

<!-- ========== モーダル：設備投資 ========== -->
<div class="modal-back" id="gear-modal">
  <div class="modal">
    <button class="x-close" data-close="gear-modal" aria-label="とじる">✕</button>
    <h3>🛠 工房の設備</h3>
    <div id="gear-list"></div>
    <button class="close" data-close="gear-modal">とじる</button>
  </div>
</div>

<!-- ========== モーダル：松永工房紹介 ========== -->
<div class="modal-back" id="about-modal">
  <div class="modal">
    <button class="x-close" data-close="about-modal" aria-label="とじる">✕</button>
    <h3>🏠 有限会社 松永工房</h3>

const chapterOf = (f) => CHAPTER_OF[f.id] || 1;
/* その章で、Aランク以上に仕上げた家具の数 */
function chapterDone(n) {
  const ace = (id) => { const c = state.completed[id]; return !!(c && c.ace); };
  return FURNITURE.filter(f => chapterOf(f) === n)
    .filter(f => ace(f.id) || RECIPES.some(r => r.baseId === f.id && ace(r.id))).length;
}
const chapterOpen = (n) => n <= 1 || (chapterOpen(n - 1) && chapterDone(n - 1) >= CHAPTERS[n - 1].need);
/* いま開いているいちばん先の章 */
const topChapter = () => chapterOpen(3) ? 3 : chapterOpen(2) ? 2 : 1;
/* 素材・設計・仕上げも、章で開く */
const chOpen = (it) => !it.ch || it.ch <= topChapter();

/* ==========================================================
   職人アクション
   ----------------------------------------------------------
   山場工程だけ、選択肢ではなく実際に指を動かして作る。
   反射神経ではなく「ていねいさ・正確さ」を測る。
   どのアクションも 0〜100 点を返し、その点が品質に化ける。

   アクションを足すときは CRAFT_ACTIONS にキーを1つ増やし、
   その工程タイプ（STEP_TYPE_OF の値）と同じ名前にすればよい。
   ========================================================== */
const ACT_VIEW = 300;          // アクション画面の座標系（正方形）

/* 画面上の指の位置を、SVGの座標に直す。
   SVGに余白が入っても正しく取れるよう、ブラウザ自身の変換を使う */
function actPoint(svg, e) {
  const m = svg.getScreenCTM();
  if (m) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(m.inverse());
    return { x: q.x, y: q.y };
  }
  const r = svg.getBoundingClientRect();   // 念のための保険
  return { x: (e.clientX - r.left) / r.width * ACT_VIEW,
           y: (e.clientY - r.top) / r.height * ACT_VIEW };
}
const actDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp100 = (n) => Math.max(0, Math.min(100, Math.round(n)));

/* ----------------------------------------------------------

   一筆でなぞれる形だけを使う。points() が採点用の通過点、
   dense() が下絵として描くなめらかな線。
   文様を足すときは、この2つを返す項目を1つ増やすだけでよい。
   ---------------------------------------------------------- */
const CARVE_PATTERNS = {

  /* 唐草：うねって伸び、先で渦を巻く。工房の定番の彫り */

    curve(t) {
      if (t < 0.62) {                      // うねりながら右上へ伸びる茎
        const u = t / 0.62;
        return { x: 44 + u * 141,
                 y: 214 - u * 100 - Math.sin(u * Math.PI) * 34 };
      }
      const u = (t - 0.62) / 0.38;         // 先端で内へ巻きこむ
      const a = Math.PI + u * Math.PI * 1.85;
      const r = 30 - u * 21;
      return { x: 215 + Math.cos(a) * r, y: 114 + Math.sin(a) * r };
    },
    points() { const o = []; for (let i = 0; i <= 15; i++) o.push(this.curve(i / 15)); return o; },

/* ==========================================================
   ミニゲーム（職人アクション）10種
   ----------------------------------------------------------
   どれも、それ一本でも遊べる形にそろえてある。
     ・1回 25〜40秒
     ・3つの波。進むほど速く、狭く、多くなる
     ・連続成功（れんけい）が伸びるほど点が上がる
     ・しくじっても終わらない。ただし点は減る
   返すのは 0〜100 点。その点がそのまま品質の「腕前」になる。

   start(svg, ui, done, lv)
     svg  … 300×300 の盤面
     ui   … progress(0〜1) / say(文字) / setTip(HTML)
            onDown・onPoint・onUp に関数を入れると指の操作が届く
            onStop に後片付けを入れておくこと
     done … done(点, ひとこと) で終わり
     lv   … 家具ごとの難度 1〜3
   ========================================================== */

/* 採点の共通土台。命中率が8割、連続成功が2割、しくじりは引き算 */
function actScore(total) {
  let hit = 0, miss = 0, combo = 0, best = 0;
  return {
    setTotal(n) { total = Math.max(1, n); },
    ok(n) { n = n || 1; hit += n; combo += n; if (combo > best) best = combo; },
    ng(n) { n = n || 1; miss += n; combo = 0; },
    get combo() { return combo; },
    get best() { return best; },
    get hit() { return hit; },
    get miss() { return miss; },
    value() {
      const acc = total > 0 ? hit / total : 0;
      const run = total > 0 ? best / total : 0;
      return clamp100(acc * 82 + run * 18 - miss * 3);
    },
    word() {
      if (total > 0 && best >= total * 0.85) return `${best}つ続けて決めおった。手が覚えておるな。`;
      if (miss === 0) return "ひとつも外さなんだか。";
      if (miss <= 2) return "ほぼ狙いどおりじゃ。";
      if (miss <= 5) return `${miss}回しくじったのう。`;
      return "まだ手が付いてきておらんな。";
    }
  };
}

/* 波の見出し。いま何波目で、何をすればよいかを出しつづける */
function actBanner(ui, wave, waves, label, sc) {
  ui.setTip(`<b>第${wave}波 / ${waves}</b>　${label}` +
    (sc && sc.combo > 1 ? `　<b style="color:#a97c14">${sc.combo}連続！</b>` : ""));
}

const actRand = (a, b) => a + Math.random() * (b - a);
/* 難度 1〜3 を 0.85〜1.15 のつらさに直す */
const actHard = (lv) => 0.85 + (lv - 1) * 0.15;

const CRAFT_ACTIONS = {

  /* ================================================================

  mekiki: {

    start(svg, ui, done, lv) {

        near = new Array(pts.length).fill(1e9);
        drawn = [];
        const scaleLabel = ["ゆっくりで良い", "少し細い線じゃ", "いちばん細い線じゃ"][round];
        const tol = [30, 24, 18][round] / h;
        svg.innerHTML =
          `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
           <rect x="18" y="18" width="264" height="264" rx="16" fill="#c98d54"/>
           ${pat.decor}
           <path d="${pat.dense().map((p, i) => (i ? "L" : "M") + p.x + " " + p.y).join(" ")}"
             stroke="#8a5a30" stroke-width="${tol * .9}" fill="none" opacity=".28"
             stroke-linecap="round" stroke-linejoin="round"/>
           <path id="carve" d="" stroke="#f2cf9d" stroke-width="5" fill="none"
             stroke-linecap="round" stroke-linejoin="round"/>
           <circle id="tip" cx="-50" cy="-50" r="6" fill="#fffdf5" stroke="#8a5a30" stroke-width="2"/>
           <text x="150" y="294" text-anchor="middle" font-size="13" fill="#8a6446">${scaleLabel}</text>`;
        judging = false;
        actBanner(ui, round + 1, ROUNDS, "下絵を一筆でなぞる", sc);
        return tol;
      };
      let tol = setup();

      const judge = () => {
        if (judging || round >= ROUNDS) return;   // 1回につき一度だけ採点する
        judging = true;
        let good = 0;
        near.forEach(d => { if (d < tol) good++; });
        const got = Math.round(good / pts.length * 22);
        for (let i = 0; i < got; i++) sc.ok();
        for (let i = got; i < 22; i++) sc.ng(0.35);
        ok += good / pts.length;
        ui.progress((round + 1) / ROUNDS);
        round++;
        if (round < ROUNDS) { setTimeout(() => { if (!over) tol = setup(); }, 450); ui.say(`${Math.round(good / pts.length * 100)}% 彫れた`); }
        else setTimeout(() => { if (!over) done(sc.value(),
          ok / ROUNDS > .85 ? "刃先が迷っておらん。見事じゃ。"
            : ok / ROUNDS > .6 ? "おおむね下絵のとおりじゃ。" : "線から外れすぎじゃのう。"); }, 400);
      };

      ui.onDown = (p) => { drawn = [p]; };
      ui.onPoint = (p) => {
        svg.querySelector("#tip").setAttribute("cx", p.x);
        svg.querySelector("#tip").setAttribute("cy", p.y);
        drawn.push(p);
        svg.querySelector("#carve").setAttribute("d",
          drawn.map((q, i) => (i ? "L" : "M") + q.x.toFixed(1) + " " + q.y.toFixed(1)).join(" "));
        pts.forEach((c, i) => {
          const d = actDist(p, c);
          if (d < near[i]) near[i] = d;
        });
        let good = 0; near.forEach(d => { if (d < tol) good++; });
        if (good >= pts.length) judge();
      };
      ui.onUp = () => { if (round < ROUNDS) judge(); };
      ui.onTimeout = () => {
        judging = false;
        if (round < ROUNDS) judge();          // いまの回を締める
        while (round < ROUNDS) {              // 残りの回は未達として締める
          for (let i = 0; i < 22; i++) sc.ng(0.35);
          round++;
        }
        over = true;
        done(sc.value(), "時間切れじゃ。" + sc.word());
      };
    }
  },

  /* ================================================================
     ⑥ 研磨（追いかけ）
     荒れた所をなでて平らにする。磨きすぎると穴があく。荒れは増えつづける。
     ================================================================ */
  kenma: {
    name: "研磨", limit: 32000,
    tip: "荒れた所を指でこする。<b>2回で平ら、4回で削りすぎ</b>。荒れはどんどん出てくる。",
    start(svg, ui, done, lv) {
      const h = actHard(lv);
      const COLS = 6, ROWS = 4, N = COLS * ROWS, CELL = 40, OX = 30, OY = 70;
      const lvl = new Array(N).fill(0);        // 0=平ら 1〜=荒れ -1=穴
      const TOTAL = 24;
      const sc = actScore(TOTAL);
      let last = -1, timer = null, added = 0, wave = 0, smoothed = 0;

      svg.innerHTML =
        `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
         <rect x="${OX - 8}" y="${OY - 8}" width="${COLS * CELL + 10}" height="${ROWS * CELL + 10}"
           rx="12" fill="#8a5a30"/>
         <g id="cells"></g>
         <text x="150" y="48" text-anchor="middle" font-size="15" fill="#8a6446">荒れた所をこする</text>
         <text x="150" y="268" text-anchor="middle" font-size="13" fill="#b08a63">つやが出たら、そこはもう十分</text>`;
      const gC = svg.querySelector("#cells");
      const paint = () => {
        gC.innerHTML = lvl.map((v, i) => {
          const c = i % COLS, r = (i / COLS) | 0;
          const fill = v === -1 ? "#6e4526" : v === 0 ? "#f2cf9d" : v === 1 ? "#c98d54" : "#a9713f";
          return `<rect x="${OX + c * CELL}" y="${OY + r * CELL}" width="${CELL - 3}"
            height="${CELL - 3}" rx="5" fill="${fill}"/>` +
            (v === -1 ? `<circle cx="${OX + c * CELL + 18}" cy="${OY + r * CELL + 18}" r="7" fill="#4a2f18"/>` : "");
        }).join("");
      };
      const rough = () => {
        const free = [];
        lvl.forEach((v, i) => { if (v === 0) free.push(i); });
        if (!free.length) return;
        const i = free[(Math.random() * free.length) | 0];
        lvl[i] = 1 + ((Math.random() * 2) | 0);
        added++;
        paint();
      };
      for (let i = 0; i < 6; i++) rough();
      paint();

      const rub = (p) => {
        const c = Math.floor((p.x - OX) / CELL), r = Math.floor((p.y - OY) / CELL);
        if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
        const i = r * COLS + c;
        if (i === last) return;
        last = i;
        if (lvl[i] === -1) return;
        if (lvl[i] > 0) {
          lvl[i]--;
          if (lvl[i] === 0) { sc.ok(); smoothed++; ui.say("つやが出た"); }
        } else {
          lvl[i] = -1; sc.ng(); ui.say("⚠️ 削りすぎて穴があいた");
        }
        paint();
        ui.progress(smoothed / TOTAL);
        actBanner(ui, wave + 1, 3, "荒れを平らに。平らな所は触るな", sc);
        if (smoothed >= TOTAL) finish();
      };
      const finish = () => {
        if (timer) { clearInterval(timer); timer = null; }
        done(sc.value(), sc.word());
      };

      timer = setInterval(() => {
        wave = smoothed < 8 ? 0 : smoothed < 16 ? 1 : 2;
        rough();
        if (wave >= 1) rough();
      }, 1500 / h);

      ui.onDown = () => { last = -1; };
      ui.onPoint = rub;
      ui.onStop = () => { if (timer) clearInterval(timer); };
      ui.onTimeout = finish;
      actBanner(ui, 1, 3, "荒れを平らに。平らな所は触るな", sc);
    }
  },

  /* ================================================================
     ⑦ 組立（形合わせ）
     部材を正しい窪みへ運ぶ。形と大きさで見分ける。
     ================================================================ */
  kumi: {
    name: "組立", limit: 45000,
    tip: "下の部材を押してから、<b>合う窪みを押す</b>。形と大きさを見て選ぶのじゃ。",
    start(svg, ui, done, lv) {
      const WAVES = [3, 4, 5];
      const TOTAL = WAVES.reduce((a, b) => a + b, 0);
      const sc = actScore(TOTAL);
      const FORMS = [
        { w: 54, h: 30, n: "横框" }, { w: 30, h: 60, n: "たて框" },
        { w: 44, h: 44, n: "鏡板" }, { w: 70, h: 22, n: "台輪" },
        { w: 24, h: 24, n: "だぼ" }, { w: 36, h: 52, n: "扉板" }
      ];
      let wave = 0, slots = [], picked = -1;

      const build = () => {
        const n = WAVES[wave];
        const pool = FORMS.slice().sort(() => Math.random() - .5).slice(0, n);
        slots = pool.map((f, i) => ({
          ...f, i, filled: false,
          sx: 40 + (i % 3) * 78, sy: 60 + ((i / 3) | 0) * 78
        }));
        const order = slots.map(s => s.i).sort(() => Math.random() - .5);
        slots.forEach(s => { s.tray = order.indexOf(s.i); });
        picked = -1;
        draw();
      };
      const draw = () => {
        const holes = slots.map(s => `
          <rect x="${s.sx - s.w / 2}" y="${s.sy - s.h / 2}" width="${s.w}" height="${s.h}" rx="4"
            fill="${s.filled ? "#a9713f" : "#6e4526"}" stroke="#8a5a30" stroke-width="2"/>`).join("");
        const tray = slots.filter(s => !s.filled).map(s => {
          const x = 36 + s.tray * 58;
          const sel = picked === s.i;
          return `<g><rect x="${x - s.w * .36}" y="${236 - s.h * .36}" width="${s.w * .72}"
            height="${s.h * .72}" rx="3" fill="${sel ? "#d8b45e" : "#c9a24b"}"
            stroke="${sel ? "#a97c14" : "#b08a63"}" stroke-width="${sel ? 3 : 1.6}"/></g>`;
        }).join("");
        svg.innerHTML =
          `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
           <rect x="16" y="34" width="268" height="168" rx="12" fill="#8a5a30"/>${holes}
           <rect x="16" y="208" width="268" height="60" rx="10" fill="#f3e7cd"/>${tray}
           <text x="150" y="26" text-anchor="middle" font-size="14" fill="#8a6446">窪みに合う部材を入れる</text>`;
      };

      ui.onDown = (p) => {
        if (p.y > 206) {
          const cand = slots.filter(s => !s.filled);
          let best = -1, bd = 1e9;
          cand.forEach(s => { const d = Math.abs(p.x - (36 + s.tray * 58)); if (d < bd) { bd = d; best = s.i; } });
          if (bd < 34) { picked = best; draw(); ui.say(`「${slots.find(s => s.i === picked).n}」を持った`); }
          return;
        }
        if (picked < 0) { ui.say("まず下から部材を選ぶのじゃ"); return; }
        const hit = slots.find(s => !s.filled &&
          Math.abs(p.x - s.sx) < s.w / 2 + 12 && Math.abs(p.y - s.sy) < s.h / 2 + 12);
        if (!hit) { ui.say("窪みを押すのじゃ"); return; }
        if (hit.i === picked) {
          hit.filled = true; sc.ok(); picked = -1;
          ui.say("かちり、と入った");
          ui.progress(sc.hit / TOTAL);
          draw();
          if (slots.every(s => s.filled)) {
            if (wave < 2) { wave++; setTimeout(build, 450); ui.say(`—— 第${wave + 1}波 ——`); }
            else setTimeout(() => done(sc.value(), sc.word()), 400);
          }
        } else {
          sc.ng(); picked = -1; draw();
          ui.say("⚠️ 形が合わん");
        }
        actBanner(ui, wave + 1, 3, "部材を選んで窪みへ", sc);
      };
      ui.onTimeout = () => done(sc.value(), "時間切れじゃ。" + sc.word());
      actBanner(ui, 1, 3, "部材を選んで窪みへ", sc);
      build();
    }
  },

  /* ================================================================
     ⑧ 布張り（方向スワイプ）
     しわが出る。矢印の向きへ指をはらう。放っておくと癖がついてしまう。
     ================================================================ */
  hari: {
    name: "張り", limit: 60000,
    tip: "しわが出たら、<b>矢印の向きへ指をはらう</b>。放っておくと癖がつくぞ。",
    start(svg, ui, done, lv) {
      const h = actHard(lv);
      const WAVES = [{ n: 6, life: 3400 }, { n: 7, life: 2700 }, { n: 8, life: 2100 }];
      const TOTAL = WAVES.reduce((s, w) => s + w.n, 0);
      const sc = actScore(TOTAL);
      const DIRS = [{ x: 1, y: 0, a: 0 }, { x: -1, y: 0, a: 180 },
                    { x: 0, y: 1, a: 90 }, { x: 0, y: -1, a: -90 }];
      let wave = 0, spawned = 0, resolved = 0, timer = null, nextAt = 0;
      const marks = [];

      svg.innerHTML =
        `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
         <rect x="24" y="44" width="252" height="212" rx="16" fill="#8a5a30"/>
         <rect x="34" y="54" width="232" height="192" rx="12" fill="#b5c9a4"/>
         <g id="marks"></g>
         <text x="150" y="286" text-anchor="middle" font-size="14" fill="#8a6446">矢印の向きへはらう</text>`;
      const gM = svg.querySelector("#marks");

      const spawn = () => {
        const d = DIRS[(Math.random() * 4) | 0];
        const x = actRand(70, 230), y = actRand(90, 212);
        const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
        el.setAttribute("transform", `translate(${x},${y})`);
        el.innerHTML =
          `<circle r="26" fill="#9cb489" opacity=".5"/>
           <circle class="life" r="26" fill="none" stroke="#7a9c6e" stroke-width="4"
             stroke-dasharray="163" stroke-dashoffset="0"/>
           <g transform="rotate(${d.a})">
             <path d="M-13 0 H10 M3 -7 L11 0 L3 7" stroke="#4a5f42" stroke-width="4"
               fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
        gM.appendChild(el);
        marks.push({ el, x, y, d, born: Date.now() });
        spawned++;
      };
      const kill = (i) => { marks[i].el.remove(); marks.splice(i, 1); resolved++; ui.progress(resolved / TOTAL); };

      const step = () => {
        const now = Date.now();
        const need = WAVES.slice(0, wave + 1).reduce((s, w) => s + w.n, 0);
        if (spawned < need && now > nextAt) {
          spawn(); nextAt = now + actRand(500, 950) / h;
        }
        const life = WAVES[wave].life / h;
        for (let i = marks.length - 1; i >= 0; i--) {
          const m = marks[i];
          const r = (now - m.born) / life;
          const ring = m.el.querySelector(".life");
          if (ring) ring.setAttribute("stroke-dashoffset", Math.min(163, r * 163));
          if (r >= 1) { sc.ng(); ui.say("しわに癖がついてしまった"); kill(i); }
        }
        if (spawned >= need && !marks.length) {
          if (wave < 2) { wave++; nextAt = Date.now() + 500; ui.say(`—— 第${wave + 1}波 ——`); }
          else { if (timer) clearInterval(timer); setTimeout(() => done(sc.value(), sc.word()), 300); }
        }
      };

      let from = null;
      ui.onDown = (p) => { from = p; };
      ui.onUp = (p) => {
        if (!from) return;
        const s = from; from = null;
        let idx = -1, bd = 1e9;
        marks.forEach((m, i) => { const d = actDist(s, m); if (d < bd) { bd = d; idx = i; } });
        if (idx < 0 || bd > 46) return;
        const m = marks[idx];
        const dx = p.x - s.x, dy = p.y - s.y;
        const len = Math.hypot(dx, dy);
        const dot = len > 0 ? (dx * m.d.x + dy * m.d.y) / len : 0;
        if (len > 26 && dot > .72) { sc.ok(); ui.say(dot > .95 ? "✨ まっすぐ伸びた" : "しわが消えた"); }
        else { sc.ng(); ui.say("⚠️ 向きが違う。布が寄った"); }
        kill(idx);
        actBanner(ui, wave + 1, 3, "矢印の向きへはらう", sc);
      };
      ui.onStop = () => { if (timer) clearInterval(timer); };
      ui.onTimeout = () => { if (timer) clearInterval(timer); done(sc.value(), sc.word()); };
      actBanner(ui, 1, 3, "矢印の向きへはらう", sc);
      nextAt = Date.now() + 400;
      timer = setInterval(step, 16);
    }
  },

  /* ================================================================
     ⑨ 金具（角度合わせ）
     ねじの溝を、印と同じ向きにそろえて締める。
     ================================================================ */
  kanagu: {
    name: "金具", limit: 45000,
    tip: "ねじのまわりを指でなぞって<b>溝を印に合わせ</b>、指を離して締める。",
    start(svg, ui, done, lv) {
      const h = actHard(lv);
      const WAVES = [{ n: 4, tol: 20 }, { n: 4, tol: 14 }, { n: 4, tol: 9 }];
      const TOTAL = WAVES.reduce((s, w) => s + w.n, 0);
      const sc = actScore(TOTAL);
      let wave = 0, left = WAVES[0].n, ang = 0, target = 0, cx = 150, cy = 150;

      const draw = () => {
        const tol = WAVES[wave].tol / h;
        const near = Math.abs(((ang - target + 540) % 360) - 180) > 180 - tol;
        svg.innerHTML =
          `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
           <rect x="30" y="56" width="240" height="188" rx="14" fill="#b07c4a"/>
           <circle cx="${cx}" cy="${cy}" r="62" fill="#8a5a30"/>
           <circle cx="${cx}" cy="${cy}" r="54" fill="${near ? "#d8b45e" : "#c9a24b"}"/>
           <g transform="rotate(${target} ${cx} ${cy})">
             <rect x="${cx - 2}" y="${cy - 78}" width="4" height="18" rx="2" fill="#7a9c6e"/>
             <rect x="${cx - 2}" y="${cy + 60}" width="4" height="18" rx="2" fill="#7a9c6e"/>
           </g>
           <g transform="rotate(${ang} ${cx} ${cy})">
             <rect x="${cx - 40}" y="${cy - 5}" width="80" height="10" rx="3" fill="#6e4526"/>
           </g>
           <text x="150" y="40" text-anchor="middle" font-size="15" fill="#8a6446">
             あと ${left} 本　（緑の印に溝を合わせる）</text>
           <text x="150" y="282" text-anchor="middle" font-size="13" fill="#b08a63">
             ねじのまわりを指でぐるりと</text>`;
      };
      const place = () => {
        target = (Math.random() * 180) | 0;
        ang = (target + 40 + Math.random() * 100) % 180;
        cx = 150; cy = 150;
        draw();
      };

      ui.onPoint = (p) => {
        const a = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
        ang = ((a % 180) + 180) % 180;
        draw();
      };
      ui.onUp = () => {
        const tol = WAVES[wave].tol / h;
        const diff = Math.min(Math.abs(ang - target), 180 - Math.abs(ang - target));
        if (diff <= tol) { sc.ok(); ui.say(diff < tol * .3 ? "✨ 寸分の狂いもない" : "締まった"); }
        else { sc.ng(); ui.say(`⚠️ ${Math.round(diff)}度ずれておる`); }
        left--; ui.progress((sc.hit + sc.miss) / TOTAL);
        if (left > 0) place();
        else if (wave < 2) {
          wave++; left = WAVES[wave].n; place();
          ui.say(`—— 第${wave + 1}波　許される狂いが小さくなる ——`);
        } else { setTimeout(() => done(sc.value(), sc.word()), 350); return; }
        actBanner(ui, wave + 1, 3, "溝を印に合わせる", sc);
      };
      ui.onTimeout = () => done(sc.value(), "時間切れじゃ。" + sc.word());
      actBanner(ui, 1, 3, "溝を印に合わせる", sc);
      place();
    }
  },

  /* ================================================================
     ⑩ 塗装（量の見きわめ）
     面をなでるたびに塗料が乗る。目安の線でちょうど止める。
     ================================================================ */
  tosou: {
    name: "塗装", limit: 45000,
    tip: "面をなでると塗料が乗る。<b>線のところでちょうど止める</b>。塗りすぎると垂れるぞ。",
    start(svg, ui, done, lv) {
      const h = actHard(lv);
      const WAVES = [3, 4, 4];
      const TOTAL = WAVES.reduce((a, b) => a + b, 0);
      const sc = actScore(TOTAL);
      let wave = 0, panels = [], last = -1;

      const build = () => {
        const n = WAVES[wave];
        panels = Array.from({ length: n }, (_, i) => ({
          i, got: 0,
          need: 2 + ((Math.random() * (2 + wave)) | 0),
          done: false, over: false
        }));
        last = -1;
        draw();
      };
      const draw = () => {
        const n = panels.length;
        const w = n <= 3 ? 76 : 58, gap = 8;
        const totalW = n * w + (n - 1) * gap, ox = (300 - totalW) / 2;
        svg.innerHTML =
          `<rect x="0" y="0" width="300" height="300" fill="#fdf6e6"/>
           <text x="150" y="40" text-anchor="middle" font-size="15" fill="#8a6446">
             面をなでて、線のところで止める</text>` +
          panels.map((p, i) => {
            const x = ox + i * (w + gap), H = 150, y = 60;
            const fill = Math.min(1, p.got / Math.max(1, p.need + 2)) * H;
            const col = p.over ? "#8a5a30" : p.done ? "#9dbb8f" : "#dfa96c";
            const lineY = y + H - (p.need / Math.max(1, p.need + 2)) * H;
            return `<rect x="${x}" y="${y}" width="${w}" height="${H}" rx="6" fill="#f3e7cd"
                      stroke="#b08a63" stroke-width="2"/>
                    <rect x="${x}" y="${y + H - fill}" width="${w}" height="${fill}" rx="4" fill="${col}"/>
                    <line x1="${x - 4}" y1="${lineY}" x2="${x + w + 4}" y2="${lineY}"
                      stroke="#b8563e" stroke-width="3"/>
                    <text x="${x + w / 2}" y="${y + H + 20}" text-anchor="middle" font-size="12"
                      fill="#8a6446">${p.over ? "垂れた" : p.done ? "ちょうど" : p.got + "/" + p.need}</text>`;
          }).join("") +
          `<text x="150" y="252" text-anchor="middle" font-size="13" fill="#b08a63">
             塗り終えた面は、もう触らぬこと</text>`;
      };

      ui.onDown = () => { last = -1; };
      ui.onPoint = (p) => {
        const n = panels.length;
        const w = n <= 3 ? 76 : 58, gap = 8;
        const totalW = n * w + (n - 1) * gap, ox = (300 - totalW) / 2;
        if (p.y < 60 || p.y > 210) return;
        const i = Math.floor((p.x - ox) / (w + gap));
        if (i < 0 || i >= n) return;
        if (p.x > ox + i * (w + gap) + w) return;
        if (i === last) return;
        last = i;
        const pan = panels[i];
        if (pan.over) return;
        pan.got++;
        if (pan.got === pan.need) { pan.done = true; sc.ok(); ui.say("✨ ちょうど良い厚みじゃ"); }
        else if (pan.got > pan.need) {
          pan.over = true; pan.done = false; sc.ng(); ui.say("⚠️ 塗りすぎて垂れた");
        }
        draw();
        const fin = panels.filter(x => x.done || x.over).length;
        ui.progress((sc.hit + sc.miss) / TOTAL);
        actBanner(ui, wave + 1, 3, "線でちょうど止める", sc);
        if (fin === n) {
          if (wave < 2) { wave++; setTimeout(build, 500); ui.say(`—— 第${wave + 1}波 ——`); }
          else setTimeout(() => done(sc.value(), sc.word()), 450);
        }
      };
      ui.onTimeout = () => done(sc.value(), "時間切れじゃ。" + sc.word());
      actBanner(ui, 1, 3, "線でちょうど止める", sc);
      build();
    }
  }
};

/* ---------- セーブ／ロード ---------- */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* 保存不可でも続行 */ }
}
function load() {
  let savedVer = 5;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      savedVer = data.ver;
      state = Object.assign(state, data);
    }
  } catch (e) { /* 壊れたデータは無視して新規開始 */ }

  /* --- 旧セーブデータからの移行（第1〜4章を壊さず引き継ぐ） --- */
  Object.keys(state.completed).forEach(id => {
    if (typeof state.completed[id] === "number") {
      state.completed[id] = { count: state.completed[id], best: null };
    }
  });
  if (typeof state.quality !== "number") state.quality = state.stepIndex;
  if (savedVer === undefined) {   // 第1・2章: 品質を100点制へ換算
    state.quality = state.currentId
      ? Math.max(0, Math.min(100, BASE_QUALITY + state.quality * 6)) : 0;
  }
  if (savedVer !== 4 && savedVer !== 5) {   // 第3章まで: 時間・設備を補完
    if (typeof state.day !== "number") state.day = 1;
    if (typeof state.hoursLeft !== "number") state.hoursLeft = HOURS_PER_DAY;
    if (!Array.isArray(state.gear)) state.gear = [];
    state.craftUsed = state.currentId ? state.stepIndex * 2 : 0;
  }
  if (savedVer !== 5 && savedVer !== 6) {   // 第4章まで: 材料・展示・来館者を補完
    Object.values(state.completed).forEach(rec => {
      if (rec && typeof rec === "object") {
        if (rec.bestScore === undefined) rec.bestScore = null;
        if (rec.bestPop === undefined) rec.bestPop = null;
      }
    });
    if (!state.materials || typeof state.materials !== "object") {
      state.materials = { walnut: 0, oak: 2, cherry: 0, brass: 0, glass: 0, cloth: 2 };
    }
    if (!Array.isArray(state.showroom)) state.showroom = [];
    if (typeof state.totalVisitors !== "number") state.totalVisitors = 0;
    if (!Array.isArray(state.seenBP)) state.seenBP = [];
    /* 旧セーブで制作途中なら、標準の組み合わせで続行（材料消費なし） */
    if (state.currentId && !state.craft) {
      state.craft = { design: "classic", wood: "oak", finish: "natural" };
    }
  }
  if (savedVer !== 6) {   // 第5章まで: 集中力・手帳・山場の記憶を補完
    if (typeof state.focus !== "number") state.focus = FOCUS_PER_DAY;
    if (typeof state.flaws !== "number") state.flaws = 0;
    if (!state.tool) state.tool = "normal";
    if (!Array.isArray(state.notebook)) state.notebook = [];
    if (!Array.isArray(state.knownCritical)) state.knownCritical = [];
    /* すでに作ったことのある家具は、山場を知っているものとして引き継ぐ */
    Object.keys(state.completed).forEach(id => {
      if (CRITICAL_STEP[id] !== undefined && state.knownCritical.indexOf(id) < 0) {
        state.knownCritical.push(id);
      }
    });
    state.ver = 6;
  }
  if (savedVer !== 7) {   // 第6章まで: 職人の名前と顔を用意する
    if (!state.player || typeof state.player !== "object") state.player = {};
    if (typeof state.player.name !== "string") state.player.name = "";
    if (!state.player.avatar || typeof state.player.avatar !== "object") {
      state.player.avatar = { skin:0, hairColor:1, hair:0, eyes:0, mouth:0, hat:0, glasses:0, beard:0 };
    }
    state.ver = 7;
  }
  if (savedVer !== 8) {   // 第7章まで: 職人アクションの記録欄を用意する
    if (!state.actionBest || typeof state.actionBest !== "object") state.actionBest = {};
    if (!state.actionStats || typeof state.actionStats !== "object") state.actionStats = {};
    state.ver = 8;
  }
  if (savedVer !== 9) {   // 第8章まで: 山場の出来を覚える欄を用意する
    if (state.actionScore === undefined) state.actionScore = null;
    state.ver = 9;
  }
  if (savedVer !== 10) {  // 第9章: 章・道具を用意する
    if (!state.tool) state.tool = "normal";
    /* 章の条件ができる前に作った家具は、Aランク以上なら「会心」として引き継ぐ。
       納期を守ったかどうかは記録に残っていないので、作り手に有利なほうに寄せる */
    Object.values(state.completed).forEach(rec => {
      if (rec && typeof rec === "object" && rec.ace === undefined) {
        rec.ace = rec.best === "S" || rec.best === "A";
      }
    });
    state.ver = 10;
  }
}

const $ = (sel) => document.querySelector(sel);
const furnitureById = (id) => FURNITURE.find(f => f.id === id);
const materialById = (id) => MATERIALS.find(m => m.id === id);
const designById = (id) => DESIGNS.find(d => d.id === id) || DESIGNS[0];
const finishById = (id) => FINISHES.find(f => f.id === id) || FINISHES[1];
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ヘンリーさんが呼びかけるときの、あなたの名前 */
const you = () => (state.player && state.player.name) || "見習い";
/* 名前はプレイヤーが打ち込むので、HTMLに差し込む前に必ず逃がす */
const esc = (t) => String(t).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* 図鑑・カードの絵。photo(将来のユーザー写真) → SVG → 絵文字 の順で採用 */
function artOf(entry, cls, filter) {
  if (entry.photo) {
    const st = filter ? ` style="filter:${filter}"` : "";
    return `<span class="${cls}"${st}><img src="${entry.photo}" alt="${esc(entry.name)}"></span>`;
  }
  if (SVG_ART[entry.art]) {
    const st = filter ? ` style="filter:${filter}"` : "";
    return `<span class="${cls}"${st}>${SVG_ART[entry.art]}</span>`;
  }
  return `<span class="icon">${entry.icon}</span>`;
}

function calcLevel(exp) {
  let lv = 1;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i]) lv = i + 1;
  return lv;
}

/* 童話のきれはしを何枚見つけたか */
const lettersFound = () => FURNITURE.filter(f => f.letter && state.stories.includes(f.id)).length;

/* 設計図の解放判定 */
function bpUnlocked(f) {
  if (!chapterOpen(chapterOf(f))) return false;   // 章が開いていなければ出ない
  const u = f.unlock;
  if (u.type === "level") return state.level >= u.v;
  if (u.type === "visitors") return state.totalVisitors >= u.v;
  if (u.type === "letters") return lettersFound() >= u.v;
  return false;
}
function bpCondLabel(f) {
  const u = f.unlock;
  if (u.type === "level") return `工房レベル ${u.v} で解放`;
  if (u.type === "visitors") return `のべ来館者 ${u.v} 人で解放`;
  if (u.type === "letters") return `童話のきれはし ${u.v} 枚で解放`;
  return "";
}
/* 新しく解放された設計図があれば告知文を返す */
function announceBP() {
  const now = FURNITURE.filter(bpUnlocked).map(f => f.id);
  const fresh = now.filter(id => !state.seenBP.includes(id));
  state.seenBP = now;
  if (!fresh.length) return "";
  confetti();
  return `　📜 新しい設計図「${fresh.map(id => furnitureById(id).name).join("・")}」を手に入れた！`;
}

/* 設備の効果 */
const hasGear = (id) => state.gear.includes(id);
const gearQualityBonus = () => GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectQ || 0), 0);
const gearPriceMult   = () => GEAR.filter(g => hasGear(g.id)).reduce((m, g) => m * (g.effectPrice || 1), 1);
const gearVisitorMult = () => GEAR.filter(g => hasGear(g.id)).reduce((m, g) => m * (g.effectVisitors || 1), 1);
const showSlots       = () => BASE_SLOTS + GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectSlots || 0), 0);
const speedBonus      = () => GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectSpeed || 0), 0);
const gearShopMult    = () => GEAR.filter(g => hasGear(g.id)).reduce((m, g) => m * (g.effectShop || 1), 1);
/* 1日ぶんの集中力と作業時間は、設備で伸びる */
const focusPerDay = () => FOCUS_PER_DAY +
  GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectFocus || 0), 0);
const hoursPerDay = () => HOURS_PER_DAY +
  GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectHours || 0), 0);
/* 材料の仕入れ値。割引は合計8割までにしておく */
const gearMatOff = () => Math.min(0.8,
  GEAR.filter(g => hasGear(g.id)).reduce((s, g) => s + (g.effectMatOff || 0), 0));
const matPrice = (m) => Math.max(10, Math.round(m.price * (1 - gearMatOff()) / 10) * 10);
/* 設備が買える状態か */
function gearUnlocked(g) {
  const u = g.unlock;
  if (!u) return true;
  if (u.type === "level") return state.level >= u.v;
  if (u.type === "dex") return dexFound() >= u.v;
  if (u.type === "gear") return hasGear(u.v);
  return true;
}
function gearCondLabel(g) {
  const u = g.unlock;
  if (!u) return "";
  if (u.type === "level") return `工房レベル ${u.v} で見えるようになる`;
  if (u.type === "dex") return `図鑑 ${u.v} マスで見えるようになる`;
  if (u.type === "gear") {
    const prev = GEAR.find(x => x.id === u.v);
    return `「${prev ? prev.name : u.v}」を導入すると見えるようになる`;
  }
  return "";
}
const effHours = (choice) => Math.max(1, choice.hours - speedBonus());

function calcRank(score) {
  for (const r of ["S", "A", "B"]) if (score >= RANKS[r].min) return r;
  return "C";
}
const rankBadge = (r) => `<span class="rank-badge rank-${r}">${r}</span>`;

function showMessage(text) {

function confetti() {
